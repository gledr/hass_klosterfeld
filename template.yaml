  - name: "Taupunkt Vorraum"
    unique_id: taupunkt_vorraum
    unit_of_measurement: "°C"
    state: >
      {% set T = states('sensor.basement_hallway_temperture') | float %}
      {% set RH = states('sensor.basement_hallway_humidity') | float %}
