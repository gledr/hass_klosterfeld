sensor:

  - name: "Taupunkt Aussen"
    unique_id: taupunkt_aussen
    unit_of_measurement: "°C"
    state: >
      {% set T = states('sensor.outdoor_temperature') | float %}
      {% set RH = states('sensor.outdoor_humidity') | float %}
      {% set a = 17.27 %}
      {% set b = 237.7 %}
      {% set alpha = ((a*T)/(b+T)) + (RH/100)|log %}
      {{ ((b*alpha)/(a-alpha)) | round(2) }}

  - name: "Taupunkt Technikraum"
    unique_id: taupunkt_technikraum
    unit_of_measurement: "°C"
    state: >
      {% set T = states('sensor.engineering_temperature') | float %}
      {% set RH = states('sensor.engineering_humidity') | float %}
      {% set a = 17.27 %}
      {% set b = 237.7 %}
      {% set alpha = ((a*T)/(b+T)) + (RH/100)|log %}
      {{ ((b*alpha)/(a-alpha)) | round(2) }}

  - name: "Taupunkt Hobby"
