binary_sensor:

  # Hitzeschutz-Gate. Sonne zählt nur als Hitze, wenn Azimut/Elevation die
  # Fassade treffen, die Helligkeit über der Lux-Schwelle liegt UND es warm
  # genug ist. Die Temperatur-Schwelle liegt in
  # input_number.beschattung_hitze_temp (einstellbar im Beschattungs-
  # Dashboard), früher fest 15 °C — zu niedrig: bei 17 °C Außentemperatur ist
  # das Rollo Gästezimmer den ganzen Tag auf und ab gefahren. float(22) ist
  # nur der Fallback, falls der Helper mal nicht lesbar ist.
  #
  # Winterbetrieb: nie Hitze — die Sonnenwärme soll rein, die Beschattung
  # bleibt im normalen Tag-Zustand. Quelle der Wahrheit ist die Heizsaison
  # (binary_sensor.heizsaison): wenn es draußen kalt genug ist, dass die
  # Heizung läuft, soll die Sonne ungehindert durch. Das ist dieselbe
  # Entscheidung, die automation heizung_betriebsart_automatik für GA 7/0/0
  # trifft — Rollo und Heizung hängen damit an derselben Jahreszeit-Entscheidung.
  #
  # input_select.beschattung_saison übersteuert das nur:
  #   "Winter"                    -> Hitzeschutz immer aus
  #   "Sommer"                    -> Hitzeschutz immer an (Ausnahme: zu dunkel/heiß)
  #   "Automatisch (Heizsaison)"  -> folge binary_sensor.heizsaison (Standard)
  # Unbekannt/unavailable gilt wie "Automatisch": lieber im Zweifel
  # beschatten als Sonnenwärme verschenken.

  - name: "Sonne trifft Sued"
    unique_id: sonne_trifft_sued
    delay_on:
      minutes: 5
    delay_off:
      minutes: 5
    state: >
      {% set wahl = states('input_select.beschattung_saison') %}
      {% set winter = wahl == 'Winter'
         or (wahl != 'Sommer' and is_state('binary_sensor.heizsaison', 'on')) %}
      {{ state_attr('sun.sun', 'azimuth') | float > 135
         and state_attr('sun.sun', 'azimuth') | float < 250
         and state_attr('sun.sun', 'elevation') | float > 10
         and states('sensor.helligkeit_sud') | float(0) > states('input_number.beschattung_lux_sud') | float(15000)
         and states('sensor.outdoor_temperature_avg') | float(0) > states('input_number.beschattung_hitze_temp') | float(22)
         and not winter }}

  - name: "Sonne trifft West"
    unique_id: sonne_trifft_west
    delay_on:
      minutes: 5
    delay_off:
      minutes: 5
    state: >
      {% set wahl = states('input_select.beschattung_saison') %}
      {% set winter = wahl == 'Winter'
         or (wahl != 'Sommer' and is_state('binary_sensor.heizsaison', 'on')) %}
      {{ state_attr('sun.sun', 'azimuth') | float > 200
         and state_attr('sun.sun', 'azimuth') | float < 315
         and state_attr('sun.sun', 'elevation') | float > 10
         and states('sensor.helligkeit_west') | float(0) > states('input_number.beschattung_lux_west') | float(15000)
         and states('sensor.outdoor_temperature_avg') | float(0) > states('input_number.beschattung_hitze_temp') | float(22)
         and not winter }}

  - name: "Sonne trifft Nord"
    unique_id: sonne_trifft_nord
    delay_on:
      minutes: 5
    delay_off:
      minutes: 5
    state: >
      {% set wahl = states('input_select.beschattung_saison') %}
      {% set winter = wahl == 'Winter'
         or (wahl != 'Sommer' and is_state('binary_sensor.heizsaison', 'on')) %}
      {{ (state_attr('sun.sun', 'azimuth') | float > 290
         or state_attr('sun.sun', 'azimuth') | float < 70)
         and state_attr('sun.sun', 'elevation') | float > 10
         and states('sensor.helligkeit_nord') | float(0) > states('input_number.beschattung_lux_nord') | float(15000)
         and states('sensor.outdoor_temperature_avg') | float(0) > states('input_number.beschattung_hitze_temp') | float(22)
         and not winter }}

  # Blendschutz Büro — unabhängig von Temperatur und Saison. Blendung ist
  # ein Licht-, kein Wärmeproblem: gerade die tiefe Herbst-/Wintersonne
  # scheint weit in den Raum, während "Sonne trifft Süd" in der Heizsaison
  # nie angeht. Gleicher Azimut-Bereich und gleiche Lux-Schwelle wie Süd,
  # aber schon ab 5° Elevation. delay_off 10 Min, damit eine Wolke das
  # Rollo nicht gleich wieder auffährt.
  - name: "Blendung Buero"
    unique_id: blendung_buero
    delay_on:
      minutes: 5
    delay_off:
      minutes: 10
    state: >
      {{ state_attr('sun.sun', 'azimuth') | float(0) > 135
         and state_attr('sun.sun', 'azimuth') | float(0) < 250
         and state_attr('sun.sun', 'elevation') | float(0) > 5
         and states('sensor.helligkeit_sud') | float(0) > states('input_number.beschattung_lux_sud') | float(15000) }}

  # Betriebsart der Heizung (KNX 7/0/0): on = Winter = Heizung aktiv,
  # off = Sommer = Heizung abgeschaltet. Bewusst als binary_sensor, damit
  # spätere Automationen nicht die 1/0-Logik der GA kennen müssen.
  - name: "Heizung aktiv"
    unique_id: heizung_aktiv
    device_class: heat
    # Unbekannte Betriebsart -> auch "Heizung" unbekannt, statt "aus"
    # vorzutäuschen und die Wärmepumpe verkehrt herum anzusteuern.
    availability: "{{ states('select.heizung_betriebsart') in ['Sommer', 'Winter'] }}"
    state: "{{ is_state('select.heizung_betriebsart', 'Winter') }}"

  # Status der Wärmepumpe: Heizbetrieb läuft oder nicht. Quelle ist der
  # HVAC-Mode von climate.altherma_leaving_water_temperature ("heat").
  # WICHTIG für die spätere Automatisierung: Das ist nur der Status, noch
  # keine Umschalt-Freigabe. "Heizt nicht" heißt auch "gerade kein Bedarf"
  # (Nachtabsenkung, milder Tag) — eine Sommer/Winter-Automation darf darauf
  # allein nicht schalten, sonst schaltet sie im Winter die Heizung ab, weil
  # die Wärmepumpe gerade Pause hat. Für die Umschaltung Außentemperatur +
  # Forecast mit Hysterese nehmen, die Wärmepumpe nur als Kontrollsignal.
  - name: "Wärmepumpe Heizen"
    unique_id: waermepumpe_heizen
    device_class: heat
    # Integration nicht erreichbar -> "unbekannt" statt "heizt nicht",
    # sonst sieht eine Automation das als Sommerbetrieb.
    availability: "{{ states('climate.altherma_leaving_water_temperature') not in ['unknown', 'unavailable'] }}"
    state: "{{ states('climate.altherma_leaving_water_temperature') == 'heat' }}"

  # Heizsaison = "es ist kalt genug, um zu heizen" (on = Winterbetrieb).
  # Das ist die Quelle für die automatische Sommer/Winter-Umschaltung —
  # bewusst NICHT binary_sensor.waermepumpe_heizen: "heizt gerade nicht" heißt
  # auch "gerade kein Bedarf", das würde die Heizung im Winter abschalten.
  #
  # Logik über das Forecast-Fenster der nächsten 2 Stunden:
  #   - Auch das wärmste Fenster noch < Schwelle -> Heizsaison AN
  #     (eine Kälteperiode kommt, jetzt ist es ohnehin kalt genug)
  #   - Auch das kälteste Fenster noch > Schwelle -> Heizsaison AUS
  #     (wärmere Periode steht an, abschalten lohnt)
  #   - Fenster kreuzt die Schwelle -> letzten Zustand halten (Totband)
  # delay_on/delay_off zusätzlich als Zeit-Hysterese: 2 h unter der Schwelle
  # für Winter, 12 h über der Schwelle für Sommer. Ein einzelner Ausschlag
  # umschaltet also nichts — und ein warmer Tag reicht nicht, um mitten im
  # Winter den Sommer zu erklären.
  - name: "Heizsaison"
    unique_id: heizsaison
    device_class: heat
    delay_on:
      hours: 2
    delay_off:
      hours: 12
    availability: >-
      {{ states('sensor.outdoor_temperature_avg') not in ['unknown', 'unavailable']
         and state_attr('weather.forecast_home', 'forecast') is not none }}
    state: >
      {% set schwelle = states('input_number.heizsaison_temp_schwelle') | float(12) %}
      {% set jetzt = states('sensor.outdoor_temperature_avg') | float(schwelle) %}
      {% set fc = state_attr('weather.forecast_home', 'forecast') %}
      {# Stunden-Fenster: die nächsten 2 Stunden. Achtung: kein {% for %} mit
         set- darin — Jinja-Scoping wirft die Zuweisung danach weg. #}
      {% set fenster = (fc[:2] | selectattr('temperature', 'defined')
                        | rejectattr('temperature', 'none')
                        | map(attribute='temperature') | map('float') | list)
                       if fc is not none else [] %}
      {% set werte = [jetzt] + fenster %}
      {% set w_warm = werte | max %}
      {% set w_kalt = werte | min %}
      {% if w_warm < schwelle %}
        true
      {% elif w_kalt > schwelle %}
        false
      {% else %}
        {# Totband: keinen Grund zum Umschalten, letzten Stand halten #}
        {{ is_state('binary_sensor.heizsaison', 'on') }}
      {% endif %}

sensor:

  - name: "Outdoor Temperature Avg"
    unique_id: outdoor_temperature_avg
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    state: >
      {% set sensor = states('sensor.outdoor_temperature') | float(0) %}
      {% set forecast = state_attr('weather.forecast_home', 'temperature') | float(sensor) %}
      {{ ((sensor + forecast) / 2) | round(1) }}

  - name: "Taupunkt Aussen"
    unique_id: taupunkt_aussen
    unit_of_measurement: "°C"
    state: >
      {% set T = states('sensor.outdoor_temperature') | float %}
      {% set RH = states('sensor.outdoor_humidity') | float %}
      {% set a = 17.27 %}
      {% set b = 237.7 %}
      {% set alpha = ((a*T)/(b+T)) + (RH/100)|log %}
      {{ ((b*alpha)/(a-alpha)) | round(2) }}

  - name: "Taupunkt Technikraum"
    unique_id: taupunkt_technikraum
    unit_of_measurement: "°C"
    state: >
      {% set T = states('sensor.engineering_temperature') | float %}
      {% set RH = states('sensor.engineering_humidity') | float %}
      {% set a = 17.27 %}
      {% set b = 237.7 %}
      {% set alpha = ((a*T)/(b+T)) + (RH/100)|log %}
      {{ ((b*alpha)/(a-alpha)) | round(2) }}

  - name: "Taupunkt Hobby"
    unique_id: taupunkt_hobby
    unit_of_measurement: "°C"
    state: >
      {% set T = states('sensor.hobby_temperature') | float %}
