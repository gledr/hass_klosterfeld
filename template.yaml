binary_sensor:

  - name: "Sonne trifft Sued"
    unique_id: sonne_trifft_sued
    delay_on:
      minutes: 5
    delay_off:
      minutes: 5
    state: >
      {{ state_attr('sun.sun', 'azimuth') | float > 135
         and state_attr('sun.sun', 'azimuth') | float < 250
         and state_attr('sun.sun', 'elevation') | float > 5
         and states('sensor.helligkeit_sud') | float(0) > states('input_number.beschattung_lux_sud') | float(15000)
         and states('sensor.outdoor_temperature_avg') | float(0) > 15 }}

  - name: "Sonne trifft West"
    unique_id: sonne_trifft_west
    delay_on:
      minutes: 5
    delay_off:
      minutes: 5
    state: >
      {{ state_attr('sun.sun', 'azimuth') | float > 200
         and state_attr('sun.sun', 'azimuth') | float < 315
         and state_attr('sun.sun', 'elevation') | float > 5
         and states('sensor.helligkeit_west') | float(0) > states('input_number.beschattung_lux_west') | float(15000)
         and states('sensor.outdoor_temperature_avg') | float(0) > 15 }}

  - name: "Sonne trifft Nord"
    unique_id: sonne_trifft_nord
    delay_on:
      minutes: 5
    delay_off:
      minutes: 5
    state: >
      {{ (state_attr('sun.sun', 'azimuth') | float > 290
         or state_attr('sun.sun', 'azimuth') | float < 70)
         and state_attr('sun.sun', 'elevation') | float > 5
         and states('sensor.helligkeit_nord') | float(0) > states('input_number.beschattung_lux_nord') | float(15000)
         and states('sensor.outdoor_temperature_avg') | float(0) > 15 }}

sensor:

  - name: "Outdoor Temperature Avg"
    unique_id: outdoor_temperature_avg
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    state: >
      {% set sensor = states('sensor.outdoor_temperature') | float(0) %}
      {% set forecast = state_attr('weather.forecast_home', 'temperature') | float(sensor) %}
      {{ ((sensor + forecast) / 2) | round(1) }}

  - name: "Taupunkt Aussen"
    unique_id: taupunkt_aussen
    unit_of_measurement: "°C"
    state: >
      {% set T = states('sensor.outdoor_temperature') | float %}
      {% set RH = states('sensor.outdoor_humidity') | float %}
      {% set a = 17.27 %}
      {% set b = 237.7 %}
      {% set alpha = ((a*T)/(b+T)) + (RH/100)|log %}
      {{ ((b*alpha)/(a-alpha)) | round(2) }}

  - name: "Taupunkt Technikraum"
    unique_id: taupunkt_technikraum
    unit_of_measurement: "°C"
    state: >
      {% set T = states('sensor.engineering_temperature') | float %}
      {% set RH = states('sensor.engineering_humidity') | float %}
      {% set a = 17.27 %}
      {% set b = 237.7 %}
      {% set alpha = ((a*T)/(b+T)) + (RH/100)|log %}
      {{ ((b*alpha)/(a-alpha)) | round(2) }}

  - name: "Taupunkt Hobby"
    unique_id: taupunkt_hobby
    unit_of_measurement: "°C"
    state: >
      {% set T = states('sensor.hobby_temperature') | float %}
      {% set RH = states('sensor.hobby_humidity') | float %}
      {% set a = 17.27 %}
      {% set b = 237.7 %}
      {% set alpha = ((a*T)/(b+T)) + (RH/100)|log %}
      {{ ((b*alpha)/(a-alpha)) | round(2) }}

  - name: "Taupunkt Lager"
    unique_id: taupunkt_lager
    unit_of_measurement: "°C"
    state: >
      {% set T = states('sensor.storage_temperature') | float %}
      {% set RH = states('sensor.storage_humidity') | float %}
      {% set a = 17.27 %}
      {% set b = 237.7 %}
      {% set alpha = ((a*T)/(b+T)) + (RH/100)|log %}
      {{ ((b*alpha)/(a-alpha)) | round(2) }}

  - name: "Taupunkt Schlafzimmer"
    unique_id: taupunkt_schlafzimmer
    unit_of_measurement: "°C"
    state: >
      {% set T = states('sensor.bedroom') | float %}
      {% set RH = states('sensor.bedroom_humidity') | float %}
      {% set a = 17.27 %}
      {% set b = 237.7 %}
      {% set alpha = ((a*T)/(b+T)) + (RH/100)|log %}
      {{ ((b*alpha)/(a-alpha)) | round(2) }}

  - name: "Outdoor Humidity"
    unique_id: outdoor_humidity_met
    unit_of_measurement: "%"
    state_class: measurement
    device_class: humidity
    state: "{{ state_attr('weather.forecast_home', 'humidity') }}"

  - name: "Lüftung Technikraum"
    unique_id: ventilation_technikraum_level
    state: >
      {% set RH = states('sensor.engineering_humidity') | float(0) %}
      {% set delta = (states('sensor.taupunkt_technikraum') | float) - (states('sensor.taupunkt_aussen') | float) %}
      {% if RH < 55 %}
        Luftfeuchtigkeit Okay
      {% elif delta > 2 %}
        Lüften stark
      {% elif delta > 0 %}
        Lüften wenig
      {% else %}
        Nicht lüften
      {% endif %}

  - name: "Lüftung Hobbyraum"
    unique_id: ventilation_hobby_level
    state: >
      {% set RH = states('sensor.hobby_humidity') | float(0) %}
      {% set delta = (states('sensor.taupunkt_hobby') | float) - (states('sensor.taupunkt_aussen') | float) %}
      {% if RH < 55 %}
        Luftfeuchtigkeit Okay
      {% elif delta > 2 %}
        Lüften stark
      {% elif delta > 0 %}
        Lüften wenig
      {% else %}
        Nicht lüften
      {% endif %}

  - name: "Lüftung Lager"
    unique_id: ventilation_lager_level
    state: >
      {% set RH = states('sensor.storage_humidity') | float(0) %}
      {% set delta = (states('sensor.taupunkt_lager') | float) - (states('sensor.taupunkt_aussen') | float) %}
      {% if RH < 55 %}
        Luftfeuchtigkeit Okay
      {% elif delta > 2 %}
        Lüften stark
      {% elif delta > 0 %}
        Lüften wenig
      {% else %}
        Nicht lüften
      {% endif %}

    - name: "Lüftung Schlafzimmer"
    unique_id: ventilation_schlafzimmer_level
    state: >
      {% set RH = states('sensor.bedroom_humidity') | float(0) %}
      {% set delta = (states('sensor.taupunkt_schlafzimmer') | float) - (states('sensor.taupunkt_aussen') | float) %}
      {% if RH < 55 %}
        Luftfeuchtigkeit Okay
      {% elif delta > 2 %}
        Lüften stark
      {% elif delta > 0 %}
        Lüften wenig
      {% else %}
        Nicht lüften
      {% endif %}

  - name: "Taupunkt Garage"
    unique_id: taupunkt_garage
    unit_of_measurement: "°C"
    state: >
      {% set T = states('sensor.garagentor_garage_temperature') | float %}
      {% set RH = states('sensor.garagentor_garage_humidity') | float %}
      {% set a = 17.27 %}
      {% set b = 237.7 %}
      {% set alpha = ((a*T)/(b+T)) + (RH/100)|log %}
      {{ ((b*alpha)/(a-alpha)) | round(2) }}

  - name: "Lüftung Garage"
    unique_id: ventilation_garage_level
    state: >
      {% set RH = states('sensor.garagentor_garage_humidity') | float(0) %}
      {% set delta = (states('sensor.taupunkt_garage') | float) - (states('sensor.taupunkt_aussen') | float) %}
      {% if RH < 50 %}
        Luftfeuchtigkeit Okay
      {% elif delta > 2 %}
        Lüften stark
      {% elif delta > 0 %}
        Lüften wenig
      {% else %}
        Nicht lüften
      {% endif %}

  # Scheinleistung S = U × I pro Phase (Strom-Sensor liefert mA → /1000)
  - name: "Scheinleistung Bezug L1"
    unique_id: scheinleistung_bezug_l1
    unit_of_measurement: "VA"
    device_class: apparent_power
    state_class: measurement
    state: >
      {% set u = states('sensor.netz_spannung_l1') | float(0) %}
      {% set i = states('sensor.strom_bezug_l1') | float(0) %}
      {{ (u * i / 1000) | round(1) }}

  - name: "Scheinleistung Bezug L2"
    unique_id: scheinleistung_bezug_l2
    unit_of_measurement: "VA"
    device_class: apparent_power
    state_class: measurement
    state: >
      {% set u = states('sensor.netz_spannung_l2') | float(0) %}
      {% set i = states('sensor.strom_bezug_l2') | float(0) %}
      {{ (u * i / 1000) | round(1) }}

  - name: "Scheinleistung Bezug L3"
    unique_id: scheinleistung_bezug_l3
    unit_of_measurement: "VA"
    device_class: apparent_power
    state_class: measurement
    state: >
      {% set u = states('sensor.netz_spannung_l3') | float(0) %}
      {% set i = states('sensor.strom_bezug_l3') | float(0) %}
      {{ (u * i / 1000) | round(1) }}

  - name: "Scheinleistung Bezug Gesamt"
    unique_id: scheinleistung_bezug_gesamt
    unit_of_measurement: "VA"
    device_class: apparent_power
    state_class: measurement
    state: >
      {% set s1 = states('sensor.scheinleistung_bezug_l1') | float(0) %}
      {% set s2 = states('sensor.scheinleistung_bezug_l2') | float(0) %}
      {% set s3 = states('sensor.scheinleistung_bezug_l3') | float(0) %}
      {{ (s1 + s2 + s3) | round(1) }}

  # Wirkleistung Total = Summe der Phasen (MDT 2/0/14 sendet nicht zuverlässig)
  - name: "Leistung Bezug Gesamt"
    unique_id: leistung_bezug_gesamt_template
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    state: >
      {% set p1 = states('sensor.leistung_bezug_l1') | float(0) %}
      {% set p2 = states('sensor.leistung_bezug_l2') | float(0) %}
      {% set p3 = states('sensor.leistung_bezug_l3') | float(0) %}
      {{ (p1 + p2 + p3) | round(1) }}

  - name: "Leistung Einspeisung Gesamt"
    unique_id: leistung_einspeisung_gesamt_template
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    state: >
      {% set p1 = states('sensor.leistung_einspeisung_l1') | float(0) %}
      {% set p2 = states('sensor.leistung_einspeisung_l2') | float(0) %}
      {% set p3 = states('sensor.leistung_einspeisung_l3') | float(0) %}
      {{ (p1 + p2 + p3) | round(1) }}