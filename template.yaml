      {% elif delta > 0 %}
        Lüften wenig
      {% else %}
        Nicht lüften
      {% endif %}

  # Küche kam später dazu. Die KNX-Sensoren 7/2/15 (Temperatur) und
  # 7/2/31 (Luftfeuchte) gab es schon, Taupunkt und Empfehlung fehlten
  # aber — ohne die beiden hier hätte die Karte im Lüften-Dashboard nur
  # zwei von vier Zeilen gefüllt.
