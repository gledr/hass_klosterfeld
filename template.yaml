    unique_id: taupunkt_kueche
    unit_of_measurement: "°C"
    state: >
      {% set T = states('sensor.kitchen_temperature') | float %}
      {% set RH = states('sensor.kitchen_humidity') | float %}
      {% set a = 17.27 %}
      {% set b = 237.7 %}
      {% set alpha = ((a*T)/(b+T)) + (RH/100)|log %}
      {{ ((b*alpha)/(a-alpha)) | round(2) }}

  - name: "Lüftung Küche"
