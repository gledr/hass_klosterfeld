input_datetime:
  # Zeitstempel des letzten Auto-Befehls der Beschattungs-Konvergenz
  # (und der Privacy/Messfahrt-Automationen). Die Manuell-Erkennung
  # vergleicht damit: Bewegt sich eine Beschattung, ohne dass vor kurzem
  # ein Auto-Befehl erging, gilt das als manueller Eingriff.
  beschattung_letzter_auto_befehl:
    name: Beschattung letzter Auto-Befehl
    has_date: true
    has_time: true
  # Zeitpunkt des letzten Dämmerungs-Endes (switch.twilight → off).
  # Basis für die Nacht-Verzögerung. Bewusst ein input_datetime und nicht
  # switch.twilight.last_changed: letzteres wird bei jedem HA-Neustart auf
  # "jetzt" gesetzt — ein Neustart um 3 Uhr nachts hätte sonst wie ein
  # frisches Dämmerungs-Ende gewirkt und alles aufgefahren.
  beschattung_daemmerung_ende:
    name: Beschattung letztes Dämmerungs-Ende
    has_date: true
    has_time: true


