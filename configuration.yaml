# ========================
# DEFAULT CONFIG
# ========================
default_config:

# Frontend Themes
frontend:
  themes: !include_dir_merge_named themes

# Automationen, Szenen, Scripts
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# ========================
# KNX INTEGRATION
# ========================
knx:
  event:
    - address: '8/5/0'         # Garage door pulse
    - address: "9/1/0"         # Glaspanel Küche – Kochen Toggle
    - address: '9/1/1'         # Glaspanel Wohnzimmer – TV Toggle
    - address: "9/1/2"         # Smart 55 – Nächste Szene
    - address: "9/1/3"         # Smart 55 – Vorherige Szene
    - address: "9/1/4"         # Smart 55 – Reset
    - address: "9/1/5"         # Smart 55 – Default Szene A (TBD)

  # ========================
  # LIGHTS
  # ========================
  light:
    # … alle deine bisherigen Lichter bleiben hier unverändert …
    # (Büro Licht, Guest Light, Bedroom Light … etc.)

  # ========================
  # SENSORS
  # ========================
  sensor:
    # Temperatur
    - name: "Office Temperature"
      state_address: "7/3/10"
      type: "temperature"
      sync_state: true
    - name: "Guest Room Temperature"
      state_address: "7/3/5"
      type: "temperature"
      sync_state: true
    - name: "Bedroom Temperature"
      state_address: "7/3/15"
      type: "temperature"
      sync_state: true
    - name: "Bathroom Temperature"
      state_address: "7/3/20"
      type: "temperature"
      sync_state: true
    - name: "WC OG Temperature"
      state_address: "7/3/25"
      type: "temperature"
      sync_state: true
    - name: "Gallery OG Temperature"
      state_address: "7/3/0"
      type: "temperature"
      sync_state: true
    - name: "Engineering Temperature"
      state_address: "7/1/0"
      type: "temperature"
      sync_state: true
    - name: "Hobby Temperature"
      state_address: "7/1/10"
      type: "temperature"
      sync_state: true
    - name: "Storage Temperature"
      state_address: "7/1/5"
      type: "temperature"
      sync_state: true
    - name: "Basement Hallway Temperature"
      state_address: "7/1/15"
      type: "temperature"
      sync_state: true
    - name: "Wardrobe Temperature"
      state_address: "7/2/10"
      type: "temperature"
      sync_state: true
    - name: "Utility Temperature"
      state_address: "7/2/5"
      type: "temperature"
      sync_state: true
    - name: "WC GF Temperature"
      state_address: "7/2/0"
      type: "temperature"
      sync_state: true
    - name: "Stairs EG-OG Temperature-EG"
      state_address: "7/2/25"
      type: "temperature"
      sync_state: true
    - name: "Stairs KG-EG Temperature-EG"
      state_address: "7/2/20"
      type: "temperature"
      sync_state: true
    - name: "Kitchen Temperature"
      state_address: "7/2/15"
      type: "temperature"
      sync_state: true
    - name: "Outdoor Temperature"
      state_address: "8/4/19"
      type: "temperature"
      sync_state: true
    # Helligkeit – umgeleitet nach Hausseiten
    - name: "Helligkeit Süd"
      state_address: "8/4/4"        # ursprünglich West
      type: "illuminance"
      sync_state: true
    - name: "Helligkeit West"
      state_address: "8/4/3"        # ursprünglich Süd
      type: "illuminance"
      sync_state: true
    - name: "Helligkeit Ost"
      state_address: "8/4/2"        # ursprünglich Ost
      type: "illuminance"
      sync_state: true
    - name: "Keller Vorraum Helligkeit"
      state_address: "5/1/17"
      type: "illuminance"
      sync_state: true
    - name: "Wohnküche Helligkeit"
      state_address: "5/2/37"
      type: "illuminance"
      sync_state: true
    - name: "Garderobe Helligkeit"
      state_address: "5/2/17"
      type: "illuminance"
      sync_state: true
    - name: "Gallerie Helligkeit"
      state_address: "5/3/17"
      type: "illuminance"
      sync_state: true
    # Wind
    - name: "Wind Speed"
      state_address: "8/4/9"
      type: "wind_speed_ms"

  # ========================
  # BINARY SENSORS (Locks / Twilight)
  # ========================
  binary_sensor:
    - name: "Bewegungsmelder Galerie OG"
      state_address: "5/3/0"
      device_class: motion
    - name: "Praesenzmelder Wohnzimmer"
      state_address: "5/2/20"
      device_class: presence
    - name: "Helligkeit Ost Lock"
      state_address: "8/4/5"
      device_class: lock
    - name: "Helligkeit Süd Lock"
      state_address: "8/4/6"
      device_class: lock
    - name: "Helligkeit West Lock"
      state_address: "8/4/7"
      device_class: lock
    - name: "Twilight"
      state_address: "8/4/1"
      device_class: opening   # Dämmerung als binary_sensor

  # ========================
  # COVERS
  # ========================
  cover:
    # … deine bisherigen Covers unverändert …

  # ========================
  # SWITCHES
  # ========================
  switch:
    - name: "Bathroom Handtuchheizkoerper"
      address: "2/3/0"
      state_address: "2/3/1"

# ========================
# INPUT BOOLEANS
# ========================
input_boolean:
  wohnkueche_override_kochen:
    name: Wohnküche Override Kochen
  wohnkueche_override_tv:
    name: Wohnküche Override TV
  wohnkueche_override_szene:
    name: Wohnküche Override Szene (Smart 55)

# ========================
# INPUT SELECTS
# ========================
input_select:
  wohnkueche_lichtmodus:
    name: Wohnküche Lichtmodus
    options:
      - fruehstueck
      - werktag_abend_aktiv
      - werktag_relax
      - spaetabend
      - nacht
      - wochenende_tag
      - wochenende_nachmittag
      - wochenende_abend

# ========================
# INPUT NUMBERS
# ========================
input_number:
  raffstore_badezimmer_vorher:
    name: Raffstore Badezimmer vorheriger Zustand
    initial: 100
    min: 0
    max: 100
    step: 1

# ========================
# TEMPLATE SENSORS
# ========================
template:
  - sensor:
      - name: "Outdoor Humidity"
        unique_id: outdoor_humidity_met
        unit_of_measurement: "%"
        state_class: measurement
        device_class: humidity
        availability: "{{ states('weather.forecast_home') not in ['unknown', 'unavailable'] }}"
        state: "{{ state_attr('weather.forecast_home', 'humidity') }}"