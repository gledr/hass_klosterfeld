#########################################################
# DEFAULT CONFIG
#########################################################

default_config:

# Frontend Themes
frontend:
  themes: !include_dir_merge_named themes

bluetooth:
  enabled: false

# Automationen, Szenen, Scripts
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
template: !include template.yaml

#########################################################
# LOVELACE DASHBOARDS (yaml-defined, git-tracked)
#########################################################
# Main dashboard ("Übersicht") is registered as the `lovelace` key below,
# pointing to ui-lovelace.yaml at repo root.
# Additional dashboards live in dashboard/*.yaml.
# HACS frontend cards must be installed before first load — see dashboard/README.md.
#
# Note: top-level `mode: yaml` was removed (deprecated in HA 2026.8).
# `resource_mode: yaml` keeps the resources list yaml-managed.
lovelace:
  resource_mode: yaml
  resources:
    - url: /hacsfiles/lovelace-mushroom/mushroom.js
      type: module
    - url: /hacsfiles/button-card/button-card.js
      type: module
    - url: /hacsfiles/mini-graph-card/mini-graph-card-bundle.js
      type: module
    - url: /hacsfiles/apexcharts-card/apexcharts-card.js
      type: module
    - url: /hacsfiles/lovelace-auto-entities/auto-entities.js
      type: module
    - url: /hacsfiles/lovelace-layout-card/layout-card.js
      type: module
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Übersicht
      icon: mdi:home
      show_in_sidebar: true
      require_admin: false
    lovelace-beschattung:
      mode: yaml
      filename: dashboard/beschattung.yaml
      title: Beschattung
      icon: mdi:blinds-horizontal
      show_in_sidebar: true
      require_admin: false
    lovelace-klima:
      mode: yaml
      filename: dashboard/klima.yaml
      title: Klima
      icon: mdi:home-thermometer
      show_in_sidebar: true
      require_admin: false
    lovelace-sicherheit:
      mode: yaml
      filename: dashboard/sicherheit.yaml
      title: Sicherheit
      icon: mdi:shield-home
      show_in_sidebar: true
      require_admin: false
    lovelace-luften:
      mode: yaml
      filename: dashboard/luften.yaml
      title: Lüften
      icon: mdi:hvac
      show_in_sidebar: true
      require_admin: false
    lovelace-erdgeschoss:
      mode: yaml
      filename: dashboard/erdgeschoss.yaml
      title: Erdgeschoss
      icon: mdi:home-floor-g
      show_in_sidebar: true
      require_admin: false
    lovelace-obergeschoss:
      mode: yaml
      filename: dashboard/obergeschoss.yaml
      title: Obergeschoss
      icon: mdi:home-roof
      show_in_sidebar: true
      require_admin: false
    lovelace-keller:
      mode: yaml
      filename: dashboard/keller.yaml
      title: Keller
      icon: mdi:home-floor-b
      show_in_sidebar: true
      require_admin: false
    lovelace-aussen:
      mode: yaml
      filename: dashboard/aussen.yaml
      title: Aussen
      icon: mdi:tree
      show_in_sidebar: true
      require_admin: false
    lovelace-energie:
      mode: yaml
      filename: dashboard/energie.yaml
      title: Energie
      icon: mdi:lightning-bolt
      show_in_sidebar: true
      require_admin: false

