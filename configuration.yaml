#########################################################
# HOMEKIT BRIDGES (YAML statt GUI-Config-Eintrag)
# -------------------------------------------------------
# WICHTIG: Vorher den GUI-Konfig-Eintrag "HomeKit" löschen
# (Einstellungen → Geräte & Dienste → HomeKit → ⋮ → Löschen),
# sonst gibt es zwei Bridges. Danach HA neu starten, die Bridges
# neu koppeln (QR-Codes) und die Räume EINMAL neu zuweisen.
#
# Warum zwei Bridges: Eine HomeKit-Bridge ist auf max. 150
# Accessories begrenzt. Das Haus hat aber deutlich mehr Geräte
# (30 KNX-Lichter, Rollläden, Schalter, Altherma, Shelly, BTHome,
# Medien, 95 Sensoren …). Ohne Aufteilung würde die Bridge je nach
# Lade-Reihenfolge mal Geräte rauswerfen → HomeKit legt sie als
# 'neu' an und vergisst Raum-Zuordnungen.
#
#   Bridge 1 (Hass Bridge):    Steuerung (Lichter, Rollläden,
#                              Schalter, Klima, Schlösser, Medien)
#   Bridge 2 (Hass Bridge 2):  Sensoren (Temp/Feuchte/Helligkeit/
#                              Wind) + Binär-Sensoren (Fenster etc.)
#
# Strommessung (Leistung/Arbeit/Strom/Spannung/Leistungsfaktor,
# Tag-/Nacht-Zähler, Shelly power/energy, Energiemeter) bleibt
# komplett außen vor.
#########################################################
homekit:
  - name: "Hass Bridge"
    port: 21065
    filter:
      include_domains:
        - light
        - cover
        - switch
        - climate
        - lock
        - fan
        - media_player
  - name: "Hass Bridge 2"
    port: 21064
    filter:
      include_domains:
        - binary_sensor
      include_entity_globs:
        - sensor.*_temperature
        - sensor.*_humidity
        - sensor.*helligkeit*
        - sensor.wind_speed