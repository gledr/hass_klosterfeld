      state_address: "7/3/10"
      type: "temperature"
      sync_state: true
    - name: "Guest Room Temperature"
      state_address: "7/3/5"
      type: "temperature"
      sync_state: true
    - name: "Bedroom Temperature"
      state_address: "7/3/15"
      type: "temperature"
      sync_state: true
    - name: "Bathroom Temperature"
      state_address: "7/3/20"
      type: "temperature"
      sync_state: true
    - name: "WC OG Temperature"
      state_address: "7/3/25"
      type: "temperature"
      sync_state: true
    - name: "Gallery OG Temperature"
      state_address: "7/3/0"
      type: "temperature"
      sync_state: true
    - name: "Engineering Temperature"
      state_address: "7/1/0"
      type: "temperature"
      sync_state: true
    - name: "Hobby Temperature"
      state_address: "7/1/10"
      type: "temperature"
      sync_state: true
    - name: "Storage Temperature"
      state_address: "7/1/5"
      type: "temperature"
      sync_state: true
    - name: "Basement Hallway Temperature"
