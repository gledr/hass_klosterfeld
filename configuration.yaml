      type: "temperature"
      sync_state: true
    - name: "Stairs KG-EG Temperature-EG"
      state_address: "7/2/20"
      type: "temperature"
      sync_state: true
    - name: "Kitchen Temperature"
      state_address: "7/2/15"
      type: "temperature"
      sync_state: true
    - name: "Outdoor Temperature"
      state_address: "8/4/19"
      type: "temperature"
      sync_state: true
    # Helligkeitssensoren
    - name: "Wohnküche Helligkeit"
      state_address: "5/2/37"
      type: "illuminance"
      sync_state: true
    - name: "Garderobe Helligkeit"
      state_address: "5/2/17"
      type: "illuminance"
      sync_state: true
    - name: "Gallerie Helligkeit"
      state_address: "5/3/17"
      type: "illuminance"
      sync_state: true
    - name: "Keller Vorraum Helligkeit"
      state_address: "5/1/17"
      type: "illuminance"
      sync_state: true
    # MDT Wetterstation Helligkeit & Twilight
    - name: "Helligkeit Ost"
      state_address: "8/4/2"
      type: "illuminance"
      sync_state: true
    - name: "Helligkeit Süd"
      state_address: "8/4/3"
      type: "illuminance"
      sync_state: true
    - name: "Helligkeit West"
      state_address: "8/4/4"
      type: "illuminance"
      sync_state: true
    - name: "Twilight"
      state_address: "8/4/1"
      type: "binary"
      device_class: light
      sync_state: true
    # Wind
    - name: "Wind Speed"
      state_address: "8/4/9"
      type: "wind_speed_ms"

  # ========================
  # BINARY SENSORS
  # ========================
  binary_sensor:
    - name: "Bewegungsmelder Galerie OG"
      state_address: "5/3/0"
      device_class: motion
    - name: "Praesenzmelder Wohnzimmer"
      state_address: "5/2/20"
      device_class: presence
    # NEU: Lock-GAs
    - name: "Helligkeit Ost Lock"
      state_address: "8/4/5"
      device_class: lock
    - name: "Helligkeit Süd Lock"
      state_address: "8/4/6"
      device_class: lock
    - name: "Helligkeit West Lock"
      state_address: "8/4/7"
      device_class: lock

  # ========================
  # COVERS (Raffstores / Jalousien)
  # ========================
  cover:
    # ... (deine bisherigen Cover-Einträge unverändert, inkl. Lamellenwinkel)

  # ========================
  # SWITCHES
  # ========================
  switch:
    - name: "Bathroom Handtuchheizkoerper"
      address: "2/3/0"
      state_address: "2/3/1"

  # ========================
  # INPUT BOOLEANS
  # ========================
  input_boolean:
    wohnkueche_override_kochen:
      name: Wohnküche Override Kochen
    wohnkueche_override_tv:
      name: Wohnküche Override TV
    wohnkueche_override_szene:
      name: Wohnküche Override Szene (Smart 55)

  # ========================
  # INPUT SELECTS
  # ========================
  input_select:
    wohnkueche_lichtmodus:
      name: Wohnküche Lichtmodus
      options:
        - fruehstueck
        - werktag_abend_aktiv
        - werktag_relax
        - spaetabend
        - nacht
        - wochenende_tag
        - wochenende_nachmittag
        - wochenende_abend

  # ========================
  # INPUT NUMBERS
  # ========================
  input_number:
    raffstore_badezimmer_vorher:
      name: Raffstore Badezimmer vorheriger Zustand
      initial: 100
      min: 0
      max: 100
      step: 1

  # ========================
  # TEMPLATE SENSORS
  # ========================
  template:
    - sensor:
        - name: "Outdoor Humidity"
          unique_id: outdoor_humidity_met
          unit_of_measurement: "%"
          state_class: measurement
          device_class: humidity
          availability: "{{ states('weather.forecast_home') not in ['unknown', 'unavailable'] }}"
          state: "{{ state_attr('weather.forecast_home', 'humidity') }}"