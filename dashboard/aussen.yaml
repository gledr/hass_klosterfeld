###############################################################################
# AUSSEN — Garage, Terrasse, Wetterstation, Außenbeleuchtung                   #
# Garage internals (vent / half / step) hidden behind expander.                #
###############################################################################
title: Aussen
views:
  - title: Aussen
    path: home
    icon: mdi:tree
    type: sections
    max_columns: 3
    sections:

      ###########################################################################
      # GARAGE                                                                  #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Garage
            icon: mdi:garage

          - type: custom:mushroom-cover-card
            entity: cover.garage_door_garage_door
            name: Garagentor
            show_position_control: true
            show_buttons_control: true

          - type: custom:mushroom-template-card
            primary: Status
            secondary: "{{ states('sensor.garage_door_garage_door_status') }} · {{ states('sensor.garage_door_garage_door_position') }} %"
            icon: mdi:garage-variant
            icon_color: >
              {% if is_state('cover.garage_door_garage_door','closed') %}green{% else %}amber{% endif %}

          - type: custom:mushroom-entity-card
            entity: switch.garage_door_garage_door_light
            name: Licht
            icon: mdi:lightbulb

          # Selten genutzt — eingeklappt
          - type: conditional
            conditions:
              - condition: state
                entity: cover.garage_door_garage_door
                state: "open"
            card:
              type: entities
              title: Erweitert (nur sichtbar wenn Tor offen)
              entities:
                - entity: switch.garage_door_garage_door_vent
                  name: Lüftungsposition
                - entity: switch.garage_door_garage_door_half
                  name: Halb öffnen
                - entity: switch.garage_door_garage_door_step
                  name: Schrittposition
                - entity: sensor.garage_door_garage_door_detailed_status
                  name: Detail-Status
                - entity: sensor.garage_door_garage_door_available
                  name: Verfügbar

          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.garagentor_garage_temperature
                icon: mdi:thermometer
              - type: entity
                entity: sensor.garagentor_garage_humidity
                icon: mdi:water-percent

      ###########################################################################
      # TERRASSE                                                                #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Terrasse
            icon: mdi:umbrella-beach

          - type: custom:mushroom-cover-card
            entity: cover.terrace_blinds
            name: Raffstore
            show_position_control: true
            show_tilt_position_control: true
            show_buttons_control: true
          - type: custom:mushroom-cover-card
            entity: cover.terrace_blinds_2
            name: Raffstore 2
            show_position_control: true
            show_tilt_position_control: true
            show_buttons_control: true

          - type: custom:mushroom-template-card
            primary: Auto-Beschattung
            secondary: >
              {% if is_state('input_boolean.beschattung_terrasse_override','on') %}
                Override aktiv — manuell überschrieben
              {% else %}
                Aktiv (folgt Sonne + Temperatur)
              {% endif %}
            icon: mdi:auto-fix
            icon_color: >
              {% if is_state('input_boolean.beschattung_terrasse_override','on') %}orange{% else %}green{% endif %}
            tap_action:
              action: toggle
              entity: input_boolean.beschattung_terrasse_override

          # TODO Shelly Terrassentür hier ergänzen sobald installiert
          # - type: custom:mushroom-entity-card
          #   entity: binary_sensor.<terrassentuer_shelly>_door
          #   name: Terrassentür

      ###########################################################################
      # AUSSENBELEUCHTUNG                                                       #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Beleuchtung
            icon: mdi:outdoor-lamp

          - type: custom:mushroom-light-card
            entity: light.main_door_light
            name: Haustür
          # TODO ggf. weitere Außenleuchten ergänzen (Terrasse, Carport, Garten?)

      ###########################################################################
      # WETTERSTATION                                                           #
      ###########################################################################
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Wetterstation
            icon: mdi:weather-cloudy-clock

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-chips-card
                chips:
                  - type: entity
                    entity: sensor.outdoor_temperature
                    icon: mdi:thermometer
                    name: Temp
                  - type: entity
                    entity: sensor.outdoor_humidity
                    icon: mdi:water-percent
                    name: rel. F.
                  - type: entity
                    entity: sensor.wind_speed
                    icon: mdi:weather-windy
                    name: Wind
                  - type: entity
                    entity: sun.sun
                    icon: mdi:white-balance-sunny
                    name: Sonne

          - type: horizontal-stack
            cards:
              - type: custom:mini-graph-card
                name: Helligkeit Ost
                entities:
                  - entity: sensor.helligkeit_ost
                hours_to_show: 12
                points_per_hour: 4
                line_color: amber
              - type: custom:mini-graph-card
                name: Helligkeit Süd
                entities:
                  # TODO: template.yaml referenziert helligkeit_sud (ohne e),
                  # altes Aussen-Dashboard hatte helligkeit_sud — bitte verifizieren.
                  - entity: sensor.helligkeit_sud
                hours_to_show: 12
                points_per_hour: 4
                line_color: orange
              - type: custom:mini-graph-card
                name: Helligkeit West
                entities:
                  - entity: sensor.helligkeit_west
                hours_to_show: 12
                points_per_hour: 4
                line_color: red

          - type: entities
            title: Sensor-Locks
            entities:
              - entity: binary_sensor.helligkeit_ost_lock
                name: Lock Ost
              - entity: binary_sensor.helligkeit_sud_lock
                name: Lock Süd
              - entity: binary_sensor.helligkeit_west_lock
                name: Lock West
