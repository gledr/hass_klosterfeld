###############################################################################
# ENERGIE — Übersichts-Dashboard für MDT-Energiemesser (ohne PV)                #
###############################################################################
title: Energie
views:
  - title: Übersicht
    path: home
    icon: mdi:lightning-bolt
    type: sections
    max_columns: 3
    sections:

      ###########################################################################
      # NETZ-STATUS                                                             #
      ###########################################################################
      - type: grid
        column_span: 3
        cards:
          - type: entities
            title: Netz-Status
            entities:
              - entity: binary_sensor.netzspannungsfehler
                name: Netzspannungsfehler
                icon: mdi:flash-alert

      ###########################################################################
      # PHASE L1                                                                #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Phase L1
            icon: mdi:numeric-1-circle

          - type: entities
            entities:
              - entity: sensor.netzspannung_l1
                name: Spannung
                icon: mdi:sine-wave
              - entity: sensor.leistung_bezug_l1
                name: Leistung Bezug
                icon: mdi:transmission-tower-import
              - entity: sensor.strom_bezug_l1
                name: Strom Bezug
                icon: mdi:current-ac
            state_color: false

          - type: custom:mini-graph-card
            name: Strom L1 — Bezug (12h)
            entities:
              - entity: sensor.strom_bezug_l1
                name: Bezug
                color: '#d97706'
            hours_to_show: 12
            points_per_hour: 4
            line_width: 2
            show:
              labels: true
              extrema: true
              fill: false

      ###########################################################################
      # PHASE L2                                                                #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Phase L2
            icon: mdi:numeric-2-circle

          - type: entities
            entities:
              - entity: sensor.netzspannung_l2
                name: Spannung
                icon: mdi:sine-wave
              - entity: sensor.leistung_bezug_l2
                name: Leistung Bezug
                icon: mdi:transmission-tower-import
              - entity: sensor.strom_bezug_l2
                name: Strom Bezug
                icon: mdi:current-ac
            state_color: false

          - type: custom:mini-graph-card
            name: Strom L2 — Bezug (12h)
            entities:
              - entity: sensor.strom_bezug_l2
                name: Bezug
                color: '#d97706'
            hours_to_show: 12
            points_per_hour: 4
            line_width: 2
            show:
              labels: true
              extrema: true
              fill: false

      ###########################################################################
      # PHASE L3                                                                #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Phase L3
            icon: mdi:numeric-3-circle

          - type: entities
            entities:
              - entity: sensor.netzspannung_l3
                name: Spannung
                icon: mdi:sine-wave
              - entity: sensor.leistung_bezug_l3
                name: Leistung Bezug
                icon: mdi:transmission-tower-import
              - entity: sensor.strom_bezug_l3
                name: Strom Bezug
                icon: mdi:current-ac
            state_color: false

          - type: custom:mini-graph-card
            name: Strom L3 — Bezug (12h)
            entities:
              - entity: sensor.strom_bezug_l3
                name: Bezug
                color: '#d97706'
            hours_to_show: 12
            points_per_hour: 4
            line_width: 2
            show:
              labels: true
              extrema: true
              fill: false

      ###########################################################################
      # GESAMT-LIVE                                                             #
      ###########################################################################
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Gesamt — Live
            icon: mdi:home-lightning-bolt

          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.leistung_bezug_gesamt
                name: Leistung Bezug
                icon: mdi:transmission-tower-import
                icon_color: amber

          - type: custom:mini-graph-card
            name: Leistung Gesamt — Bezug (24h)
            entities:
              - entity: sensor.leistung_bezug_gesamt
                name: Bezug
                color: '#d97706'
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            show:
              labels: true
              extrema: true
              fill: true

      ###########################################################################
      # ENERGIE-BILANZ (kWh)                                                    #
      ###########################################################################
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Energie-Bilanz (kWh)
            icon: mdi:counter

          - type: entities
            title: Bezug — Zählerstände
            entities:
              - entity: sensor.arbeit_bezug_gesamt
                name: Bezug Gesamt
                icon: mdi:transmission-tower-import
              - type: divider
              - entity: sensor.arbeit_bezug_l1
                name: Bezug L1
              - entity: sensor.arbeit_bezug_l2
                name: Bezug L2
              - entity: sensor.arbeit_bezug_l3
                name: Bezug L3

          - type: custom:mini-graph-card
            name: Bezug — Zählerstand (7 Tage)
            entities:
              - entity: sensor.arbeit_bezug_gesamt
                name: Bezug
                color: '#d97706'
            hours_to_show: 168
            points_per_hour: 1
            line_width: 2
            show:
              labels: true
              extrema: true

      ###########################################################################
      # PHASEN-VERGLEICH                                                        #
      ###########################################################################
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Phasen-Vergleich
            icon: mdi:chart-multiline

          - type: custom:mini-graph-card
            name: Strom Bezug — alle Phasen (24h)
            entities:
              - entity: sensor.strom_bezug_l1
                name: L1
              - entity: sensor.strom_bezug_l2
                name: L2
              - entity: sensor.strom_bezug_l3
                name: L3
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            show:
              labels: true
              extrema: true

          - type: custom:mini-graph-card
            name: Leistung Bezug — alle Phasen (24h)
            entities:
              - entity: sensor.leistung_bezug_l1
                name: L1
              - entity: sensor.leistung_bezug_l2
                name: L2
              - entity: sensor.leistung_bezug_l3
                name: L3
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            show:
              labels: true
              extrema: true

          - type: custom:mini-graph-card
            name: Spannung — alle Phasen (12h)
            entities:
              - entity: sensor.netzspannung_l1
                name: L1
              - entity: sensor.netzspannung_l2
                name: L2
              - entity: sensor.netzspannung_l3
                name: L3
            hours_to_show: 12
            points_per_hour: 4
            line_width: 2
            show:
              labels: true
              extrema: true
