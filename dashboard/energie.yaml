###############################################################################
# ENERGIE — MDT-Energiemesser (ohne PV)                                        #
#                                                                              #
# Zwei Tabs:                                                                   #
#   Übersicht — was man wissen will: Leistung jetzt, Verbrauch heute/Woche/    #
#               Monat, Wärmepumpe                                              #
#   Details   — pro Phase (Spannung, P, S, cos φ, Strom), Phasen-Vergleich,    #
#               Lichtleistung OG                                               #
# Vorher hatte jede Phase eine eigene Strom-Kurve UND es gab dieselben Kurven   #
# noch einmal im Phasen-Vergleich — jetzt nur noch der Vergleich.              #
###############################################################################
title: Energie
views:
  #############################################################################
  # TAB 1 — ÜBERSICHT                                                         #
  #############################################################################
  - title: Übersicht
    path: home
    icon: mdi:lightning-bolt
    type: sections
    max_columns: 3

    badges:
      - type: entity
        entity: sensor.leistung_bezug_gesamt
        name: Jetzt
      - type: entity
        entity: sensor.energie_bezug_tag
        name: Heute
      - type: entity
        entity: binary_sensor.netzspannungsfehler
        name: Netzfehler
        visibility:
          - condition: state
            entity: binary_sensor.netzspannungsfehler
            state: "on"

    sections:

      ###########################################################################
      # LEISTUNG LIVE                                                           #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Leistung
            icon: mdi:home-lightning-bolt
            badges:
              - type: entity
                entity: sensor.scheinleistung_bezug_gesamt
                name: Schein

          - type: custom:mini-graph-card
            name: Bezug 24 h
            entities:
              - entity: sensor.leistung_bezug_gesamt
                name: Bezug
                color: '#d97706'
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            show:
              labels: true
              extrema: true
              fill: true

      ###########################################################################
      # VERBRAUCH                                                               #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Verbrauch
            icon: mdi:counter

          - type: glance
            columns: 3
            entities:
              - entity: sensor.energie_bezug_tag
                name: Heute
              - entity: sensor.energie_bezug_woche
                name: Woche
              - entity: sensor.energie_bezug_monat
                name: Monat

          - type: entities
            entities:
              - entity: sensor.arbeit_bezug_gesamt
                name: Zählerstand
                icon: mdi:transmission-tower-import

          - type: custom:expander-card
            title: Zählerstand je Phase
            expanded: false
            cards:
              - type: entities
                entities:
                  - entity: sensor.arbeit_bezug_l1
                    name: Bezug L1
                  - entity: sensor.arbeit_bezug_l2
                    name: Bezug L2
                  - entity: sensor.arbeit_bezug_l3
                    name: Bezug L3
              - type: custom:mini-graph-card
                name: Zählerstand 7 Tage
                entities:
                  - entity: sensor.arbeit_bezug_gesamt
                    name: Bezug
                    color: '#d97706'
                hours_to_show: 168
                points_per_hour: 1
                line_width: 2
                show:
                  labels: true
                  extrema: true

      ###########################################################################
      # WÄRMEPUMPE (LWP)                                                        #
      ###########################################################################
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Wärmepumpe — Heizen
            icon: mdi:heat-pump

          - type: glance
            columns: 3
            entities:
              - entity: sensor.altherma_climatecontrol_heating_daily_electrical_consumption
                name: Heute
              - entity: sensor.altherma_climatecontrol_heating_weekly_electrical_consumption
                name: Woche
              - entity: sensor.altherma_climatecontrol_heating_yearly_electrical_consumption
                name: Jahr
            grid_options:
              columns: 6

          - type: custom:mini-graph-card
            name: Tagesverbrauch 7 Tage
            entities:
              - entity: sensor.altherma_climatecontrol_heating_daily_electrical_consumption
                name: Heizen
                color: '#d97706'
            hours_to_show: 168
            points_per_hour: 1
            line_width: 2
            show:
              labels: true
              extrema: true
            grid_options:
              columns: 6

  #############################################################################
  # TAB 2 — DETAILS                                                           #
  #############################################################################
  - title: Details
    path: details
    icon: mdi:sine-wave
    type: sections
    max_columns: 3
    sections:

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Phase L1
            icon: mdi:numeric-1-circle
          - type: entities
            entities:
              - entity: sensor.netz_spannung_l1
                name: Spannung
                icon: mdi:sine-wave
              - entity: sensor.leistung_bezug_l1
                name: Wirkleistung P
                icon: mdi:transmission-tower-import
              - entity: sensor.scheinleistung_bezug_l1
                name: Scheinleistung S
                icon: mdi:flash-outline
              - entity: sensor.leistungsfaktor_l1
                name: Leistungsfaktor cos φ
                icon: mdi:angle-acute
              - entity: sensor.strom_bezug_l1
                name: Strom Bezug
                icon: mdi:current-ac

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Phase L2
            icon: mdi:numeric-2-circle
          - type: entities
            entities:
              - entity: sensor.netz_spannung_l2
                name: Spannung
                icon: mdi:sine-wave
              - entity: sensor.leistung_bezug_l2
                name: Wirkleistung P
                icon: mdi:transmission-tower-import
              - entity: sensor.scheinleistung_bezug_l2
                name: Scheinleistung S
                icon: mdi:flash-outline
              - entity: sensor.leistungsfaktor_l2
                name: Leistungsfaktor cos φ
                icon: mdi:angle-acute
              - entity: sensor.strom_bezug_l2
                name: Strom Bezug
                icon: mdi:current-ac

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Phase L3
            icon: mdi:numeric-3-circle
          - type: entities
            entities:
              - entity: sensor.netz_spannung_l3
                name: Spannung
                icon: mdi:sine-wave
              - entity: sensor.leistung_bezug_l3
                name: Wirkleistung P
                icon: mdi:transmission-tower-import
              - entity: sensor.scheinleistung_bezug_l3
                name: Scheinleistung S
                icon: mdi:flash-outline
              - entity: sensor.leistungsfaktor_l3
                name: Leistungsfaktor cos φ
                icon: mdi:angle-acute
              - entity: sensor.strom_bezug_l3
                name: Strom Bezug
                icon: mdi:current-ac

      ###########################################################################
      # PHASEN-VERGLEICH                                                        #
      ###########################################################################
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Phasen-Vergleich
            icon: mdi:chart-multiline
            badges:
              - type: entity
                entity: binary_sensor.netzspannungsfehler
                name: Netzfehler

          - type: custom:mini-graph-card
            name: Strom 24 h
            entities:
              - entity: sensor.strom_bezug_l1
                name: L1
              - entity: sensor.strom_bezug_l2
                name: L2
              - entity: sensor.strom_bezug_l3
                name: L3
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            show:
              labels: true
              extrema: true
              state: false
            grid_options:
              columns: 4

          - type: custom:mini-graph-card
            name: Leistung 24 h
            entities:
              - entity: sensor.leistung_bezug_l1
                name: L1
              - entity: sensor.leistung_bezug_l2
                name: L2
              - entity: sensor.leistung_bezug_l3
                name: L3
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            show:
              labels: true
              extrema: true
              state: false
            grid_options:
              columns: 4

          - type: custom:mini-graph-card
            name: Spannung 12 h
            entities:
              - entity: sensor.netz_spannung_l1
                name: L1
              - entity: sensor.netz_spannung_l2
                name: L2
              - entity: sensor.netz_spannung_l3
                name: L3
            hours_to_show: 12
            points_per_hour: 4
            line_width: 2
            show:
              labels: true
              extrema: true
              state: false
            grid_options:
              columns: 4

      ###########################################################################
      # LICHT OBERGESCHOSS                                                      #
      ###########################################################################
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Lichtleistung OG — Deckenlichter
            icon: mdi:ceiling-light

          - type: glance
            columns: 6
            entities:
              - entity: sensor.leistung_schlafzimmer_deckenlicht
                name: Schlafzimmer
              - entity: sensor.leistung_buro_deckenlicht
                name: Büro
              - entity: sensor.leistung_gastezimmer_deckenlicht
                name: Gästezimmer
              - entity: sensor.leistung_bad_deckenlicht
                name: Bad
              - entity: sensor.leistung_wc_og_deckenlicht
                name: WC OG
              - entity: sensor.leistung_gallerie_deckenlicht
                name: Galerie

          - type: custom:mini-graph-card
            name: Deckenlichter 24 h
            entities:
              - entity: sensor.leistung_schlafzimmer_deckenlicht
                name: Schlafzimmer
                color: '#d97706'
              - entity: sensor.leistung_buro_deckenlicht
                name: Büro
                color: '#0ea5e9'
              - entity: sensor.leistung_gastezimmer_deckenlicht
                name: Gästezimmer
                color: '#84cc16'
              - entity: sensor.leistung_bad_deckenlicht
                name: Bad
                color: '#ef4444'
              - entity: sensor.leistung_wc_og_deckenlicht
                name: WC OG
                color: '#a855f7'
              - entity: sensor.leistung_gallerie_deckenlicht
                name: Galerie
                color: '#f59e0b'
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            show:
              labels: true
              extrema: true
              fill: false
