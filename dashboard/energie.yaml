      ###########################################################################
      # PHASEN-VERGLEICH                                                        #
      # Drei Phasen gleichzeitig — auffällige Asymmetrien sofort sichtbar       #
      ###########################################################################
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Phasen-Vergleich
            icon: mdi:chart-multiline

          - type: custom:mini-graph-card
            name: Bezug-Strom alle Phasen (A, 24h)
            entities:
