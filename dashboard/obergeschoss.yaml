          - type: custom:mini-graph-card
            name: Leistung Verbrauch Deckenlicht (12h)
            entities:
              - entity: sensor.leistung_bad_deckenlicht
                name: Leistung
                color: '#d97706'
            hours_to_show: 12
            points_per_hour: 4
            line_width: 2
            show:
              labels: true
              extrema: true
              fill: false

      ###########################################################################
      # WC OG                                                                   #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: WC
            icon: mdi:toilet

          - type: custom:mushroom-light-card
            entity: light.wc_og_light
            name: Licht
          - type: custom:mushroom-cover-card
            entity: cover.wc_og_blinds
            name: Raffstore
