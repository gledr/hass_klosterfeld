###############################################################################
# OBERGESCHOSS — per-room compact view                                         #
# Empty "Neuer Abschnitt" leftover removed.                                    #
# Smoke detectors + windows now live on Sicherheit dashboard.                  #
###############################################################################
title: Obergeschoss
views:
  - title: Obergeschoss
    path: home
    icon: mdi:home-roof
    type: sections
    max_columns: 3
    sections:

      ###########################################################################
      # SCHLAFZIMMER                                                            #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Schlafzimmer
            icon: mdi:bed

          - type: custom:mushroom-light-card
            entity: light.bedroom_main_light
            name: Hauptlicht
            show_brightness_control: true
          - type: custom:mushroom-light-card
            entity: light.bedroom_bed_light_left
            name: Bett links
          - type: custom:mushroom-light-card
            entity: light.bedroom_bed_light_right
            name: Bett rechts
          - type: custom:mushroom-cover-card
            entity: cover.bedroom_shutter
            name: Rollo
            show_position_control: true
            show_buttons_control: true
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.bedroom
                icon: mdi:thermometer
              - type: entity
                entity: sensor.bedroom_humidity
                icon: mdi:water-percent

      ###########################################################################
      # BÜRO                                                                    #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Büro
            icon: mdi:desk

          - type: custom:mushroom-light-card
            entity: light.office_light
            name: Licht
            show_brightness_control: true
          - type: custom:mushroom-cover-card
            entity: cover.office_shutter
            name: Rollo
            show_position_control: true
            show_buttons_control: true
          - type: custom:mushroom-chips-card
            chips:
              # TODO sensor.kind2_temperature ist laut altem Dashboard die Büro-Temp.
              # Rename empfohlen: sensor.kind2_temperature → sensor.office_temperature
              - type: entity
                entity: sensor.kind2_temperature
                icon: mdi:thermometer
              - type: entity
                entity: sensor.bthome_sensor_ace1_humidity
                icon: mdi:water-percent
              - type: entity
                entity: sensor.bthome_sensor_ace1_temperature
                icon: mdi:thermometer-lines

      ###########################################################################
      # GÄSTEZIMMER                                                             #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Gästezimmer
            icon: mdi:bed-empty

          - type: custom:mushroom-light-card
            entity: light.guest_light
            name: Licht
            show_brightness_control: true
          - type: custom:mushroom-cover-card
            entity: cover.guest_shutter
            name: Rollo
            show_position_control: true
            show_buttons_control: true
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.guest_room_temperature
                icon: mdi:thermometer

      ###########################################################################
      # BADEZIMMER                                                              #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Badezimmer
            icon: mdi:bathtub

          - type: custom:mushroom-light-card
            entity: light.bathroom_main_light
            name: Hauptlicht
            show_brightness_control: true
          - type: custom:mushroom-light-card
            entity: light.bathroom_mirror_light
            name: Spiegel
          - type: custom:mushroom-entity-card
            entity: switch.handtuchheizkoerper
            name: Handtuchheizung
            icon: mdi:radiator
          - type: custom:mushroom-cover-card
            entity: cover.bathroom_blinds
            name: Raffstore (Lamellen)
            show_tilt_position_control: true
          # Privacy tauchte bisher nur als Warnung auf der Übersicht auf —
          # ausschalten ließ es sich dort nicht. Solange aktiv, fasst die
          # Beschattungs-Konvergenz das Bad nicht an.
          - type: custom:mushroom-template-card
            entity: input_boolean.badezimmer_privacy_active
            primary: Privacy
            secondary: >
              {% if is_state('input_boolean.badezimmer_privacy_active', 'on') %}
                Aktiv — Beschattung bleibt stehen
              {% else %}
                Aus — Beschattung automatisch
              {% endif %}
            icon: >
              {% if is_state('input_boolean.badezimmer_privacy_active', 'on') %}mdi:eye-off{% else %}mdi:eye{% endif %}
            icon_color: >
              {% if is_state('input_boolean.badezimmer_privacy_active', 'on') %}purple{% else %}disabled{% endif %}
            tap_action:
              action: toggle
          # Lüften wie im Keller-Dashboard: Taupunkt-Temperatur plus farbiges
          # Ventilator-Logo (stark = fan-speed-3/rot, wenig = fan-speed-1/amber,
          # nicht lüften = fan-off/grau, okay = check-circle/grün). Templates
          # bewusst einzeilig — mushroom verzeiht führende Leerzeichen aus
          # gefalteten YAML-Templates beim startsWith("mdi:")-Vergleich nicht.
          - type: custom:mushroom-template-card
            entity: sensor.luftung_badezimmer
            primary: Lüften
            secondary: "Taupunkt {{ states('sensor.taupunkt_badezimmer') }} °C · {{ states('sensor.luftung_badezimmer') }}"
            icon: "{% set s = states('sensor.luftung_badezimmer') %}{% if 'stark' in s %}mdi:fan-speed-3{% elif 'wenig' in s %}mdi:fan-speed-1{% elif 'Nicht' in s %}mdi:fan-off{% else %}mdi:check-circle{% endif %}"
            icon_color: "{% set s = states('sensor.luftung_badezimmer') %}{% if 'stark' in s %}red{% elif 'wenig' in s %}amber{% elif 'Nicht' in s %}grey{% else %}green{% endif %}"
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.bathroom_temperature
                icon: mdi:thermometer
              - type: entity
                entity: sensor.bthome_sensor_5447_humidity
                icon: mdi:water-percent

      ###########################################################################
      # WC OG                                                                   #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: WC
            icon: mdi:toilet

          - type: custom:mushroom-light-card
            entity: light.wc_og_light
            name: Licht
            show_brightness_control: true
          - type: custom:mushroom-cover-card
            entity: cover.wc_og_blinds
            name: Raffstore (Lamellen)
            show_tilt_position_control: true
          # Sollwert-Regler des WC-Stellantriebs. Entities-Card, weil nur
          # hier der number-Entity als echter Slider mit +-Schritten
          # gerendert wird — Mushroom hat keine Card dafür, die den Wert
          # direkt verstellbar macht. Wert ansehen und verstellen geht
          # damit in einem Schritt statt über den more-info-Dialog.
          # Schreiben geht auf 7/3/39, zurückgelesen wird 7/3/37.
          - type: entities
            title: Heizung – Sollwert
            show_header_toggle: false
            entities:
              - entity: number.wc_og_sollwert
                name: Sollwert
                icon: mdi:radiator
          # Nur sichtbar, solange der Antrieb noch nichts gemeldet hat:
          # der Slider zeigt dann "unknown", und 20 °C ist nur der
          # ETS-Parameter im Gerät, kein von HASS gelesener Wert. Deshalb
          # der Hinweis als eigene Karte statt als Ersatztext im Slider.
          - type: conditional
            conditions:
              - condition: state
                entity: number.wc_og_sollwert
                state:
                  - unknown
                  - unavailable
            card:
              type: custom:mushroom-template-card
              primary: 20 °C (Standard)
              secondary: >-
                Der Antrieb hat noch keinen Sollwert gemeldet. 20 °C steht
                im ETS-Parameter des Stellantriebs.
              icon: mdi:information-outline
              icon_color: grey
          # Zweiter Weg zum selben Sollwert: die Korrektur-KO des Antriebs
          # (7/3/34, 1 = höher / 0 = niedriger). Nützlich, weil sie genau
          # das tut, was ein Wandthermostat tut — relativ, ohne dass HASS
          # den Absolutwert kennen muss.
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:minus
                content: Sollwert −
                icon_color: blue
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.wc_og_sollwert_minus
              - type: template
                icon: mdi:restore
                content: Standard 20 °C
                icon_color: amber
                tap_action:
                  action: call-service
                  service: script.wc_og_sollwert_standard
              # Status: zwingt den Antrieb über 7/3/37, seinen
              # tatsächlichen Sollwert zu melden. Nötig, weil die
              # Kachel sonst nur zeigt, was HASS zuletzt geschickt
              # hat — ohne Display am Gerät ist das der einzige Weg,
              # die Wahrheit zu sehen.
              - type: template
                icon: mdi:refresh
                content: Status
                icon_color: teal
                tap_action:
                  action: call-service
                  service: script.wc_og_sollwert_status_abfragen
              - type: template
                icon: mdi:plus
                content: Sollwert +
                icon_color: deep-orange
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.wc_og_sollwert_plus
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.wc_og_temperature
                icon: mdi:thermometer
              - type: entity
                entity: sensor.wc_og_humidity
                icon: mdi:water-percent

      ###########################################################################
      # GALERIE & STIEGE                                                        #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Galerie & Stiege
            icon: mdi:bridge

          - type: custom:mushroom-light-card
            entity: light.gallery_og_light
            name: Galerie
            show_brightness_control: true

          # "Stairway EG-OG Light" (KNX 1/2/120) war über kein Dashboard
          # erreichbar. Discovery per Muster, weil die tatsächliche entity_id
          # nicht feststeht (YAML-Rename ändert nur den friendly_name).
          - type: custom:auto-entities
            card:
              type: entities
              title: Stiege EG ↔ OG
              state_color: true
            filter:
              include:
                - domain: light
                  entity_id: light.*stairway*
                - domain: light
                  entity_id: light.*stiege*
                - domain: light
                  entity_id: light.*stairs_eg*
            show_empty: false

          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.gallery_og_temperature
                icon: mdi:thermometer
              - type: entity
                entity: sensor.stairs_eg_og_temperature_eg
                icon: mdi:stairs-up
                name: Stiege
