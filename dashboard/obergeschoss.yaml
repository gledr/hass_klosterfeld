###############################################################################
# OBERGESCHOSS — Tab im Dashboard "Räume" (raeume.yaml)                        #
#                                                                              #
# Pro Raum: Überschrift mit Temperatur/Feuchte als Badges, Licht, Rollo bzw.   #
# Raffstore, Heizungs-Sollwert (decluttering-Template `sollwert`), Lüften.     #
# Rauchmelder + Fenster stehen auf Sicherheit.                                 #
###############################################################################
title: Obergeschoss
path: og
icon: mdi:home-roof
type: sections
max_columns: 3
sections:

  ###########################################################################
  # SCHLAFZIMMER                                                            #
  ###########################################################################
  - type: grid
    column_span: 1
    cards:
      - type: heading
        heading: Schlafzimmer
        icon: mdi:bed
        badges:
          - type: entity
            entity: sensor.bedroom
          - type: entity
            entity: sensor.bedroom_humidity

      - type: custom:mushroom-light-card
        entity: light.bedroom_main_light
        name: Hauptlicht
        show_brightness_control: true
      - type: custom:mushroom-light-card
        entity: light.bedroom_bed_light_left
        name: Bett links
        grid_options:
          columns: 6
      - type: custom:mushroom-light-card
        entity: light.bedroom_bed_light_right
        name: Bett rechts
        grid_options:
          columns: 6
      - type: custom:mushroom-cover-card
        entity: cover.bedroom_shutter
        name: Rollo
        show_position_control: true
        show_buttons_control: true
      # Heizung: schreiben 7/3/84, zurücklesen 7/3/82
      - type: custom:decluttering-card
        template: sollwert
        variables:
          - raum: schlafzimmer
      - type: custom:decluttering-card
        template: lueften
        variables:
          - luftung: sensor.luftung_schlafzimmer
          - taupunkt: sensor.taupunkt_schlafzimmer

  ###########################################################################
  # BÜRO                                                                    #
  ###########################################################################
  - type: grid
    column_span: 1
    cards:
      - type: heading
        heading: Büro
        icon: mdi:desk
        badges:
          # TODO sensor.kind2_temperature ist laut altem Dashboard die Büro-Temp.
          # Rename empfohlen: sensor.kind2_temperature → sensor.office_temperature
          - type: entity
            entity: sensor.kind2_temperature
          - type: entity
            entity: sensor.bthome_sensor_ace1_humidity

      - type: custom:mushroom-light-card
        entity: light.office_light
        name: Licht
        show_brightness_control: true
      - type: custom:mushroom-cover-card
        entity: cover.office_shutter
        name: Rollo
        show_position_control: true
        show_buttons_control: true
      # Heizung: schreiben 7/3/69, zurücklesen 7/3/67
      - type: custom:decluttering-card
        template: sollwert
        variables:
          - raum: buro

  ###########################################################################
  # GÄSTEZIMMER                                                             #
  ###########################################################################
  - type: grid
    column_span: 1
    cards:
      - type: heading
        heading: Gästezimmer
        icon: mdi:bed-empty
        badges:
          - type: entity
            entity: sensor.guest_room_temperature

      - type: custom:mushroom-light-card
        entity: light.guest_light
        name: Licht
        show_brightness_control: true
      - type: custom:mushroom-cover-card
        entity: cover.guest_shutter
        name: Rollo
        show_position_control: true
        show_buttons_control: true
      # Heizung: schreiben 7/3/54, zurücklesen 7/3/52
      - type: custom:decluttering-card
        template: sollwert
        variables:
          - raum: gastezimmer

  ###########################################################################
  # BADEZIMMER                                                              #
  ###########################################################################
  - type: grid
    column_span: 1
    cards:
      - type: heading
        heading: Badezimmer
        icon: mdi:bathtub
        badges:
          - type: entity
            entity: sensor.bathroom_temperature
          - type: entity
            entity: sensor.bthome_sensor_5447_humidity

      - type: custom:mushroom-light-card
        entity: light.bathroom_main_light
        name: Hauptlicht
        show_brightness_control: true
      - type: custom:mushroom-light-card
        entity: light.bathroom_mirror_light
        name: Spiegel
      - type: custom:mushroom-entity-card
        entity: switch.handtuchheizkoerper
        name: Handtuch
        icon: mdi:radiator
        tap_action:
          action: toggle
        grid_options:
          columns: 6
      # Solange Privacy aktiv ist, fasst die Beschattungs-Konvergenz das Bad
      # nicht an. Antippen schaltet es ab (hängengebliebener Zustand).
      - type: custom:mushroom-template-card
        entity: input_boolean.badezimmer_privacy_active
        primary: Privacy
        secondary: "{% if is_state('input_boolean.badezimmer_privacy_active', 'on') %}aktiv{% else %}aus{% endif %}"
        icon: "{% if is_state('input_boolean.badezimmer_privacy_active', 'on') %}mdi:eye-off{% else %}mdi:eye{% endif %}"
        icon_color: "{% if is_state('input_boolean.badezimmer_privacy_active', 'on') %}purple{% else %}disabled{% endif %}"
        tap_action:
          action: toggle
        grid_options:
          columns: 6
      - type: custom:mushroom-cover-card
        entity: cover.bathroom_blinds
        name: Raffstore (Lamellen)
        show_tilt_position_control: true
      # Heizung: schreiben 7/3/99, zurücklesen 7/3/97
      - type: custom:decluttering-card
        template: sollwert
        variables:
          - raum: badezimmer
      - type: custom:decluttering-card
        template: lueften
        variables:
          - luftung: sensor.luftung_badezimmer
          - taupunkt: sensor.taupunkt_badezimmer

  ###########################################################################
  # WC OG                                                                   #
  ###########################################################################
  - type: grid
    column_span: 1
    cards:
      - type: heading
        heading: WC
        icon: mdi:toilet
        badges:
          - type: entity
            entity: sensor.wc_og_temperature
          - type: entity
            entity: sensor.wc_og_humidity

      - type: custom:mushroom-light-card
        entity: light.wc_og_light
        name: Licht
        show_brightness_control: true
      - type: custom:mushroom-cover-card
        entity: cover.wc_og_blinds
        name: Raffstore (Lamellen)
        show_tilt_position_control: true
      # Heizung: schreiben 7/3/39, zurücklesen 7/3/37, Korrektur-KO 7/3/34
      - type: custom:decluttering-card
        template: sollwert
        variables:
          - raum: wc_og

  ###########################################################################
  # GALERIE & STIEGE                                                        #
  ###########################################################################
  - type: grid
    column_span: 1
    cards:
      - type: heading
        heading: Galerie & Stiege
        icon: mdi:bridge
        badges:
          - type: entity
            entity: sensor.gallery_og_temperature
          - type: entity
            entity: sensor.stairs_eg_og_temperature_eg
            name: Stiege

      - type: custom:mushroom-light-card
        entity: light.gallery_og_light
        name: Galerie
        show_brightness_control: true

      # "Stairway EG-OG Light" (KNX 1/2/120): Discovery per Muster, weil die
      # tatsächliche entity_id nicht feststeht (YAML-Rename ändert nur den
      # friendly_name).
      - type: custom:auto-entities
        card:
          type: entities
          state_color: true
        filter:
          include:
            - domain: light
              entity_id: light.*stairway*
            - domain: light
              entity_id: light.*stiege*
            - domain: light
              entity_id: light.*stairs_eg*
        show_empty: false
