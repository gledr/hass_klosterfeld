                icon: mdi:thermometer
              - type: entity
                entity: sensor.wc_og_humidity
                icon: mdi:water-percent
          - type: custom:mini-graph-card
            name: Leistung Verbrauch Deckenlicht (12h)
            entities:
              - entity: sensor.leistung_wc_og_deckenlicht
                name: Leistung
                color: '#d97706'
            hours_to_show: 12
            points_per_hour: 4
            line_width: 2
            show:
              labels: true
              extrema: true
              fill: false

      ###########################################################################
      # GALERIE                                                                 #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Galerie
            icon: mdi:bridge

          - type: custom:mushroom-light-card
            entity: light.gallery_og_light
            name: Licht
          - type: custom:mushroom-chips-card
            chips:
