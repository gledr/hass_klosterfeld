###############################################################################
# ERDGESCHOSS — per-room compact view                                          #
# Smoke detectors and windows live on the Sicherheit dashboard, not here.      #
###############################################################################
title: Erdgeschoss
views:
  - title: Erdgeschoss
    path: home
    icon: mdi:home-floor-g
    type: sections
    max_columns: 3
    sections:

      ###########################################################################
      # WOHNZIMMER                                                              #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Wohnzimmer
            icon: mdi:sofa

          - type: custom:mushroom-light-card
            entity: light.livingroom_main_light_2
            name: Hauptlicht
            show_brightness_control: true
          - type: custom:mushroom-light-card
            entity: light.livingroom_reading_light
            name: Leselicht
            show_brightness_control: true
          - type: custom:mushroom-cover-card
            entity: cover.livingroom_blinds
            name: Raffstore
            show_position_control: true
            show_tilt_position_control: true
            show_buttons_control: true
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: binary_sensor.praesenzmelder_wohnzimmer
                icon: mdi:motion-sensor
                content_info: name
                name: Präsenz
              - type: entity
                entity: binary_sensor.prasenzmelder_wohnzimmer_hvac
                icon: mdi:hvac
                content_info: name
                name: HVAC
          - type: entities
            title: Wohnküche Licht
            entities:
              - entity: input_number.wohnkueche_licht_outdoor_lux
                name: Lux-Schwelle (Süd)
              - entity: sensor.helligkeit_sud
                name: Helligkeit Süd (aktuell)

      ###########################################################################
      # WOHNKÜCHE – LICHTSZENEN                                                  #
      # Manueller Modus-Wechsel: setzt input_select.wohnkueche_lichtmodus und     #
      # führt ihn sofort aus (Dispatcher-Script, egal ob Präsenz/dunkel).         #
      ###########################################################################
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Wohnküche – Lichtszenen
            icon: mdi:lightbulb-multiple

          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:lightbulb-group
                content: >
                  {% set names = {
                    'fruehstueck': 'Frühstück',
                    'werktag_abend_aktiv': 'Abend aktiv',
                    'werktag_relax': 'Relax',
                    'spaetabend': 'Spätabend',
                    'nacht': 'Nacht',
                    'wochenende_tag': 'Tag (WE)',
                    'wochenende_nachmittag': 'Nachmittag (WE)',
                    'wochenende_abend': 'Abend (WE)',
                    'alles_aus': 'Alles aus'
                  } %}
                  {% set m = states('input_select.wohnkueche_lichtmodus') %}
                  Modus: {{ names.get(m, m) }}

          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Frühstück
                icon: mdi:coffee
                icon_color: amber
                layout: vertical
                tap_action:
                  action: call-service
                  service:
                    - service: input_select.select_option
                      target:
                        entity_id: input_select.wohnkueche_lichtmodus
                      data:
                        option: fruehstueck
                    - service: script.wohnkueche_lichtmodus_ausfuehren
              - type: custom:mushroom-template-card
                primary: Abend aktiv
                icon: mdi:silverware-fork-knife
                icon_color: orange
                layout: vertical
                tap_action:
                  action: call-service
                  service:
                    - service: input_select.select_option
                      target:
                        entity_id: input_select.wohnkueche_lichtmodus
                      data:
                        option: werktag_abend_aktiv
                    - service: script.wohnkueche_lichtmodus_ausfuehren
              - type: custom:mushroom-template-card
                primary: Relax
                icon: mdi:sofa
                icon_color: deep-orange
                layout: vertical
                tap_action:
                  action: call-service
                  service:
                    - service: input_select.select_option
                      target:
                        entity_id: input_select.wohnkueche_lichtmodus
                      data:
                        option: werktag_relax
                    - service: script.wohnkueche_lichtmodus_ausfuehren
              - type: custom:mushroom-template-card
                primary: Tag (WE)
                icon: mdi:white-balance-sunny
                icon_color: green
                layout: vertical
                tap_action:
                  action: call-service
                  service:
                    - service: input_select.select_option
                      target:
                        entity_id: input_select.wohnkueche_lichtmodus
                      data:
                        option: wochenende_tag
                    - service: script.wohnkueche_lichtmodus_ausfuehren
              - type: custom:mushroom-template-card
                primary: Nachmittag (WE)
                icon: mdi:weather-partly-cloudy
                icon_color: teal
                layout: vertical
                tap_action:
                  action: call-service
                  service:
                    - service: input_select.select_option
                      target:
                        entity_id: input_select.wohnkueche_lichtmodus
                      data:
                        option: wochenende_nachmittag
                    - service: script.wohnkueche_lichtmodus_ausfuehren
              - type: custom:mushroom-template-card
                primary: Abend (WE)
                icon: mdi:weather-sunset
                icon_color: orange
                layout: vertical
                tap_action:
                  action: call-service
                  service:
                    - service: input_select.select_option
                      target:
                        entity_id: input_select.wohnkueche_lichtmodus
                      data:
                        option: wochenende_abend
                    - service: script.wohnkueche_lichtmodus_ausfuehren
              - type: custom:mushroom-template-card
                primary: Spätabend
                icon: mdi:weather-night
                icon_color: indigo
                layout: vertical
                tap_action:
                  action: call-service
                  service:
                    - service: input_select.select_option
                      target:
                        entity_id: input_select.wohnkueche_lichtmodus
                      data:
                        option: spaetabend
                    - service: script.wohnkueche_lichtmodus_ausfuehren
              - type: custom:mushroom-template-card
                primary: Nacht
                icon: mdi:bed
                icon_color: deep-purple
                layout: vertical
                tap_action:
                  action: call-service
                  service:
                    - service: input_select.select_option
                      target:
                        entity_id: input_select.wohnkueche_lichtmodus
                      data:
                        option: nacht
                    - service: script.wohnkueche_lichtmodus_ausfuehren
              - type: custom:mushroom-template-card
                primary: Alles aus
                icon: mdi:lightbulb-off
                icon_color: grey
                layout: vertical
                tap_action:
                  action: call-service
                  service:
                    - service: input_select.select_option
                      target:
                        entity_id: input_select.wohnkueche_lichtmodus
                      data:
                        option: alles_aus
                    - service: script.wohnkueche_lichtmodus_ausfuehren

      ###########################################################################
      # KÜCHE                                                                   #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Küche
            icon: mdi:silverware-fork-knife

          - type: custom:mushroom-light-card
            entity: light.licht_kueche_fenster
            name: Stiege
            show_brightness_control: true
          - type: custom:mushroom-light-card
            entity: light.licht_kueche_fenster_2
            name: Fenster
            show_brightness_control: true
          - type: custom:mushroom-light-card
            entity: light.licht_spuele_kueche
            name: Spüle
          - type: custom:mushroom-light-card
            entity: light.licht_vitrine_kueche
            name: Vitrine
          - type: custom:mushroom-cover-card
            entity: cover.kitchen_blinds
            name: Raffstore
            show_position_control: true
            show_tilt_position_control: true
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.kitchen_temperature
                icon: mdi:thermometer
              - type: entity
                entity: sensor.kitchen_humidity
                icon: mdi:water-percent

      ###########################################################################
      # ESSZIMMER                                                               #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Esszimmer
            icon: mdi:table-chair

          - type: custom:mushroom-light-card
            entity: light.esszimmer_licht
            name: Esstisch
            show_brightness_control: true
          - type: custom:mushroom-cover-card
            entity: cover.dining_blinds
            name: Raffstore
            show_position_control: true
            show_tilt_position_control: true

      ###########################################################################
      # ABSTELLRAUM                                                             #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Abstellraum
            icon: mdi:shelf

          - type: custom:mushroom-light-card
            entity: light.shelf_eg_light
            name: Licht
          - type: custom:mushroom-cover-card
            entity: cover.shelf_blinds
            name: Raffstore
            show_position_control: true
            show_tilt_position_control: true
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.utility_temperature
                icon: mdi:thermometer

      ###########################################################################
      # WC EG                                                                   #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: WC
            icon: mdi:toilet

          - type: custom:mushroom-light-card
            entity: light.wc_eg_light
            name: Licht
          - type: custom:mushroom-cover-card
            entity: cover.wc_eg_blinds
            name: Raffstore
            show_position_control: true
            show_tilt_position_control: true
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.wc_gf_temperature
                icon: mdi:thermometer

      ###########################################################################
      # GARDEROBE / EINGANG                                                     #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Garderobe
            icon: mdi:wardrobe

          - type: custom:mushroom-light-card
            entity: light.wardrobe_light
            name: Garderobe
          - type: custom:mushroom-light-card
            entity: light.entrance_light
            name: Eingang
          - type: custom:mushroom-cover-card
            entity: cover.wardrobe_blinds
            name: Raffstore
            show_position_control: true
            show_tilt_position_control: true
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.wardrobe_temperature
                icon: mdi:thermometer
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: binary_sensor.bewegungsmelder_garderobe
                icon: mdi:motion-sensor
                content_info: name
                name: Präsenz
              - type: entity
                entity: binary_sensor.bewegungsmelder_garderobe_hvac
                icon: mdi:hvac
                content_info: name
                name: HVAC
