###############################################################################
# KLIMA                                                                        #
#                                                                              #
# Drei Tabs:                                                                   #
#   Übersicht — Außen, Auffälligkeiten, eine Kachel pro Raum (Temp · Feuchte,  #
#               Icon = Lüften-Logo, wo es eine Empfehlung gibt), Trends        #
#   Heizung   — Betriebsart Sommer/Winter, Wärmepumpe, alle Raum-Sollwerte     #
#   Lüften    — Empfehlung + Taupunkt pro Raum (vorher eigenes Dashboard)      #
#                                                                              #
# Kacheln = decluttering-Templates aus templates.yaml.                         #
###############################################################################
title: Klima
decluttering_templates: !include templates.yaml
views:
  #############################################################################
  # TAB 1 — ÜBERSICHT                                                         #
  #############################################################################
  - title: Übersicht
    path: home
    icon: mdi:home-thermometer
    type: sections
    max_columns: 4

    badges:
      - type: entity
        entity: sensor.outdoor_temperature
        name: Außen
      - type: entity
        entity: sensor.outdoor_humidity
        name: Feuchte
      - type: entity
        entity: sensor.taupunkt_aussen
        name: Taupunkt
      - type: entity
        entity: select.heizung_betriebsart
        name: Heizung

    sections:

      ###########################################################################
      # AUSSEN                                                                  #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Außen
            icon: mdi:weather-partly-cloudy

          - type: weather-forecast
            entity: weather.forecast_home
            show_forecast: true

      ###########################################################################
      # AUFFÄLLIG — rendert nichts, solange alles im Rahmen ist                 #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Auffällig
            icon: mdi:alert-circle-outline

          - type: custom:auto-entities
            card:
              type: entities
              title: 🔥 Über 25 °C
            filter:
              include:
                - domain: sensor
                  state: ">25"
                  attributes:
                    device_class: temperature
                    unit_of_measurement: "°C"
              exclude:
                - entity_id: sensor.outdoor_*
                - entity_id: sensor.garagentor_*
                - entity_id: sensor.taupunkt_*
                # LWP-Systemtemperaturen (Außenfühler, Vorlauf, Warmwasser)
                # sind keine Raumluft-Temperaturen.
                - entity_id: sensor.altherma_climatecontrol_outdoor_*
                - entity_id: sensor.altherma_climatecontrol_leaving_water_*
                - entity_id: sensor.altherma_domestichotwatertank_tank_*
            sort:
              method: state
              numeric: true
              reverse: true
            show_empty: false

          - type: custom:auto-entities
            card:
              type: entities
              title: ❄️ Unter 18 °C (Innenraum)
            filter:
              include:
                - domain: sensor
                  state: "<18"
                  attributes:
                    device_class: temperature
                    unit_of_measurement: "°C"
              exclude:
                - entity_id: sensor.outdoor_*
                - entity_id: sensor.garagentor_*
                - entity_id: sensor.taupunkt_*
                - entity_id: sensor.basement_*
                - entity_id: sensor.engineering_*
                - entity_id: sensor.storage_*
                - entity_id: sensor.hobby_*
                - entity_id: sensor.stairs_*
                # LWP-Systemtemperaturen (Außenfühler, Vorlauf, Warmwasser)
                # sind keine Raumluft-Temperaturen.
                - entity_id: sensor.altherma_climatecontrol_outdoor_*
                - entity_id: sensor.altherma_climatecontrol_leaving_water_*
                - entity_id: sensor.altherma_domestichotwatertank_tank_*
            sort:
              method: state
              numeric: true
            show_empty: false

          - type: custom:auto-entities
            card:
              type: entities
              title: 💧 Über 65 % rel. Feuchte
            filter:
              include:
                - domain: sensor
                  state: ">65"
                  attributes:
                    device_class: humidity
              exclude:
                - entity_id: sensor.outdoor_humidity
                - entity_id: sensor.garagentor_*
            sort:
              method: state
              numeric: true
              reverse: true
            show_empty: false

          # Plausibilität: Heizsaison sagt Sommer, aber die WP fordert Wärme an.
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.waermepumpe_heizen
                state: "on"
              - condition: state
                entity: select.heizung_betriebsart
                state: Sommer
            card:
              type: custom:mushroom-template-card
              primary: Heizt trotz Sommerbetrieb
              secondary: >-
                Die Wärmepumpe fordert Heizen an, GA 7/0/0 steht aber auf
                Sommer. Kurz prüfen, ob am Taster umgestellt wurde.
              icon: mdi:alert-outline
              icon_color: red
              multiline_secondary: true
              tap_action:
                action: navigate
                navigation_path: /lovelace-klima/heizung

      ###########################################################################
      # ERDGESCHOSS                                                             #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Erdgeschoss
            icon: mdi:home-floor-g
            tap_action:
              action: navigate
              navigation_path: /lovelace-raeume/eg

          - type: custom:decluttering-card
            template: klima_raum
            variables:
              - name: Küche
              - temp: sensor.kitchen_temperature
              - feuchte: sensor.kitchen_humidity
              - luftung: sensor.luftung_kuche
          - type: custom:decluttering-card
            template: klima_raum
            variables:
              - name: WC EG
              - temp: sensor.wc_gf_temperature
              - icon: mdi:toilet
              - farbe: blue
          - type: custom:decluttering-card
            template: klima_raum
            variables:
              - name: Garderobe
              - temp: sensor.wardrobe_temperature
              - icon: mdi:wardrobe
              - farbe: brown
          - type: custom:decluttering-card
            template: klima_raum
            variables:
              - name: Abstellraum
              - temp: sensor.utility_temperature
              - icon: mdi:shelf
          - type: custom:decluttering-card
            template: klima_raum
            variables:
              - name: Stiege EG ↔ OG
              - temp: sensor.stairs_eg_og_temperature_eg
              - icon: mdi:stairs-up

      ###########################################################################
      # OBERGESCHOSS                                                            #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Obergeschoss
            icon: mdi:home-roof
            tap_action:
              action: navigate
              navigation_path: /lovelace-raeume/og

          - type: custom:decluttering-card
            template: klima_raum
            variables:
              - name: Schlafzimmer
              - temp: sensor.bedroom
              - feuchte: sensor.bedroom_humidity
              - luftung: sensor.luftung_schlafzimmer
          # TODO sensor.kind2_temperature = Büro laut altem Dashboard → office_temperature
          - type: custom:decluttering-card
            template: klima_raum
            variables:
              - name: Büro
              - temp: sensor.kind2_temperature
              - feuchte: sensor.bthome_sensor_ace1_humidity
              - icon: mdi:desk
              - farbe: deep-orange
          - type: custom:decluttering-card
            template: klima_raum
            variables:
              - name: Gästezimmer
              - temp: sensor.guest_room_temperature
              - icon: mdi:bed-empty
              - farbe: pink
          - type: custom:decluttering-card
            template: klima_raum
            variables:
              - name: Badezimmer
              - temp: sensor.bathroom_temperature
              - feuchte: sensor.bthome_sensor_5447_humidity
              - luftung: sensor.luftung_badezimmer
          - type: custom:decluttering-card
            template: klima_raum
            variables:
              - name: WC OG
              - temp: sensor.wc_og_temperature
              - feuchte: sensor.wc_og_humidity
              - icon: mdi:toilet
              - farbe: blue
          - type: custom:decluttering-card
            template: klima_raum
            variables:
              - name: Galerie
              - temp: sensor.gallery_og_temperature
              - icon: mdi:bridge

      ###########################################################################
      # KELLER + GARAGE                                                         #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Keller & Garage
            icon: mdi:home-floor-b
            tap_action:
              action: navigate
              navigation_path: /lovelace-raeume/keller

          - type: custom:decluttering-card
            template: klima_raum
            variables:
              - name: Vorraum
              - temp: sensor.basement_hallway_temperture
              - feuchte: sensor.basement_hallway_humidity
              - luftung: sensor.luftung_vorraum
          - type: custom:decluttering-card
            template: klima_raum
            variables:
              - name: Technikraum
              - temp: sensor.engineering_temperature
              - feuchte: sensor.engineering_humidity
              - luftung: sensor.luftung_technikraum
          - type: custom:decluttering-card
            template: klima_raum
            variables:
              - name: Hobbyraum
              - temp: sensor.hobby_temperature
              - feuchte: sensor.hobby_humidity
              - luftung: sensor.luftung_hobbyraum
          - type: custom:decluttering-card
            template: klima_raum
            variables:
              - name: Lager
              - temp: sensor.storage_temperature
              - feuchte: sensor.storage_humidity
              - luftung: sensor.luftung_lager
          - type: custom:decluttering-card
            template: klima_raum
            variables:
              - name: Garage
              - temp: sensor.garagentor_garage_temperature
              - feuchte: sensor.garagentor_garage_humidity
              - luftung: sensor.luftung_garage
          - type: custom:decluttering-card
            template: klima_raum
            variables:
              - name: Stiege KG ↔ EG
              - temp: sensor.stairs_kg_eg_temperature_eg
              - icon: mdi:stairs-up

      ###########################################################################
      # TRENDS                                                                  #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Trends 24 h
            icon: mdi:chart-line

          - type: custom:apexcharts-card
            header:
              show: true
              title: Temperatur
              show_states: false
            graph_span: 24h
            series:
              - entity: sensor.outdoor_temperature
                name: Außen
                stroke_width: 3
              - entity: sensor.kitchen_temperature
                name: Küche
              - entity: sensor.bedroom
                name: Schlafzimmer
              - entity: sensor.bathroom_temperature
                name: Bad
              - entity: sensor.kind2_temperature
                name: Büro

          - type: custom:apexcharts-card
            header:
              show: true
              title: Luftfeuchte
              show_states: false
            graph_span: 24h
            series:
              - entity: sensor.outdoor_humidity
                name: Außen
                stroke_width: 3
              - entity: sensor.kitchen_humidity
                name: Küche
              - entity: sensor.bedroom_humidity
                name: Schlafzimmer
              - entity: sensor.bthome_sensor_5447_humidity
                name: Bad

  #############################################################################
  # TAB 2 — HEIZUNG                                                           #
  #############################################################################
  # Betriebsart Sommer/Winter kommt aus dem KNX-Select in configuration.yaml
  # (GA 7/0/0, 1 = Sommer / 0 = Winter). Ohne Status-GA kennt HASS nur den
  # zuletzt gesendeten Wert — der bleibt über Neustarts erhalten, ändert sich
  # aber nicht, wenn am Taster umgestellt wird.
  - title: Heizung
    path: heizung
    icon: mdi:heat-pump
    type: sections
    max_columns: 3
    sections:

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Wärmepumpe
            icon: mdi:heat-pump
            badges:
              - type: entity
                entity: sensor.altherma_climatecontrol_outdoor_temperature
                name: Außen (Nord)
              - type: entity
                entity: sensor.altherma_climatecontrol_heating_daily_electrical_consumption
                name: Heute

          - type: custom:mushroom-template-card
            primary: Betriebsart Heizung
            secondary: >-
              {% set mode = states('select.heizung_betriebsart') %}
              {% if mode == 'Winter' %}Winterbetrieb – Heizung aktiv
              {% elif mode == 'Sommer' %}Sommerbetrieb – Heizung abgeschaltet
              {% else %}Betriebsart unbekannt{% endif %}
              · Ø-Außen {{ states('sensor.outdoor_temperature_avg') }} °C
            icon: mdi:heat-pump
            icon_color: "{% if is_state('select.heizung_betriebsart','Winter') %}deep-orange{% elif is_state('select.heizung_betriebsart','Sommer') %}light-blue{% else %}grey{% endif %}"
            tap_action:
              action: call-service
              service: script.heizung_betriebsart_umschalten

          # Nur "template"-Chips rendern Jinja in icon/icon_color/content.
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:snowflake
                content: Winter
                icon_color: "{% if is_state('select.heizung_betriebsart','Winter') %}blue{% else %}grey{% endif %}"
                tap_action:
                  action: call-service
                  service: select.select_option
                  data:
                    entity_id: select.heizung_betriebsart
                    option: Winter
              - type: template
                icon: mdi:white-balance-sunny
                content: Sommer
                icon_color: "{% if is_state('select.heizung_betriebsart','Sommer') %}amber{% else %}grey{% endif %}"
                tap_action:
                  action: call-service
                  service: select.select_option
                  data:
                    entity_id: select.heizung_betriebsart
                    option: Sommer
              # Handbetrieb-Chip schaltet die Sperre der Automatik — nur ohne
              # Handbetrieb darf die Automation GA 7/0/0 anfassen.
              - type: template
                icon: "{% if is_state('input_boolean.heizung_betriebsart_manuell','on') %}mdi:hand-back-right{% else %}mdi:robot-outline{% endif %}"
                content: "{% if is_state('input_boolean.heizung_betriebsart_manuell', 'on') %}Handbetrieb{% else %}Automatik{% endif %}"
                icon_color: "{% if is_state('input_boolean.heizung_betriebsart_manuell','on') %}amber{% else %}green{% endif %}"
                tap_action:
                  action: call-service
                  service: input_boolean.toggle
                  data:
                    entity_id: input_boolean.heizung_betriebsart_manuell

          # Status: Heizsaison, WP, Heizung aktiv. heizung_aktiv ist
          # "unavailable", solange die Betriebsart unbekannt ist.
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: "{% if is_state('binary_sensor.heizsaison','on') %}mdi:snowflake{% else %}mdi:weather-sunny{% endif %}"
                content: >-
                  {% if is_state('binary_sensor.heizsaison', 'on') %}Heizsaison
                  {% elif is_state('binary_sensor.heizsaison', 'off') %}Sommerzeit
                  {% else %}Heizsaison ?{% endif %}
                icon_color: "{% if is_state('binary_sensor.heizsaison','on') %}blue{% elif is_state('binary_sensor.heizsaison','off') %}amber{% else %}grey{% endif %}"
              - type: template
                icon: "{% if is_state('binary_sensor.waermepumpe_heizen','on') %}mdi:fire{% else %}mdi:heat-pump-outline{% endif %}"
                content: >-
                  {% if is_state('binary_sensor.waermepumpe_heizen', 'on') %}WP heizt
                  {% elif is_state('binary_sensor.waermepumpe_heizen', 'off') %}WP Pause
                  {% else %}WP ?{% endif %}
                icon_color: "{% if is_state('binary_sensor.waermepumpe_heizen','on') %}deep-orange{% else %}grey{% endif %}"
              - type: template
                icon: mdi:fire
                content: >-
                  {% if is_state('binary_sensor.heizung_aktiv', 'on') %}Heizung an
                  {% elif is_state('binary_sensor.heizung_aktiv', 'off') %}Heizung aus
                  {% else %}unbekannt{% endif %}
                icon_color: "{% if is_state('binary_sensor.heizung_aktiv','on') %}deep-orange{% else %}grey{% endif %}"

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.waermepumpe_heizen
                state: "on"
              - condition: state
                entity: select.heizung_betriebsart
                state: Sommer
            card:
              type: custom:mushroom-template-card
              primary: Heizt trotz Sommerbetrieb
              secondary: >-
                Die Wärmepumpe fordert Heizen an, GA 7/0/0 steht aber auf
                Sommer. Kurz prüfen, ob am Taster umgestellt wurde.
              icon: mdi:alert-outline
              icon_color: red
              multiline_secondary: true

          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_number.heizsaison_temp_schwelle
                name: Heizsaison ab (Ø-Außen)
              - entity: input_boolean.heizung_betriebsart_manuell
                name: Betriebsart manuell

          # Altherma-Entities stammen aus der UI-Integration → Discovery
          # über die Domains statt geratener entity_ids.
          - type: custom:auto-entities
            card:
              type: entities
              title: Wärmepumpe & Warmwasser
              state_color: true
            filter:
              include:
                - domain: climate
                - domain: water_heater
            sort:
              method: friendly_name
            show_empty: false

      ###########################################################################
      # RAUM-SOLLWERTE OG — dieselben Bausteine wie in Räume → OG               #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Raum-Sollwerte
            icon: mdi:radiator

          - type: custom:decluttering-card
            template: sollwert
            variables:
              - raum: schlafzimmer
              - name: Schlafzimmer
            grid_options:
              columns: 6
          - type: custom:decluttering-card
            template: sollwert
            variables:
              - raum: buro
              - name: Büro
            grid_options:
              columns: 6
          - type: custom:decluttering-card
            template: sollwert
            variables:
              - raum: gastezimmer
              - name: Gästezimmer
            grid_options:
              columns: 6
          - type: custom:decluttering-card
            template: sollwert
            variables:
              - raum: badezimmer
              - name: Badezimmer
            grid_options:
              columns: 6
          - type: custom:decluttering-card
            template: sollwert
            variables:
              - raum: wc_og
              - name: WC OG
            grid_options:
              columns: 6

  #############################################################################
  # TAB 3 — LÜFTEN                                                            #
  # Pro Raum: Empfehlung in der Titelzeile, Werte darunter. Icon = Empfehlung #
  # (stark = rot, wenig = amber, nicht lüften = grau, okay = grün).           #
  #############################################################################
  - title: Lüften
    path: lueften
    icon: mdi:hvac
    type: sections
    max_columns: 2

    badges:
      - type: entity
        entity: sensor.outdoor_temperature
        name: Außen
      - type: entity
        entity: sensor.outdoor_humidity
        name: Feuchte
      - type: entity
        entity: sensor.taupunkt_aussen
        name: Taupunkt

    sections:

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Wohnräume
            icon: mdi:home

          - type: custom:decluttering-card
            template: lueften_raum
            variables:
              - name: Küche
              - temp: sensor.kitchen_temperature
              - feuchte: sensor.kitchen_humidity
              - taupunkt: sensor.taupunkt_kuche
              - luftung: sensor.luftung_kuche
          - type: custom:decluttering-card
            template: lueften_raum
            variables:
              - name: Schlafzimmer
              - temp: sensor.bedroom
              - feuchte: sensor.bedroom_humidity
              - taupunkt: sensor.taupunkt_schlafzimmer
              - luftung: sensor.luftung_schlafzimmer
          - type: custom:decluttering-card
            template: lueften_raum
            variables:
              - name: Badezimmer
              - temp: sensor.bathroom_temperature
              - feuchte: sensor.bthome_sensor_5447_humidity
              - taupunkt: sensor.taupunkt_badezimmer
              - luftung: sensor.luftung_badezimmer
          - type: custom:decluttering-card
            template: lueften_raum
            variables:
              - name: Garage
              - temp: sensor.garagentor_garage_temperature
              - feuchte: sensor.garagentor_garage_humidity
              - taupunkt: sensor.taupunkt_garage
              - luftung: sensor.luftung_garage

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Keller
            icon: mdi:home-floor-b

          - type: custom:decluttering-card
            template: lueften_raum
            variables:
              - name: Technikraum
              - temp: sensor.engineering_temperature
              - feuchte: sensor.engineering_humidity
              - taupunkt: sensor.taupunkt_technikraum
              - luftung: sensor.luftung_technikraum
          - type: custom:decluttering-card
            template: lueften_raum
            variables:
              - name: Hobbyraum
              - temp: sensor.hobby_temperature
              - feuchte: sensor.hobby_humidity
              - taupunkt: sensor.taupunkt_hobby
              - luftung: sensor.luftung_hobbyraum
          - type: custom:decluttering-card
            template: lueften_raum
            variables:
              - name: Lager
              - temp: sensor.storage_temperature
              - feuchte: sensor.storage_humidity
              - taupunkt: sensor.taupunkt_lager
              - luftung: sensor.luftung_lager
          - type: custom:decluttering-card
            template: lueften_raum
            variables:
              - name: Vorraum
              - temp: sensor.basement_hallway_temperture
              - feuchte: sensor.basement_hallway_humidity
              - taupunkt: sensor.taupunkt_vorraum
              - luftung: sensor.luftung_vorraum

          - type: custom:expander-card
            title: Wie wird die Empfehlung berechnet?
            expanded: false
            cards:
              - type: markdown
                content: >
                  Vergleicht Innen-Taupunkt gegen Außen-Taupunkt
                  ({{ states('sensor.taupunkt_aussen') }} °C) und schaut erst
                  ab 55 % rel. Feuchte hin. „Nicht lüften" heißt: draußen ist
                  feuchter als drinnen — Fenster zu lassen.
