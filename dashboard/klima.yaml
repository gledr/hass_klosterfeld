###############################################################################
# KLIMA — Indoor / outdoor at a glance                                         #
# Outdoor trend up top, per-room mushroom tiles below, multi-room comparison   #
# chart for spotting hotspots.                                                 #
###############################################################################
title: Klima
views:
  - title: Übersicht
    path: home
    icon: mdi:home-thermometer
    type: sections
    max_columns: 4
    sections:

      ###########################################################################
      # AUSSEN                                                                  #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Außen
            icon: mdi:weather-partly-cloudy

          - type: weather-forecast
            entity: weather.forecast_home
            show_forecast: true

          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.outdoor_temperature
                icon: mdi:thermometer
                name: Temp
              - type: entity
                entity: sensor.outdoor_humidity
                icon: mdi:water-percent
                name: rel. F.
              - type: entity
                entity: sensor.taupunkt_aussen
                icon: mdi:water-thermometer
                name: Taupunkt
              - type: entity
                entity: sensor.wind_speed
                icon: mdi:weather-windy
                name: Wind

      ###########################################################################
      # ALERTS — zu kalt / zu warm / zu feucht                                  #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Auffällig
            icon: mdi:alert-circle-outline

          - type: custom:auto-entities
            card:
              type: entities
              title: 🔥 Über 25 °C
            filter:
              include:
                - domain: sensor
                  state: ">25"
                  attributes:
                    device_class: temperature
                    unit_of_measurement: "°C"
              exclude:
                - entity_id: sensor.outdoor_*
                - entity_id: sensor.garagentor_*
                - entity_id: sensor.taupunkt_*
            sort:
              method: state
              numeric: true
              reverse: true
            show_empty: false

          - type: custom:auto-entities
            card:
              type: entities
              title: ❄️ Unter 18 °C (Innenraum)
            filter:
              include:
                - domain: sensor
                  state: "<18"
                  attributes:
                    device_class: temperature
                    unit_of_measurement: "°C"
              exclude:
                - entity_id: sensor.outdoor_*
                - entity_id: sensor.garagentor_*
                - entity_id: sensor.taupunkt_*
                - entity_id: sensor.basement_*
                - entity_id: sensor.engineering_*
                - entity_id: sensor.storage_*
                - entity_id: sensor.hobby_*
                - entity_id: sensor.stairs_*
            sort:
              method: state
              numeric: true
            show_empty: false

          - type: custom:auto-entities
            card:
              type: entities
              title: 💧 Über 65 % rel. Feuchte
            filter:
              include:
                - domain: sensor
                  state: ">65"
                  attributes:
                    device_class: humidity
              exclude:
                - entity_id: sensor.outdoor_humidity
                - entity_id: sensor.garagentor_*
            sort:
              method: state
              numeric: true
              reverse: true
            show_empty: false

      ###########################################################################
      # HEIZUNG (Daikin Altherma)                                               #
      ###########################################################################
      # Bisher gab es zur Heizung ausschließlich Verbrauchszahlen auf dem
      # Energie-Dashboard — keine Bedienung. Die Altherma-Entities stammen aus
      # der UI-Integration und stehen nicht im YAML, deshalb discovery über die
      # Domains statt geratener entity_ids. Sobald die IDs bekannt sind, ist
      # eine thermostat-Karte hier die bessere Wahl.
      #
      # Betriebsart Sommer/Winter kommt aus dem KNX-Select in
      # configuration.yaml (GA 7/0/0, 1 = Sommer / 0 = Winter). Ohne Status-GA
      # kennt HASS nur den zuletzt gesendeten Wert — der Wert bleibt über
      # Neustarts erhalten, ändert sich aber nicht, wenn am Taster umgestellt
      # wird. Nachführung über die Wärmepumpen-Integration ist der nächste
      # Schritt, binary_sensor.heizung_aktiv ist dafür schon da.
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Heizung
            icon: mdi:heat-pump

          - type: custom:mushroom-template-card
            primary: Betriebsart Heizung
            secondary: >-
              {% set mode = states('select.heizung_betriebsart') %}
              {% if mode == 'Winter' %}Winterbetrieb – Heizung aktiv
              {% elif mode == 'Sommer' %}Sommerbetrieb – Heizung abgeschaltet
              {% else %}Betriebsart unbekannt{% endif %}
              · Ø-Außen {{ states('sensor.outdoor_temperature_avg') }} °C
            icon: mdi:heat-pump
            # WICHTIG: icon_color muss einzeilig bleiben. Mushroom vergleicht
            # Farben mit COLORS.includes(color) — ein Leerzeichen (z. B. aus
            # einem gefalteten Template) lässt die Farbe still ins Leere laufen.
            icon_color: "{% if is_state('select.heizung_betriebsart','Winter') %}deep-orange{% elif is_state('select.heizung_betriebsart','Sommer') %}light-blue{% else %}grey{% endif %}"
            tap_action:
              action: call-service
              service: script.heizung_betriebsart_umschalten

          # WICHTIG: mushroom kennt keinen generischen "chip"-Typ. Nur
          # "template"-Chips rendern Jinja in icon/icon_color/content —
          # genau deshalb hier alle drei als template.
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:snowflake
                content: Winter
                icon_color: "{% if is_state('select.heizung_betriebsart','Winter') %}blue{% else %}grey{% endif %}"
                tap_action:
                  action: call-service
                  service: select.select_option
                  data:
                    entity_id: select.heizung_betriebsart
                    option: Winter
              - type: template
                icon: mdi:fire
                # binary_sensor.heizung_aktiv (template.yaml) ist "unavailable",
                # solange die Betriebsart unbekannt ist — deshalb eigener Zweig
                content: >-
                  {% if is_state('binary_sensor.heizung_aktiv', 'on') %}Heizung an
                  {% elif is_state('binary_sensor.heizung_aktiv', 'off') %}Heizung aus
                  {% else %}unbekannt{% endif %}
                icon_color: "{% if is_state('binary_sensor.heizung_aktiv','on') %}deep-orange{% else %}grey{% endif %}"
              - type: template
                icon: mdi:white-balance-sunny
                content: Sommer
                icon_color: "{% if is_state('select.heizung_betriebsart','Sommer') %}amber{% else %}grey{% endif %}"
                tap_action:
                  action: call-service
                  service: select.select_option
                  data:
                    entity_id: select.heizung_betriebsart
                    option: Sommer

          # Status-Chips: Heizsaison, Wärmepumpe, Handbetrieb. Der
          # Handbetrieb-Chip schaltet die Sperre der Automatik — nur dann
          # darf die Automation die GA 7/0/0 überhaupt anfassen.
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: "{% if is_state('binary_sensor.heizsaison','on') %}mdi:snowflake{% else %}mdi:weather-sunny{% endif %}"
                content: >-
                  {% if is_state('binary_sensor.heizsaison', 'on') %}Heizsaison
                  {% elif is_state('binary_sensor.heizsaison', 'off') %}Sommerzeit
                  {% else %}Heizsaison ?{% endif %}
                icon_color: "{% if is_state('binary_sensor.heizsaison','on') %}blue{% elif is_state('binary_sensor.heizsaison','off') %}amber{% else %}grey{% endif %}"
              - type: template
                icon: "{% if is_state('binary_sensor.waermepumpe_heizen','on') %}mdi:fire{% else %}mdi:heat-pump-outline{% endif %}"
                content: >-
                  {% if is_state('binary_sensor.waermepumpe_heizen', 'on') %}WP heizt
                  {% elif is_state('binary_sensor.waermepumpe_heizen', 'off') %}WP Pause
                  {% else %}WP ?{% endif %}
                icon_color: "{% if is_state('binary_sensor.waermepumpe_heizen','on') %}deep-orange{% else %}grey{% endif %}"
              - type: template
                icon: "{% if is_state('input_boolean.heizung_betriebsart_manuell','on') %}mdi:hand-back-right{% else %}mdi:robot-outline{% endif %}"
                content: >-
                  {% if is_state('input_boolean.heizung_betriebsart_manuell', 'on') %}Handbetrieb
                  {% else %}Automatik{% endif %}
                icon_color: "{% if is_state('input_boolean.heizung_betriebsart_manuell','on') %}amber{% else %}green{% endif %}"
                tap_action:
                  action: call-service
                  service: input_boolean.toggle
                  data:
                    entity_id: input_boolean.heizung_betriebsart_manuell

          # Plausibilität: Heizsaison sagt Sommer, aber die WP fordert
          # Wärme an. Entsteht z. B., wenn am Taster umgestellt wurde und
          # GA 7/0/0 kein Status zurückmeldet.
          - type: conditional
            conditions:
              - condition: state
                entity_id: binary_sensor.waermepumpe_heizen
                state: "on"
              - condition: state
                entity_id: select.heizung_betriebsart
                state: Sommer
            card:
              type: custom:mushroom-template-card
              primary: Heizt trotz Sommerbetrieb
              secondary: >-
                Die Wärmepumpe fordert Heizen an, GA 7/0/0 steht aber auf
                Sommer. Kurz prüfen, ob am Taster umgestellt wurde.
              icon: mdi:alert-outline
              icon_color: red
              multiline_secondary: true

          # Einstellungen zur Automatik
          - type: entities
            title: Heizung – Einstellungen
            show_header_toggle: false
            entities:
              - entity: input_number.heizsaison_temp_schwelle
                name: Heizsaison ab (Ø-Außen)
              - entity: input_boolean.heizung_betriebsart_manuell
                name: Betriebsart manuell

          - type: custom:auto-entities
            card:
              type: entities
              title: Wärmepumpe & Warmwasser
              state_color: true
            filter:
              include:
                - domain: climate
                - domain: water_heater
            sort:
              method: friendly_name
            show_empty: false

          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.altherma_climatecontrol_outdoor_temperature
                icon: mdi:thermometer
                name: Außen (Nord)
              - type: entity
                entity: sensor.altherma_climatecontrol_heating_daily_electrical_consumption
                icon: mdi:lightning-bolt
                name: Heizen heute

      ###########################################################################
      # ERDGESCHOSS                                                             #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Erdgeschoss
            icon: mdi:home-floor-g

          - type: custom:mushroom-template-card
            primary: Küche
            secondary: >
              {{ states('sensor.kitchen_temperature') }} °C ·
              {{ states('sensor.kitchen_humidity') }} % ·
              Taupunkt {{ states('sensor.taupunkt_kuche') }} °C
            # Icon = Lüftungsempfehlung wie im Keller-Dashboard (fan-speed/
            # fan-off/check), nicht mehr das statische Raum-Icon. Einzeilig, weil
            # mushroom führende Leerzeichen aus gefalteten Templates beim
            # Icon-Vergleich (startsWith("mdi:")) nicht verzeiht.
            icon: "{% set s = states('sensor.luftung_kuche') %}{% if 'stark' in s %}mdi:fan-speed-3{% elif 'wenig' in s %}mdi:fan-speed-1{% elif 'Nicht' in s %}mdi:fan-off{% else %}mdi:check-circle{% endif %}"
            icon_color: "{% set s = states('sensor.luftung_kuche') %}{% if 'stark' in s %}red{% elif 'wenig' in s %}amber{% elif 'Nicht' in s %}grey{% else %}green{% endif %}"
            multiline_secondary: true
          - type: custom:mushroom-template-card
            primary: WC EG
            secondary: "{{ states('sensor.wc_gf_temperature') }} °C"
            icon: mdi:toilet
            icon_color: blue
          - type: custom:mushroom-template-card
            primary: Garderobe
            secondary: "{{ states('sensor.wardrobe_temperature') }} °C"
            icon: mdi:wardrobe
            icon_color: brown
          - type: custom:mushroom-template-card
            primary: Abstellraum
            secondary: "{{ states('sensor.utility_temperature') }} °C"
            icon: mdi:shelf
            icon_color: grey
          - type: custom:mushroom-template-card
            primary: Stiege EG<-OG
            secondary: "{{ states('sensor.stairs_eg_og_temperature_eg') }} °C"
            icon: mdi:stairs-up
            icon_color: grey

      ###########################################################################
      # OBERGESCHOSS                                                            #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Obergeschoss
            icon: mdi:home-roof

          - type: custom:mushroom-template-card
            primary: Schlafzimmer
            secondary: >
              {{ states('sensor.bedroom') }} °C ·
              {{ states('sensor.bedroom_humidity') }} % ·
              Taupunkt {{ states('sensor.taupunkt_schlafzimmer') }} °C
            icon: "{% set s = states('sensor.luftung_schlafzimmer') %}{% if 'stark' in s %}mdi:fan-speed-3{% elif 'wenig' in s %}mdi:fan-speed-1{% elif 'Nicht' in s %}mdi:fan-off{% else %}mdi:check-circle{% endif %}"
            icon_color: "{% set s = states('sensor.luftung_schlafzimmer') %}{% if 'stark' in s %}red{% elif 'wenig' in s %}amber{% elif 'Nicht' in s %}grey{% else %}green{% endif %}"
            multiline_secondary: true
          - type: custom:mushroom-template-card
            primary: Büro
            # TODO friendly-name kind2_temperature is the Büro temp per existing dashboard. Rename in HASS later.
            secondary: "{{ states('sensor.kind2_temperature') }} °C"
            icon: mdi:desk
            icon_color: deep-orange
          - type: custom:mushroom-template-card
            primary: Gästezimmer
            secondary: "{{ states('sensor.guest_room_temperature') }} °C"
            icon: mdi:bed-empty
            icon_color: pink
          - type: custom:mushroom-template-card
            primary: Badezimmer
            secondary: "{{ states('sensor.bathroom_temperature') }} °C · {{ states('sensor.bthome_sensor_5447_humidity') }} %"
            icon: mdi:bathtub
            icon_color: cyan
          - type: custom:mushroom-template-card
            primary: WC OG
            secondary: "{{ states('sensor.wc_og_temperature') }} °C · {{ states('sensor.wc_og_humidity') }} %"
            icon: mdi:toilet
            icon_color: blue
          - type: custom:mushroom-template-card
            primary: Galerie
            secondary: "{{ states('sensor.gallery_og_temperature') }} °C"
            icon: mdi:bridge
            icon_color: grey

      ###########################################################################
      # KELLER                                                                  #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Keller
            icon: mdi:home-floor-b

          - type: custom:mushroom-template-card
            primary: Flur
            secondary: "{{ states('sensor.basement_hallway_temperture') }} °C · {{ states('sensor.basement_hallway_humidity') }} %"
            icon: mdi:hallway-variant
            icon_color: grey
          - type: custom:mushroom-template-card
            primary: Technikraum
            secondary: "{{ states('sensor.engineering_temperature') }} °C · {{ states('sensor.engineering_humidity') }} %"
            icon: mdi:cog
            icon_color: grey
          - type: custom:mushroom-template-card
            primary: Hobbyraum
            secondary: "{{ states('sensor.hobby_temperature') }} °C · {{ states('sensor.hobby_humidity') }} %"
            icon: mdi:gamepad-variant
            icon_color: green
          - type: custom:mushroom-template-card
            primary: Lager
            secondary: "{{ states('sensor.storage_temperature') }} °C · {{ states('sensor.storage_humidity') }} %"
            icon: mdi:package-variant
            icon_color: brown
          - type: custom:mushroom-template-card
            primary: Stiege KG->EG
            secondary: "{{ states('sensor.stairs_kg_eg_temperature_eg') }} °C"
            icon: mdi:stairs-up
            icon_color: grey

      ###########################################################################
      # TRENDS                                                                  #
      ###########################################################################
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Trends 24 h
            icon: mdi:chart-line

          - type: custom:apexcharts-card
            header:
              show: true
              title: Innen vs. Außen
              show_states: true
            graph_span: 24h
            series:
              - entity: sensor.outdoor_temperature
                name: Außen
                stroke_width: 3
              - entity: sensor.kitchen_temperature
                name: Küche
              - entity: sensor.bedroom
                name: Schlafzimmer
              - entity: sensor.bathroom_temperature
                name: Bad
              - entity: sensor.kind2_temperature
                name: Büro

          - type: custom:apexcharts-card
            header:
              show: true
              title: Luftfeuchte 24 h
              show_states: true
            graph_span: 24h
            series:
              - entity: sensor.outdoor_humidity
                name: Außen
                stroke_width: 3
              - entity: sensor.kitchen_humidity
                name: Küche
              - entity: sensor.bedroom_humidity
                name: Schlafzimmer
              - entity: sensor.bthome_sensor_5447_humidity
                name: Bad
