###############################################################################
# KLIMA — Indoor / outdoor at a glance                                         #
# Outdoor trend up top, per-room mushroom tiles below, multi-room comparison   #
# chart for spotting hotspots.                                                 #
###############################################################################
title: Klima
views:
  - title: Übersicht
    path: home
    icon: mdi:home-thermometer
    type: sections
    max_columns: 4
    sections:

      ###########################################################################
      # AUSSEN                                                                  #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Außen
            icon: mdi:weather-partly-cloudy

          - type: weather-forecast
            entity: weather.forecast_home
            show_forecast: true

          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.outdoor_temperature
                icon: mdi:thermometer
                name: Temp
              - type: entity
                entity: sensor.outdoor_humidity
                icon: mdi:water-percent
                name: rel. F.
              - type: entity
                entity: sensor.taupunkt_aussen
                icon: mdi:water-thermometer
                name: Taupunkt
              - type: entity
                entity: sensor.wind_speed
                icon: mdi:weather-windy
                name: Wind

      ###########################################################################
      # ALERTS — zu kalt / zu warm / zu feucht                                  #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Auffällig
            icon: mdi:alert-circle-outline

          - type: custom:auto-entities
            card:
              type: entities
              title: 🔥 Über 25 °C
            filter:
              include:
                - domain: sensor
                  attributes:
                    device_class: temperature
                    unit_of_measurement: "°C"
              exclude:
                - entity_id: sensor.outdoor_*
                - entity_id: sensor.garagentor_*
                - entity_id: sensor.taupunkt_*
            sort:
              method: state
              numeric: true
              reverse: true
            show_empty: false

          - type: custom:auto-entities
            card:
              type: entities
              title: ❄️ Unter 18 °C (Innenraum)
            filter:
              include:
                - domain: sensor
                  state: "<18"
                  attributes:
                    device_class: temperature
                    unit_of_measurement: "°C"
              exclude:
                - entity_id: sensor.outdoor_*
                - entity_id: sensor.garagentor_*
                - entity_id: sensor.taupunkt_*
                - entity_id: sensor.basement_*
                - entity_id: sensor.engineering_*
                - entity_id: sensor.storage_*
                - entity_id: sensor.hobby_*
                - entity_id: sensor.stairs_*
            sort:
              method: state
              numeric: true
            show_empty: false

          - type: custom:auto-entities
            card:
              type: entities
              title: 💧 Über 65 % rel. Feuchte
            filter:
              include:
                - domain: sensor
                  attributes:
                    device_class: humidity
              exclude:
                - entity_id: sensor.outdoor_humidity
                - entity_id: sensor.garagentor_*
            sort:
              method: state
              numeric: true
              reverse: true
            show_empty: false

      ###########################################################################
      # ERDGESCHOSS                                                             #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Erdgeschoss
            icon: mdi:home-floor-g

          - type: custom:mushroom-template-card
            primary: Küche
            secondary: "{{ states('sensor.kitchen_temperature') }} °C · {{ states('sensor.kitchen_humidity') }} %"
            icon: mdi:silverware-fork-knife
            icon_color: amber
          - type: custom:mushroom-template-card
            primary: WC EG
            secondary: "{{ states('sensor.wc_gf_temperature') }} °C · {{ states('sensor.wc_gf_humidity') }} %"
            icon: mdi:toilet
            icon_color: blue
          - type: custom:mushroom-template-card
            primary: Garderobe
            secondary: "{{ states('sensor.wardrobe_temperature') }} °C"
            icon: mdi:wardrobe
            icon_color: brown
          - type: custom:mushroom-template-card
            primary: Abstellraum
            secondary: "{{ states('sensor.utility_temperature') }} °C"
            icon: mdi:shelf
            icon_color: grey
          - type: custom:mushroom-template-card
            primary: Stiege EG<-OG
            secondary: "{{ states('sensor.stairs_eg_og_temperature_eg') }} °C"
            icon: mdi:stairs-up
            icon_color: grey

      ###########################################################################
      # OBERGESCHOSS                                                            #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Obergeschoss
            icon: mdi:home-roof

          - type: custom:mushroom-template-card
            primary: Schlafzimmer
            secondary: "{{ states('sensor.bedroom') }} °C · {{ states('sensor.bedroom_humidity') }} %"
            icon: mdi:bed
            icon_color: indigo
          - type: custom:mushroom-template-card
            primary: Büro
            # TODO friendly-name kind2_temperature is the Büro temp per existing dashboard. Rename in HASS later.
            secondary: "{{ states('sensor.kind2_temperature') }} °C · {{ states('sensor.bthome_sensor_ace1_humidity') }} %"
            icon: mdi:desk
            icon_color: deep-orange
          - type: custom:mushroom-template-card
            primary: Gästezimmer
            secondary: "{{ states('sensor.guest_room_temperature') }} °C"
            icon: mdi:bed-empty
            icon_color: pink
          - type: custom:mushroom-template-card
            primary: Badezimmer
            secondary: "{{ states('sensor.bathroom_temperature') }} °C · {{ states('sensor.bthome_sensor_5447_humidity') }} %"
            icon: mdi:bathtub
            icon_color: cyan
          - type: custom:mushroom-template-card
            primary: WC OG
            secondary: "{{ states('sensor.wc_og_temperature') }} °C · {{ states('sensor.wc_og_humidity') }} %"
            icon: mdi:toilet
            icon_color: blue
          - type: custom:mushroom-template-card
            primary: Galerie
            secondary: "{{ states('sensor.gallery_og_temperature') }} °C"
            icon: mdi:bridge
            icon_color: grey

      ###########################################################################
      # KELLER                                                                  #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Keller
            icon: mdi:home-floor-b

          - type: custom:mushroom-template-card
            primary: Flur
            secondary: "{{ states('sensor.basement_hallway_temperture') }} °C"
            icon: mdi:hallway-variant
            icon_color: grey
          - type: custom:mushroom-template-card
            primary: Technikraum
            secondary: "{{ states('sensor.engineering_temperature') }} °C · {{ states('sensor.engineering_humidity') }} %"
            icon: mdi:cog
            icon_color: grey
          - type: custom:mushroom-template-card
            primary: Hobbyraum
            secondary: "{{ states('sensor.hobby_temperature') }} °C · {{ states('sensor.hobby_humidity') }} %"
            icon: mdi:gamepad-variant
            icon_color: green
          - type: custom:mushroom-template-card
            primary: Lager
            secondary: "{{ states('sensor.storage_temperature') }} °C · {{ states('sensor.storage_humidity') }} %"
            icon: mdi:package-variant
            icon_color: brown
          - type: custom:mushroom-template-card
            primary: Stiege KG->EG
            secondary: "{{ states('sensor.stairs_kg_eg_temperature_eg') }} °C"
            icon: mdi:stairs-up
            icon_color: grey

      ###########################################################################
      # TRENDS                                                                  #
      ###########################################################################
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Trends 24 h
            icon: mdi:chart-line

          - type: custom:apexcharts-card
            header:
              show: true
              title: Innen vs. Außen
              show_states: true
            graph_span: 24h
            series:
              - entity: sensor.outdoor_temperature
                name: Außen
                stroke_width: 3
              - entity: sensor.kitchen_temperature
                name: Küche
              - entity: sensor.bedroom
                name: Schlafzimmer
              - entity: sensor.bathroom_temperature
                name: Bad
              - entity: sensor.kind2_temperature
                name: Büro

          - type: custom:apexcharts-card
            header:
              show: true
              title: Luftfeuchte 24 h
              show_states: true
            graph_span: 24h
            series:
              - entity: sensor.outdoor_humidity
                name: Außen
                stroke_width: 3
              - entity: sensor.kitchen_humidity
                name: Küche
              - entity: sensor.bedroom_humidity
                name: Schlafzimmer
              - entity: sensor.bthome_sensor_5447_humidity
                name: Bad
