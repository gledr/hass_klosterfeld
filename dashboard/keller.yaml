###############################################################################
# KELLER — Tab im Dashboard "Räume" (raeume.yaml)                              #
#                                                                              #
# Licht + Klima/Lüften pro Raum in einer Kachel + Trends. Rauchmelder stehen   #
# auf Sicherheit, die ausführliche Lüften-Ansicht unter Klima → Lüften.        #
#                                                                              #
# Die Licht-Karte discovert per Muster statt per hartem entity_id: die          #
# tatsächlichen IDs stehen nicht fest (YAML-Rename ändert nur den              #
# friendly_name, nicht die entity_id — sichtbar an sensor.basement_hallway_     #
# temperture, das den alten Tippfehler konserviert hat).                       #
###############################################################################
title: Keller
path: keller
icon: mdi:home-floor-b
type: sections
max_columns: 3

badges:
  - type: entity
    entity: sensor.taupunkt_aussen
    name: Taupunkt außen
  - type: entity
    entity: sensor.outdoor_humidity
    name: Feuchte außen

sections:

  ###########################################################################
  # LICHT                                                                   #
  ###########################################################################
  - type: grid
    column_span: 1
    cards:
      - type: heading
        heading: Licht
        icon: mdi:lightbulb-group

      - type: custom:auto-entities
        card:
          type: entities
          state_color: true
        filter:
          include:
            - domain: light
              entity_id: light.*basement*
            - domain: light
              entity_id: light.*engineering*
            - domain: light
              entity_id: light.*storage*
            - domain: light
              entity_id: light.*hobby*
            - domain: light
              entity_id: light.*stairs_kg*
        sort:
          method: friendly_name
        show_empty: false

  ###########################################################################
  # KLIMA + LÜFTEN — eine Kachel pro Raum                                   #
  # Icon = Lüftungsempfehlung, Zeile 1 = Empfehlung, Zeile 2 = Werte.       #
  ###########################################################################
  - type: grid
    column_span: 2
    cards:
      - type: heading
        heading: Klima & Lüften
        icon: mdi:hvac

      - type: custom:decluttering-card
        template: lueften_raum
        variables:
          - name: Technikraum
          - temp: sensor.engineering_temperature
          - feuchte: sensor.engineering_humidity
          - taupunkt: sensor.taupunkt_technikraum
          - luftung: sensor.luftung_technikraum
      - type: custom:decluttering-card
        template: lueften_raum
        variables:
          - name: Hobbyraum
          - temp: sensor.hobby_temperature
          - feuchte: sensor.hobby_humidity
          - taupunkt: sensor.taupunkt_hobby
          - luftung: sensor.luftung_hobbyraum
      - type: custom:decluttering-card
        template: lueften_raum
        variables:
          - name: Lager
          - temp: sensor.storage_temperature
          - feuchte: sensor.storage_humidity
          - taupunkt: sensor.taupunkt_lager
          - luftung: sensor.luftung_lager
      - type: custom:decluttering-card
        template: lueften_raum
        variables:
          - name: Vorraum
          - temp: sensor.basement_hallway_temperture
          - feuchte: sensor.basement_hallway_humidity
          - taupunkt: sensor.taupunkt_vorraum
          - luftung: sensor.luftung_vorraum
      - type: custom:mushroom-template-card
        entity: sensor.stairs_kg_eg_temperature_eg
        primary: Stiege KG → EG
        secondary: "{{ states('sensor.stairs_kg_eg_temperature_eg') }} °C"
        icon: mdi:stairs-up
        icon_color: grey

      - type: custom:expander-card
        title: Wie wird die Empfehlung berechnet?
        expanded: false
        cards:
          - type: markdown
            content: >
              Vergleicht Innen-Taupunkt gegen Außen-Taupunkt
              ({{ states('sensor.taupunkt_aussen') }} °C) und schaut erst ab
              55 % rel. Feuchte hin. „Nicht lüften" heißt: draußen ist feuchter
              als drinnen — Fenster zu lassen.

  ###########################################################################
  # TRENDS                                                                  #
  ###########################################################################
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading: Trends 48 h
        icon: mdi:chart-line

      - type: custom:apexcharts-card
        header:
          show: true
          title: Luftfeuchte Keller vs. außen
          show_states: true
        graph_span: 48h
        series:
          - entity: sensor.outdoor_humidity
            name: Außen
            stroke_width: 3
          - entity: sensor.engineering_humidity
            name: Technik
          - entity: sensor.hobby_humidity
            name: Hobby
          - entity: sensor.storage_humidity
            name: Lager
        grid_options:
          columns: 6

      - type: custom:apexcharts-card
        header:
          show: true
          title: Taupunkt Keller vs. außen
          show_states: true
        graph_span: 48h
        series:
          - entity: sensor.taupunkt_aussen
            name: Außen
            stroke_width: 3
          - entity: sensor.taupunkt_technikraum
            name: Technik
          - entity: sensor.taupunkt_hobby
            name: Hobby
          - entity: sensor.taupunkt_lager
            name: Lager
        grid_options:
          columns: 6
