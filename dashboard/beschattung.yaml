###############################################################################
# BESCHATTUNG                                                                  #
#                                                                              #
# Zwei Tabs:                                                                   #
#   Räume         — was gerade ist + was man drückt (Status, eine Zeile pro    #
#                   Raum, Außenbedingungen, Schnell-Aktionen)                  #
#   Einstellungen — Schwellen, Standard-/Gast-Modus, Diagnose, Erklärungen     #
#                                                                              #
# Raum-Zeile = decluttering-Template beschattung_raum (templates.yaml):        #
#   [ Raum + Behang/Lamelle + Grund ]  [ 🔒 Sperre ] [ ✋ Hand ]                 #
# Die Sonder-Gründe pro Raum (Tür, Fenster, Privacy, Gast) kommen als          #
# Jinja-Ausdruck über die Variable `grund`.                                    #
#                                                                              #
# WICHTIG — Sections nehmen `column_span`, NICHT `columns`. Mit `columns` wird  #
# der Schlüssel still ignoriert und jede Section rendert auf 1 von 4 Spalten.   #
###############################################################################
title: Beschattung
decluttering_templates: !include templates.yaml
views:
  #############################################################################
  # TAB 1 — RÄUME                                                             #
  #############################################################################
  - title: Räume
    path: home
    icon: mdi:blinds-horizontal
    type: sections
    max_columns: 4

    badges:
      - type: entity
        entity: sensor.outdoor_temperature_avg
        name: Außen Ø
      - type: entity
        entity: sensor.wind_speed
        name: Wind
      - type: entity
        entity: sensor.beschattung_blocker
        name: Blockiert
        visibility:
          - condition: numeric_state
            entity: sensor.beschattung_blocker
            above: 0

    sections:

      ###########################################################################
      # STATUS — Tag/Nacht + was gerade blockiert                               #
      # Alles außer Tag/Nacht ist conditional: im Normalfall eine Zeile.        #
      ###########################################################################
      - type: grid
        column_span: 4
        cards:
          - type: custom:mushroom-template-card
            primary: >
              {% if is_state('switch.twilight', 'on') %}Tag{% else %}Nacht{% endif %}
            secondary: >
              {% set t = states.switch.twilight.last_changed %}
              {% set delay = states('input_number.beschattung_nacht_verzoegerung') | float(30) %}
              {% set stamp = states('input_datetime.beschattung_daemmerung_ende') | as_datetime | as_local %}
              {% set close = (stamp if stamp else t) + timedelta(minutes=delay) %}
              {% if is_state('switch.twilight', 'on') %}
                Tag seit {{ t.strftime('%H:%M') }}
              {% elif now() < close %}
                Schließt um {{ close.strftime('%H:%M') }}
              {% else %}
                Geschlossen seit {{ close.strftime('%H:%M') }}
              {% endif %}
            icon: "{% if is_state('switch.twilight', 'on') %}mdi:weather-sunny-up{% else %}mdi:weather-night{% endif %}"
            icon_color: "{% if is_state('switch.twilight', 'on') %}amber{% else %}indigo{% endif %}"
            fill_container: true
            grid_options:
              columns: 6

          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.beschattung_blocker
                above: 0
            card:
              type: custom:mushroom-template-card
              primary: >
                {{ states('sensor.beschattung_blocker') }} Beschattung(en) blockiert
              secondary: "{{ state_attr('sensor.beschattung_blocker', 'namen') }}"
              icon: mdi:hand-back-right-off
              icon_color: amber
              multiline_secondary: true
            grid_options:
              columns: 6

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.windalarm_schwelle_1
                state: "on"
            card:
              type: custom:mushroom-template-card
              primary: Windalarm aktiv
              secondary: Alle Beschattungs-Automationen blockiert
              icon: mdi:shield-alert
              icon_color: red
            grid_options:
              columns: 6

          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.beschattung_messfahrt_running
                state: "on"
            card:
              type: custom:mushroom-template-card
              primary: Messfahrt läuft
              secondary: Automation greift bis zum Ende nicht ein
              icon: mdi:cog-refresh
              icon_color: orange
            grid_options:
              columns: 6

          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.gast_modus_wohnkueche
                state: "on"
            card:
              type: custom:mushroom-template-card
              entity: input_boolean.gast_modus_wohnkueche
              primary: Gästemodus Wohnküche
              secondary: Raffstores erst um 10:00 · Präsenzmelder schaltet kein Licht
              icon: mdi:sofa
              icon_color: purple
              tap_action:
                action: toggle
            grid_options:
              columns: 6

      ###########################################################################
      # RÄUME — nach Fassade gruppiert                                          #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Süd
            icon: mdi:weather-sunny

          - type: custom:decluttering-card
            template: beschattung_raum
            variables:
              - name: Wohnzimmer
              - cover: cover.livingroom_blinds
              - lock: input_boolean.beschattung_lock_wohnzimmer
              - manual: input_boolean.beschattung_manual_wohnzimmer
              - sonne: "is_state('binary_sensor.sonne_trifft_sued', 'on')"
              - grund: "'Gast bis 10:00' if is_state('input_boolean.gast_modus_wohnkueche', 'on') and now().hour < 10 else ''"

          - type: custom:decluttering-card
            template: beschattung_raum
            variables:
              - name: Terrasse
              - cover: cover.terrace_blinds_2
              - lock: input_boolean.beschattung_lock_terrasse
              - manual: input_boolean.beschattung_manual_terrasse
              - icon: mdi:umbrella-beach
              - sonne: "is_state('binary_sensor.sonne_trifft_sued', 'on')"
              - grund: "'Tür offen' if is_state('binary_sensor.bthome_sensor_fb9c_fenster', 'on') else ('Aussperr-Schutz' if is_state('timer.terrassentuer_aussperrschutz', 'active') else ('Gast bis 10:00' if is_state('input_boolean.gast_modus_wohnkueche', 'on') and now().hour < 10 else ''))"
              - hand: Hand (2 h)
              - info: "'ganz offen, bleibt so' if state_attr('cover.terrace_blinds_2', 'current_position') | int(0) >= 100 else ''"

          - type: custom:decluttering-card
            template: beschattung_raum
            variables:
              - name: Büro
              - cover: cover.office_shutter
              - lock: input_boolean.beschattung_lock_buero
              - manual: input_boolean.beschattung_manual_buero
              - typ: rollo
              - icon: mdi:roller-shade
              - sonne: "is_state('binary_sensor.sonne_trifft_sued', 'on') or is_state('binary_sensor.blendung_buero', 'on')"
              - grund: "'Fenster offen' if is_state('binary_sensor.shelly_blu_door_window_a173_window', 'on') else ''"
              - hand: Hand bis Tag/Nacht-Wechsel
              - info: "'Blendung' if is_state('binary_sensor.blendung_buero', 'on') else ''"

          - type: custom:decluttering-card
            template: beschattung_raum
            variables:
              - name: Gästezimmer
              - cover: cover.guest_shutter
              - lock: input_boolean.beschattung_lock_gaestezimmer
              - manual: input_boolean.beschattung_manual_gaestezimmer
              - typ: rollo
              - icon: mdi:roller-shade
              - sonne: "is_state('binary_sensor.sonne_trifft_sued', 'on')"
              - grund: "'Fenster offen' if is_state('binary_sensor.shelly_blu_door_window_bb57_window', 'on') else ''"

          - type: heading
            heading: West
            icon: mdi:weather-sunset

          - type: custom:decluttering-card
            template: beschattung_raum
            variables:
              - name: Küche
              - cover: cover.kitchen_blinds
              - lock: input_boolean.beschattung_lock_kueche
              - manual: input_boolean.beschattung_manual_kueche
              - sonne: "is_state('binary_sensor.sonne_trifft_west', 'on')"
              - grund: "'Gast bis 10:00' if is_state('input_boolean.gast_modus_wohnkueche', 'on') and now().hour < 10 else ''"

          - type: custom:decluttering-card
            template: beschattung_raum
            variables:
              - name: Esszimmer
              - cover: cover.dining_blinds
              - lock: input_boolean.beschattung_lock_esszimmer
              - manual: input_boolean.beschattung_manual_esszimmer
              - sonne: "is_state('binary_sensor.sonne_trifft_west', 'on')"
              - grund: "'Gast bis 10:00' if is_state('input_boolean.gast_modus_wohnkueche', 'on') and now().hour < 10 else ''"

          - type: custom:decluttering-card
            template: beschattung_raum
            variables:
              - name: WC OG
              - cover: cover.wc_og_blinds
              - lock: input_boolean.beschattung_lock_wc_og
              - manual: input_boolean.beschattung_manual_wc_og
              - sonne: "is_state('binary_sensor.sonne_trifft_west', 'on')"

          - type: custom:decluttering-card
            template: beschattung_raum
            variables:
              - name: WC EG
              - cover: cover.wc_eg_blinds
              - lock: input_boolean.beschattung_lock_wc_eg
              - manual: input_boolean.beschattung_manual_wc_eg
              - info: "'kein Hitzeschutz (Carport)'"

          - type: heading
            heading: Nord
            icon: mdi:weather-hazy

          - type: custom:decluttering-card
            template: beschattung_raum
            variables:
              - name: Schlafzimmer
              - cover: cover.bedroom_shutter
              - lock: input_boolean.beschattung_lock_schlafzimmer
              - manual: input_boolean.beschattung_manual_schlafzimmer
              - typ: rollo
              - icon: mdi:roller-shade
              - sonne: "is_state('binary_sensor.sonne_trifft_nord', 'on')"
              - grund: "'Fenster offen' if is_state('binary_sensor.fenster_schlafzimmer_window', 'on') else ''"
              - info: "'öffnet ab ' ~ ('07:00' if is_state('binary_sensor.workday_sensor', 'on') else '10:00')"

          - type: custom:decluttering-card
            template: beschattung_raum
            variables:
              - name: Badezimmer
              - cover: cover.bathroom_blinds
              - lock: input_boolean.beschattung_lock_badezimmer
              - manual: input_boolean.beschattung_manual_badezimmer
              - sonne: "is_state('binary_sensor.sonne_trifft_nord', 'on')"
              - grund: "'Privacy aktiv' if is_state('input_boolean.badezimmer_privacy_active', 'on') else ''"
              - info: "'Lüften (Handtuchheizkörper)' if is_state('switch.handtuchheizkoerper', 'on') and is_state('switch.twilight', 'off') else ''"

          - type: custom:decluttering-card
            template: beschattung_raum
            variables:
              - name: Garderobe
              - cover: cover.wardrobe_blinds
              - lock: input_boolean.beschattung_lock_garderobe
              - manual: input_boolean.beschattung_manual_garderobe
              - sonne: "is_state('binary_sensor.sonne_trifft_nord', 'on')"

          - type: custom:decluttering-card
            template: beschattung_raum
            variables:
              - name: Abstellraum
              - cover: cover.shelf_blinds
              - lock: input_boolean.beschattung_lock_abstellraum
              - manual: input_boolean.beschattung_manual_abstellraum
              - sonne: "is_state('binary_sensor.sonne_trifft_nord', 'on')"

          - type: custom:expander-card
            title: Was bedeuten 🔒 und ✋?
            expanded: false
            cards:
              - type: markdown
                content: >
                  🔒 **Sperre** — du hast pausiert, hält bis Mitternacht.
                  ✋ **Hand** — automatisch erkannt, weil die Beschattung ohne
                  Auftrag gefahren ist; läuft nach 1 h ab (Terrasse 2 h, Büro
                  erst beim Tag/Nacht-Wechsel) oder beim nächsten
                  Tag/Nacht-Wechsel. Beide grau = Automation arbeitet.

                  Farbe der Raum-Kachel: **rot** gesperrt · **lila** äußerer
                  Grund (Tür/Fenster offen, Privacy, Gast) · **amber** Hand ·
                  **orange** Sonne auf der Fassade.

      ###########################################################################
      # AUSSENBEDINGUNGEN                                                       #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Außenbedingungen
            icon: mdi:weather-sunny
            badges:
              - type: entity
                entity: sensor.outdoor_temperature
                name: Jetzt
              - type: entity
                entity: sun.sun

          # Welche Fassade wird gerade getroffen — mit der Schwelle, an der es
          # gerade scheitert. Temperatur-Gate zuerst: es gilt für alle drei
          # Fassaden, und ein zu niedriges Gate war der Grund, warum bei 17 °C
          # draußen Hitzeschutz lief.
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Süd
                secondary: >
                  {% set temp = states('sensor.outdoor_temperature_avg') | float(0) %}
                  {% set gate = states('input_number.beschattung_hitze_temp') | float(22) %}
                  {% set wahl = states('input_select.beschattung_saison') %}
                  {% set winter = wahl == 'Winter'
                     or (wahl != 'Sommer' and is_state('binary_sensor.heizsaison', 'on')) %}
                  {% if is_state('binary_sensor.sonne_trifft_sued', 'on') %}Aktiv
                  {% elif winter %}Winter – aus
                  {% elif temp <= gate %}{{ temp | round(0) }} / {{ gate | round(0) }} °C
                  {% else %}{{ states('sensor.helligkeit_sud') | int(0) }} /
                  {{ states('input_number.beschattung_lux_sud') | int(0) }} lx{% endif %}
                icon: mdi:weather-sunny
                icon_color: "{% if is_state('binary_sensor.sonne_trifft_sued', 'on') %}orange{% else %}disabled{% endif %}"
                layout: vertical
              - type: custom:mushroom-template-card
                primary: West
                secondary: >
                  {% set temp = states('sensor.outdoor_temperature_avg') | float(0) %}
                  {% set gate = states('input_number.beschattung_hitze_temp') | float(22) %}
                  {% set wahl = states('input_select.beschattung_saison') %}
                  {% set winter = wahl == 'Winter'
                     or (wahl != 'Sommer' and is_state('binary_sensor.heizsaison', 'on')) %}
                  {% if is_state('binary_sensor.sonne_trifft_west', 'on') %}Aktiv
                  {% elif winter %}Winter – aus
                  {% elif temp <= gate %}{{ temp | round(0) }} / {{ gate | round(0) }} °C
                  {% else %}{{ states('sensor.helligkeit_west') | int(0) }} /
                  {{ states('input_number.beschattung_lux_west') | int(0) }} lx{% endif %}
                icon: mdi:weather-sunset
                icon_color: "{% if is_state('binary_sensor.sonne_trifft_west', 'on') %}orange{% else %}disabled{% endif %}"
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Nord
                secondary: >
                  {% set temp = states('sensor.outdoor_temperature_avg') | float(0) %}
                  {% set gate = states('input_number.beschattung_hitze_temp') | float(22) %}
                  {% set wahl = states('input_select.beschattung_saison') %}
                  {% set winter = wahl == 'Winter'
                     or (wahl != 'Sommer' and is_state('binary_sensor.heizsaison', 'on')) %}
                  {% if is_state('binary_sensor.sonne_trifft_nord', 'on') %}Aktiv
                  {% elif winter %}Winter – aus
                  {% elif temp <= gate %}{{ temp | round(0) }} / {{ gate | round(0) }} °C
                  {% else %}{{ states('sensor.helligkeit_nord') | int(0) }} /
                  {{ states('input_number.beschattung_lux_nord') | int(0) }} lx{% endif %}
                icon: mdi:weather-hazy
                icon_color: "{% if is_state('binary_sensor.sonne_trifft_nord', 'on') %}orange{% else %}disabled{% endif %}"
                layout: vertical

          - type: custom:mini-graph-card
            name: Helligkeit 12 h
            entities:
              - entity: sensor.helligkeit_sud
                name: Süd
                color: '#f59e0b'
              - entity: sensor.helligkeit_west
                name: West
                color: '#ef4444'
              - entity: sensor.helligkeit_nord
                name: Nord
                color: '#0ea5e9'
            hours_to_show: 12
            points_per_hour: 4
            line_width: 2
            show:
              labels: true
              extrema: true

      ###########################################################################
      # SCHNELL-AKTIONEN                                                        #
      # Fahren direkt → die Automation liest das als Hand-Bedienung und lässt   #
      # die Räume 1 h in Ruhe (Terrasse 2 h, Büro bis zum Tag/Nacht-Wechsel).   #
      # Nicht gewollt → "Alles freigeben".                                      #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Schnell-Aktionen
            icon: mdi:gesture-tap-button

          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Mittagshitze
                secondary: Süd + West zu
                icon: mdi:weather-sunny-alert
                icon_color: red
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_tilt_position
                  data:
                    tilt_position: 0
                  target:
                    entity_id:
                      - cover.livingroom_blinds
                      - cover.terrace_blinds_2
                      - cover.kitchen_blinds
                      - cover.dining_blinds

              - type: custom:mushroom-template-card
                primary: Blendschutz
                secondary: Lamellen halb
                icon: mdi:blinds-horizontal
                icon_color: amber
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_tilt_position
                  data:
                    tilt_position: 50
                  target:
                    entity_id:
                      - cover.livingroom_blinds
                      - cover.kitchen_blinds
                      - cover.dining_blinds

              - type: custom:mushroom-template-card
                primary: Lamellen auf
                secondary: alle Raffstore
                icon: mdi:blinds-horizontal
                icon_color: green
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_tilt_position
                  data:
                    tilt_position: 100
                  target:
                    entity_id:
                      - cover.livingroom_blinds
                      - cover.terrace_blinds_2
                      - cover.kitchen_blinds
                      - cover.dining_blinds
                      - cover.wc_eg_blinds
                      - cover.wc_og_blinds
                      - cover.bathroom_blinds
                      - cover.wardrobe_blinds
                      - cover.shelf_blinds

              - type: custom:mushroom-template-card
                primary: Alle sperren
                secondary: Urlaub / Ausschlafen
                icon: mdi:lock
                icon_color: red
                layout: vertical
                tap_action:
                  action: call-service
                  service: input_boolean.turn_on
                  target:
                    entity_id:
                      - input_boolean.beschattung_lock_schlafzimmer
                      - input_boolean.beschattung_lock_gaestezimmer
                      - input_boolean.beschattung_lock_buero
                      - input_boolean.beschattung_lock_wohnzimmer
                      - input_boolean.beschattung_lock_terrasse
                      - input_boolean.beschattung_lock_kueche
                      - input_boolean.beschattung_lock_esszimmer
                      - input_boolean.beschattung_lock_wc_eg
                      - input_boolean.beschattung_lock_wc_og
                      - input_boolean.beschattung_lock_badezimmer
                      - input_boolean.beschattung_lock_abstellraum
                      - input_boolean.beschattung_lock_garderobe

              - type: custom:mushroom-template-card
                primary: Alles freigeben
                secondary: Sperren + Hand
                icon: mdi:lock-open-variant
                icon_color: green
                layout: vertical
                tap_action:
                  action: call-service
                  service: input_boolean.turn_off
                  target:
                    entity_id:
                      - input_boolean.beschattung_lock_schlafzimmer
                      - input_boolean.beschattung_lock_gaestezimmer
                      - input_boolean.beschattung_lock_buero
                      - input_boolean.beschattung_lock_wohnzimmer
                      - input_boolean.beschattung_lock_terrasse
                      - input_boolean.beschattung_lock_kueche
                      - input_boolean.beschattung_lock_esszimmer
                      - input_boolean.beschattung_lock_wc_eg
                      - input_boolean.beschattung_lock_wc_og
                      - input_boolean.beschattung_lock_badezimmer
                      - input_boolean.beschattung_lock_abstellraum
                      - input_boolean.beschattung_lock_garderobe
                      - input_boolean.beschattung_manual_schlafzimmer
                      - input_boolean.beschattung_manual_gaestezimmer
                      - input_boolean.beschattung_manual_buero
                      - input_boolean.beschattung_manual_wohnzimmer
                      - input_boolean.beschattung_manual_terrasse
                      - input_boolean.beschattung_manual_kueche
                      - input_boolean.beschattung_manual_esszimmer
                      - input_boolean.beschattung_manual_wc_eg
                      - input_boolean.beschattung_manual_wc_og
                      - input_boolean.beschattung_manual_badezimmer
                      - input_boolean.beschattung_manual_abstellraum
                      - input_boolean.beschattung_manual_garderobe

              - type: custom:mushroom-template-card
                primary: Messfahrt
                secondary: kalibrieren
                icon: mdi:cog-refresh
                icon_color: orange
                layout: vertical
                tap_action:
                  action: call-service
                  service: script.messfahrt_alle
                  confirmation:
                    text: Messfahrt für alle Raffstore starten? Sie fahren komplett auf und zu.

  #############################################################################
  # TAB 2 — EINSTELLUNGEN                                                     #
  #############################################################################
  - title: Einstellungen
    path: einstellungen
    icon: mdi:tune
    type: sections
    max_columns: 3
    sections:

      ###########################################################################
      # HITZESCHUTZ                                                             #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Hitzeschutz
            icon: mdi:sun-thermometer

          - type: custom:mushroom-template-card
            primary: Hitzeschutz
            secondary: >
              {% set wahl = states('input_select.beschattung_saison') %}
              {% if wahl == 'Sommer' %}an – fest eingestellt auf Sommer
              {% elif wahl == 'Winter' %}aus – fest eingestellt auf Winter
              {% elif is_state('binary_sensor.heizsaison', 'on') %}aus – Heizsaison, die Sonnenwärme soll rein
              {% elif is_state('binary_sensor.heizsaison', 'off') %}an – keine Heizsaison
              {% else %}unklar – Heizsaison nicht verfügbar{% endif %}
            icon: "{% set wahl = states('input_select.beschattung_saison') %}{% if wahl == 'Sommer' or (wahl != 'Winter' and is_state('binary_sensor.heizsaison', 'off')) %}mdi:fire{% elif wahl == 'Winter' or is_state('binary_sensor.heizsaison', 'on') %}mdi:snowflake{% else %}mdi:help{% endif %}"
            icon_color: "{% set wahl = states('input_select.beschattung_saison') %}{% if wahl == 'Sommer' or (wahl != 'Winter' and is_state('binary_sensor.heizsaison', 'off')) %}orange{% elif wahl == 'Winter' or is_state('binary_sensor.heizsaison', 'on') %}blue{% else %}grey{% endif %}"
            multiline_secondary: true

          - type: entities
            entities:
              - entity: input_select.beschattung_saison
                name: Saison
              - entity: input_number.beschattung_hitze_temp
                name: Ø-Außentemperatur ab
              - type: section
                label: Lux je Fassade
              - entity: input_number.beschattung_lux_sud
                name: Süd
              - entity: input_number.beschattung_lux_west
                name: West
              - entity: input_number.beschattung_lux_nord
                name: Nord
              - type: section
                label: Nacht
              - entity: input_number.beschattung_nacht_verzoegerung
                name: Schließen nach Dämmerung

          - type: custom:expander-card
            title: Wie funktioniert das?
            expanded: false
            cards:
              - type: markdown
                content: >
                  **Hitzeschutz** braucht alle drei Bedingungen gleichzeitig:
                  Ø-Außentemperatur über der Temperatur-Schwelle, Helligkeit über
                  der Lux-Schwelle der Fassade und Sonnenstand über 10°.
                  Helligkeit allein löst nichts aus (sonst reicht diffuser Nebel).

                  **Saison**: Standard ist *Automatisch (Heizsaison)* — der
                  Hitzeschutz folgt `binary_sensor.heizsaison`, also genau dem
                  Signal, nach dem auch die Heizung zwischen Sommer- und
                  Winterbetrieb schaltet (GA 7/0/0). Wenn es kalt genug ist zum
                  Heizen, soll die Sonne ungehindert durch: **Hitzeschutz aus**,
                  die Rollo bleiben im normalen Tag-Zustand, die Sonnenwärme kommt
                  rein. Tag/Nacht und Sichtschutz laufen unverändert weiter.
                  *Sommer* oder *Winter* überschreiben das für eine Ausnahme
                  dauerhaft.

                  **Temperatur-Schwelle**: Der Wert überlebt einen HA-Neustart
                  (anders als die Lux-Schwellen, die per `initial:` auf 15000
                  zurückfallen). Empfehlung: 22 °C.

                  **Nacht-Verzögerung**: Wartezeit nach Dämmerungs-Ende, bis alles
                  zufährt. 0 = sofort mit der Flanke. Aufgefahren wird unabhängig
                  davon immer sofort bei Tagesbeginn.

      ###########################################################################
      # STANDARD-MODUS + GAST-MODUS                                             #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Standard-Modus
            icon: mdi:tune

          - type: custom:mushroom-select-card
            entity: input_select.beschattung_default_wohnzimmer
            name: Wohnzimmer
          - type: custom:mushroom-select-card
            entity: input_select.beschattung_default_terrasse
            name: Terrasse

          - type: custom:expander-card
            title: Was heißt das?
            expanded: false
            cards:
              - type: markdown
                content: >
                  **Automatisch (Präsenz)**: Standard-Verhalten — Behang zu,
                  Lamellen halb. Die Automation fährt hier **nichts von selbst
                  hoch**. Machst du den Raffstore aber selbst auf, während jemand
                  in der Wohnküche ist, bleibt er offen — bis 30 Min nach dem
                  Verlassen des Raums. Hitzeschutz und Nacht haben weiter Vorrang
                  (Terrasse: Hitzeschutz nur bei geschlossener Terrassentür).

                  **Offen / Zu / Lamellen halb**: Überschreibt den Standard in
                  Tag-Modus. Hitzeschutz und Nacht greifen weiterhin.

          - type: heading
            heading: Gast-Modus
            icon: mdi:bed-empty

          - type: custom:mushroom-entity-card
            entity: input_boolean.gast_modus_wohnkueche
            name: Wohnküche (Couch)
            icon: mdi:sofa
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: input_boolean.beschattung_gast_aktiv_gaestezimmer
            name: Gästezimmer
            icon: mdi:bed-empty
            tap_action:
              action: toggle
            grid_options:
              columns: 6
          - type: custom:mushroom-entity-card
            entity: input_boolean.beschattung_gast_aktiv_buero
            name: Büro
            icon: mdi:sofa-single
            tap_action:
              action: toggle
            grid_options:
              columns: 6

          - type: custom:expander-card
            title: Was macht der Gast-Modus?
            expanded: false
            cards:
              - type: markdown
                content: >
                  **Gästezimmer / Büro**: Die Beschattung fährt nicht mit
                  Sonnenaufgang hoch, sondern erst um **10:00** am Wochenende
                  (Werktag 7:00) — für ausgeschlafene Gäste auf der Schlafcouch.

                  **Wohnküche**: Raffstores jeden Tag erst um **10:00**, auch
                  kein Hitzeschutz davor. Der Präsenzmelder schaltet kein Licht,
                  die Messfahrt fällt aus. Bleibt an, bis du ihn ausschaltest.

      ###########################################################################
      # DIAGNOSE                                                                #
      ###########################################################################
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Diagnose
            icon: mdi:stethoscope

          - type: entities
            entities:
              - entity: switch.twilight
                name: Tag/Nacht (KNX 8/4/0)
              - entity: input_datetime.beschattung_daemmerung_ende
                name: Letztes Dämmerungs-Ende
              - entity: input_datetime.beschattung_letzter_auto_befehl
                name: Letzter Auto-Befehl
              - entity: input_boolean.beschattung_messfahrt_running
                name: Messfahrt läuft
              - entity: binary_sensor.windalarm_schwelle_1
                name: Windalarm Schwelle 1
              - entity: input_boolean.badezimmer_privacy_active
                name: Bad Privacy
              - entity: timer.terrassentuer_aussperrschutz
                name: Terrassentür Aussperr-Schutz

          - type: custom:expander-card
            title: Sensor-Locks Helligkeit
            expanded: false
            cards:
              - type: entities
                entities:
                  - entity: binary_sensor.helligkeit_ost_lock
                    name: Lock Ost
                  - entity: binary_sensor.helligkeit_sud_lock
                    name: Lock Süd
                  - entity: binary_sensor.helligkeit_west_lock
                    name: Lock West
