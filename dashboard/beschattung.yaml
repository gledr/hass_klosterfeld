title: Beschattung
views:
  - title: Übersicht
    path: home
    icon: mdi:blinds-horizontal
    type: sections
    max_columns: 4

    sections:

      ###########################################################################
      # AUSSENBEDINGUNGEN                                                      #
      ###########################################################################
      - type: grid
        columns: 1
        cards:

          - type: heading
            heading: Außenbedingungen
            icon: mdi:weather-sunny

          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mini-graph-card
                name: Helligkeit Süd
                entities:
                  - entity: sensor.helligkeit_sud
                hours_to_show: 12
                points_per_hour: 4
                show:
                  labels: true
                  extrema: true

              - type: custom:mini-graph-card
                name: Helligkeit West
                entities:
                  - entity: sensor.helligkeit_west
                hours_to_show: 12
                points_per_hour: 4
                show:
                  labels: true
                  extrema: true

              - type: custom:mini-graph-card
                name: Helligkeit Nord
                entities:
                  - entity: sensor.helligkeit_nord
                hours_to_show: 12
                points_per_hour: 4
                show:
                  labels: true
                  extrema: true

          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.outdoor_temperature_avg
                name: Außen Ø
              - type: entity
                entity: sensor.outdoor_temperature
                name: Jetzt
              - type: entity
                entity: sensor.wind_speed
                name: Wind
              - type: entity
                entity: sun.sun
                name: Sonne


      ###########################################################################
      # SONNENERKENNUNG                                                        #
      ###########################################################################
      - type: grid
        columns: 1
        cards:

          - type: heading
            heading: Sonne trifft Fassade
            icon: mdi:compass-outline

          - type: grid
            columns: 3
            cards:
              - type: custom:mushroom-template-card
                primary: Süd
                secondary: >
                  {% if is_state('binary_sensor.sonne_trifft_sued','on') %}Aktiv{% else %}–{% endif %}
                icon: mdi:weather-sunny

              - type: custom:mushroom-template-card
                primary: West
                secondary: >
                  {% if is_state('binary_sensor.sonne_trifft_west','on') %}Aktiv{% else %}–{% endif %}
                icon: mdi:weather-sunset

              - type: custom:mushroom-template-card
                primary: Nord
                secondary: >
                  {% if is_state('binary_sensor.sonne_trifft_nord','on') %}Aktiv{% else %}–{% endif %}
                icon: mdi:weather-hazy

          - type: custom:mushroom-template-card
            primary: Windalarm
            secondary: >
              {% if is_state('binary_sensor.windalarm_schwelle_1','on') %}
                AKTIV — Automationen blockiert
              {% else %}
                Inaktiv
              {% endif %}
            icon: mdi:shield-alert


      ###########################################################################
      # STEUERUNG                                                             #
      ###########################################################################
      - type: grid
        columns: 1
        cards:

          - type: heading
            heading: Steuerung
            icon: mdi:tune

          - type: entities
            title: Override
            entities:
              - entity: input_boolean.beschattung_terrasse_override

          - type: entities
            title: Schwellenwerte
            entities:
              - entity: input_number.beschattung_threshold_niedrig
              - entity: input_number.beschattung_threshold_hoch
              - entity: input_number.beschattung_terrasse_abend


      ###########################################################################
      # SÜD                                                                  #
      ###########################################################################
      - type: grid
        columns: 2
        cards:

          - type: heading
            heading: Süd-Fassade
            icon: mdi:weather-sunny

          - type: custom:mushroom-cover-card
            entity: cover.livingroom_blinds
            name: Wohnzimmer

          - type: custom:mushroom-cover-card
            entity: cover.terrace_blinds_2
            name: Terrasse

          - type: custom:mushroom-cover-card
            entity: cover.office_shutter
            name: Büro

          - type: custom:mushroom-cover-card
            entity: cover.guest_shutter
            name: Gästezimmer


      ###########################################################################
      # WEST                                                                 #
      ###########################################################################
      - type: grid
        columns: 2
        cards:

          - type: heading
            heading: West-Fassade
            icon: mdi:weather-sunset

          - type: custom:mushroom-cover-card
            entity: cover.kitchen_blinds
            name: Küche

          - type: custom:mushroom-cover-card
            entity: cover.dining_blinds
            name: Esszimmer

          - type: custom:mushroom-cover-card
            entity: cover.wc_eg_blinds
            name: WC EG

          - type: custom:mushroom-cover-card
            entity: cover.wc_og_blinds
            name: WC OG


      ###########################################################################
      # NORD / INNEN                                                        #
      ###########################################################################
      - type: grid
        columns: 2
        cards:

          - type: heading
            heading: Nord-Fassade
            icon: mdi:weather-hazy

          - type: custom:mushroom-cover-card
            entity: cover.wardrobe_blinds
            name: Garderobe

          - type: custom:mushroom-cover-card
            entity: cover.shelf_blinds
            name: Abstellraum

          - type: custom:mushroom-cover-card
            entity: cover.bathroom_blinds
            name: Badezimmer

          - type: custom:mushroom-cover-card
            entity: cover.bedroom_shutter
            name: Schlafzimmer


      ###########################################################################
      # SCHNELL-AKTIONEN                                                     #
      ###########################################################################
      - type: grid
        columns: 1
        cards:

          - type: heading
            heading: Schnell-Aktionen
            icon: mdi:gesture-tap-button

          - type: grid
            columns: 2
            square: false
            cards:

              - type: custom:mushroom-template-card
                primary: Mittagshitze
                icon: mdi:weather-sunny-alert
                icon_color: red
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_tilt_position
                  data:
                    tilt_position: 0
                  target:
                    entity_id:
                      - cover.livingroom_blinds
                      - cover.terrace_blinds
                      - cover.kitchen_blinds
                      - cover.dining_blinds

              - type: custom:mushroom-template-card
                primary: Blendschutz
                icon: mdi:blinds-horizontal
                icon_color: amber
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_tilt_position
                  data:
                    tilt_position: 50
                  target:
                    entity_id:
                      - cover.livingroom_blinds
                      - cover.kitchen_blinds
                      - cover.dining_blinds

              - type: custom:mushroom-template-card
                primary: Alles auf
                icon: mdi:arrow-up-bold-box
                icon_color: green
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.open_cover
                  target:
                    entity_id:
                      - cover.livingroom_blinds
                      - cover.kitchen_blinds
                      - cover.dining_blinds
                      - cover.bedroom_shutter

              - type: custom:mushroom-template-card
                primary: Alles zu
                icon: mdi:arrow-down-bold-box
                icon_color: indigo
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.close_cover
                  target:
                    entity_id:
                      - cover.livingroom_blinds
                      - cover.kitchen_blinds
                      - cover.dining_blinds
                      - cover.bedroom_shutter