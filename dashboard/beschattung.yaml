title: Beschattung
views:
  - title: Übersicht
    path: home
    icon: mdi:blinds-horizontal
    type: sections
    max_columns: 4

    sections:

      ###########################################################################
      # AUSSENBEDINGUNGEN                                                      #
      ###########################################################################
      - type: grid
        columns: 1
        cards:

          - type: heading
            heading: Außenbedingungen
            icon: mdi:weather-sunny

          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mini-graph-card
                name: Helligkeit Süd
                entities:
                  - entity: sensor.helligkeit_sud
                hours_to_show: 12
                points_per_hour: 4
                show:
                  labels: true
                  extrema: true

              - type: custom:mini-graph-card
                name: Helligkeit West
                entities:
                  - entity: sensor.helligkeit_west
                hours_to_show: 12
                points_per_hour: 4
                show:
                  labels: true
                  extrema: true

              - type: custom:mini-graph-card
                name: Helligkeit Nord
                entities:
                  - entity: sensor.helligkeit_nord
                hours_to_show: 12
                points_per_hour: 4
                show:
                  labels: true
                  extrema: true

          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: sensor.outdoor_temperature_avg
                name: Außen Ø
              - type: entity
                entity: sensor.outdoor_temperature
                name: Jetzt
              - type: entity
                entity: sensor.wind_speed
                name: Wind
              - type: entity
                entity: sun.sun
                name: Sonne

          - type: custom:mushroom-template-card
            primary: >
              {% if is_state('switch.twilight','on') %}Tag{% else %}Nacht{% endif %}
            secondary: >
              {% set t = states.switch.twilight.last_changed %}
              {% set close = t + timedelta(minutes=30) %}
              {% if is_state('switch.twilight','on') %}
                Tag seit {{ t.strftime('%H:%M') }}
              {% elif now() < close %}
                Schließt um {{ close.strftime('%H:%M') }}
              {% else %}
                Geschlossen {{ close.strftime('%H:%M') }}
              {% endif %} (switch.twilight: {{ states('switch.twilight') }})
            icon: >
              {% if is_state('switch.twilight','on') %}mdi:weather-sunny-up{% else %}mdi:weather-night{% endif %}
            icon_color: >
              {% if is_state('switch.twilight','on') %}amber{% else %}indigo{% endif %}


      ###########################################################################
      # SONNENERKENNUNG                                                        #
      ###########################################################################
      - type: grid
        columns: 1
        cards:

          - type: heading
            heading: Sonne trifft Fassade
            icon: mdi:compass-outline

          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:compass-outline
                content: >
                  {{ state_attr('sun.sun','azimuth') | round(0) }}°
                icon_color: >
                  {% set az = state_attr('sun.sun','azimuth') | float(0) %}
                  {% if 135 <= az < 225 %}amber
                  {% elif 225 <= az < 315 %}orange
                  {% elif az >= 315 or az < 45 %}blue
                  {% else %}grey{% endif %}
              - type: template
                icon: mdi:angle-acute
                content: >
                  {{ state_attr('sun.sun','elevation') | round(0) }}°
              - type: template
                icon: mdi:weather-sunny
                content: "Süd 135–250°"
              - type: template
                icon: mdi:weather-sunset
                content: "West 200–315°"
              - type: template
                icon: mdi:weather-hazy
                content: "Nord 290–70°"

          - type: grid
            columns: 3
            cards:
              - type: custom:mushroom-template-card
                primary: Süd
                secondary: >
                  {% if is_state('binary_sensor.sonne_trifft_sued','on') %}Aktiv{% else %}–{% endif %}
                icon: mdi:weather-sunny

              - type: custom:mushroom-template-card
                primary: West
                secondary: >
                  {% if is_state('binary_sensor.sonne_trifft_west','on') %}Aktiv{% else %}–{% endif %}
                icon: mdi:weather-sunset

              - type: custom:mushroom-template-card
                primary: Nord
                secondary: >
                  {% if is_state('binary_sensor.sonne_trifft_nord','on') %}Aktiv{% else %}–{% endif %}
                icon: mdi:weather-hazy

          - type: custom:mushroom-template-card
            primary: Windalarm
            secondary: >
              {% if is_state('binary_sensor.windalarm_schwelle_1','on') %}
                AKTIV — Automationen blockiert
              {% else %}
                Inaktiv
              {% endif %}
            icon: mdi:shield-alert


      ###########################################################################
      # STEUERUNG                                                             #
      ###########################################################################
      - type: grid
        columns: 1
        cards:

          - type: heading
            heading: Steuerung
            icon: mdi:tune

          - type: entities
            title: Lux-Schwellen (Hitzeschutz-Trigger)
            entities:
              - entity: input_number.beschattung_lux_sud
              - entity: input_number.beschattung_lux_west
              - entity: input_number.beschattung_lux_nord


      ###########################################################################
      # SPERREN (Urlaub / Ausschlafen)                                         #
      ###########################################################################
      - type: grid
        columns: 1
        cards:

          - type: heading
            heading: Sperren
            icon: mdi:lock

          - type: markdown
            content: >
              Wenn aktiv, fasst keine Auto-Beschattung diese Beschattung an.
              Auf Verstellen reagiert nur noch die Hand. Ideal für Urlaub
              oder Ausschlafen.

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_lock_schlafzimmer
                name: Schlafzimmer
                icon: mdi:lock
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_lock_gaestezimmer
                name: Gästezimmer
                icon: mdi:lock
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_lock_buero
                name: Büro
                icon: mdi:lock
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_lock_wohnzimmer
                name: Wohnzimmer
                icon: mdi:lock
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_lock_terrasse
                name: Terrasse
                icon: mdi:lock
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_lock_kueche
                name: Küche
                icon: mdi:lock
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_lock_esszimmer
                name: Esszimmer
                icon: mdi:lock
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_lock_wc_eg
                name: WC EG
                icon: mdi:lock
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_lock_wc_og
                name: WC OG
                icon: mdi:lock
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_lock_badezimmer
                name: Badezimmer
                icon: mdi:lock
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_lock_abstellraum
                name: Abstellraum
                icon: mdi:lock
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_lock_garderobe
                name: Garderobe
                icon: mdi:lock
                tap_action:
                  action: toggle

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Alle sperren
                icon: mdi:lock
                icon_color: red
                layout: vertical
                tap_action:
                  action: call-service
                  service: input_boolean.turn_on
                  target:
                    entity_id:
                      - input_boolean.beschattung_lock_schlafzimmer
                      - input_boolean.beschattung_lock_gaestezimmer
                      - input_boolean.beschattung_lock_buero
                      - input_boolean.beschattung_lock_wohnzimmer
                      - input_boolean.beschattung_lock_terrasse
                      - input_boolean.beschattung_lock_kueche
                      - input_boolean.beschattung_lock_esszimmer
                      - input_boolean.beschattung_lock_wc_eg
                      - input_boolean.beschattung_lock_wc_og
                      - input_boolean.beschattung_lock_badezimmer
                      - input_boolean.beschattung_lock_abstellraum
                      - input_boolean.beschattung_lock_garderobe
              - type: custom:mushroom-template-card
                primary: Alle entsperren
                icon: mdi:lock-open
                icon_color: green
                layout: vertical
                tap_action:
                  action: call-service
                  service: input_boolean.turn_off
                  target:
                    entity_id:
                      - input_boolean.beschattung_lock_schlafzimmer
                      - input_boolean.beschattung_lock_gaestezimmer
                      - input_boolean.beschattung_lock_buero
                      - input_boolean.beschattung_lock_wohnzimmer
                      - input_boolean.beschattung_lock_terrasse
                      - input_boolean.beschattung_lock_kueche
                      - input_boolean.beschattung_lock_esszimmer
                      - input_boolean.beschattung_lock_wc_eg
                      - input_boolean.beschattung_lock_wc_og
                      - input_boolean.beschattung_lock_badezimmer
                      - input_boolean.beschattung_lock_abstellraum
                      - input_boolean.beschattung_lock_garderobe


      ###########################################################################
      # MANUELL ERKANNT                                                       #
      # Automatisch gesetzt, wenn eine Beschattung von Hand bewegt wurde.      #
      # Gilt 1 Stunde (Terrasse 2 h) — oder per Antippen hier löschen.         #
      ###########################################################################
      - type: grid
        columns: 1
        cards:

          - type: heading
            heading: Manuell erkannt
            icon: mdi:gesture-tap

          - type: markdown
            content: >
              Hier aufgeführt, wenn die Automation eine Hand-Bedienung erkannt
              hat. Solange aktiv, fasst die Automation den Raum nicht mehr an
              (1 Stunde; Terrasse 2 Stunden) und wird danach automatisch
              gelöscht. Ist der Terrassen-Raffstore komplett offen, bleibt die
              Sperre aktiv (man ist evtl. draußen).

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_manual_schlafzimmer
                name: Schlafzimmer
                icon: mdi:gesture-tap
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_manual_gaestezimmer
                name: Gästezimmer
                icon: mdi:gesture-tap
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_manual_buero
                name: Büro
                icon: mdi:gesture-tap
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_manual_wohnzimmer
                name: Wohnzimmer
                icon: mdi:gesture-tap
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_manual_terrasse
                name: Terrasse
                icon: mdi:gesture-tap
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_manual_kueche
                name: Küche
                icon: mdi:gesture-tap
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_manual_esszimmer
                name: Esszimmer
                icon: mdi:gesture-tap
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_manual_wc_eg
                name: WC EG
                icon: mdi:gesture-tap
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_manual_wc_og
                name: WC OG
                icon: mdi:gesture-tap
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_manual_badezimmer
                name: Badezimmer
                icon: mdi:gesture-tap
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_manual_abstellraum
                name: Abstellraum
                icon: mdi:gesture-tap
                tap_action:
                  action: toggle
              - type: custom:mushroom-entity-card
                entity: input_boolean.beschattung_manual_garderobe
                name: Garderobe
                icon: mdi:gesture-tap
                tap_action:
                  action: toggle

          - type: custom:mushroom-template-card
            primary: Alle aufheben
            icon: mdi:gesture-tap-hold
            icon_color: amber
            layout: vertical
            tap_action:
              action: call-service
              service: input_boolean.turn_off
              target:
                entity_id:
                  - input_boolean.beschattung_manual_schlafzimmer
                  - input_boolean.beschattung_manual_gaestezimmer
                  - input_boolean.beschattung_manual_buero
                  - input_boolean.beschattung_manual_wohnzimmer
                  - input_boolean.beschattung_manual_terrasse
                  - input_boolean.beschattung_manual_kueche
                  - input_boolean.beschattung_manual_esszimmer
                  - input_boolean.beschattung_manual_wc_eg
                  - input_boolean.beschattung_manual_wc_og
                  - input_boolean.beschattung_manual_badezimmer
                  - input_boolean.beschattung_manual_abstellraum
                  - input_boolean.beschattung_manual_garderobe


      ###########################################################################
      # SÜD                                                                  #
      ###########################################################################
      - type: grid
        columns: 2
        cards:

          - type: heading
            heading: Süd-Fassade
            icon: mdi:weather-sunny

          - type: custom:mushroom-cover-card
            entity: cover.livingroom_blinds
            name: Wohnzimmer

          - type: custom:mushroom-cover-card
            entity: cover.terrace_blinds_2
            name: Terrasse

          - type: custom:mushroom-cover-card
            entity: cover.office_shutter
            name: Büro

          - type: custom:mushroom-cover-card
            entity: cover.guest_shutter
            name: Gästezimmer


      ###########################################################################
      # WEST                                                                 #
      ###########################################################################
      - type: grid
        columns: 2
        cards:

          - type: heading
            heading: West-Fassade
            icon: mdi:weather-sunset

          - type: custom:mushroom-cover-card
            entity: cover.kitchen_blinds
            name: Küche

          - type: custom:mushroom-cover-card
            entity: cover.dining_blinds
            name: Esszimmer

          - type: custom:mushroom-cover-card
            entity: cover.wc_eg_blinds
            name: WC EG

          - type: custom:mushroom-cover-card
            entity: cover.wc_og_blinds
            name: WC OG


      ###########################################################################
      # NORD / INNEN                                                        #
      ###########################################################################
      - type: grid
        columns: 2
        cards:

          - type: heading
            heading: Nord-Fassade
            icon: mdi:weather-hazy

          - type: custom:mushroom-cover-card
            entity: cover.wardrobe_blinds
            name: Garderobe

          - type: custom:mushroom-cover-card
            entity: cover.shelf_blinds
            name: Abstellraum

          - type: custom:mushroom-cover-card
            entity: cover.bathroom_blinds
            name: Badezimmer

          - type: custom:mushroom-cover-card
            entity: cover.bedroom_shutter
            name: Schlafzimmer


      ###########################################################################
      # SCHNELL-AKTIONEN                                                     #
      ###########################################################################
      - type: grid
        columns: 1
        cards:

          - type: heading
            heading: Schnell-Aktionen
            icon: mdi:gesture-tap-button

          - type: grid
            columns: 2
            square: false
            cards:

              - type: custom:mushroom-template-card
                primary: Mittagshitze
                icon: mdi:weather-sunny-alert
                icon_color: red
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_tilt_position
                  data:
                    tilt_position: 0
                  target:
                    entity_id:
                      - cover.livingroom_blinds
                      - cover.terrace_blinds_2
                      - cover.kitchen_blinds
                      - cover.dining_blinds

              - type: custom:mushroom-template-card
                primary: Blendschutz
                icon: mdi:blinds-horizontal
                icon_color: amber
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_tilt_position
                  data:
                    tilt_position: 50
                  target:
                    entity_id:
                      - cover.livingroom_blinds
                      - cover.kitchen_blinds
                      - cover.dining_blinds

              - type: custom:mushroom-template-card
                primary: Alles auf
                icon: mdi:arrow-up-bold-box
                icon_color: green
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_position
                  data:
                    position: 100
                  target:
                    entity_id:
                      - cover.livingroom_blinds
                      - cover.kitchen_blinds
                      - cover.dining_blinds
                      - cover.bedroom_shutter

              - type: custom:mushroom-template-card
                primary: Alles zu
                icon: mdi:arrow-down-bold-box
                icon_color: indigo
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_position
                  data:
                    position: 0
                  target:
                    entity_id:
                      - cover.livingroom_blinds
                      - cover.kitchen_blinds
                      - cover.dining_blinds
                      - cover.bedroom_shutter