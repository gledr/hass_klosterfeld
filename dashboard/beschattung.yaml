                  {% elif is_state('binary_sensor.sonne_trifft_sued', 'on') %}orange
                  {% else %}disabled{% endif %}
                tap_action:
                  action: more-info
              - type: custom:mushroom-chips-card
                alignment: end
                chips:
                  - type: template
                    entity: input_boolean.beschattung_lock_terrasse
                    icon: >
                      {% if is_state(entity, 'on') %}mdi:lock{% else %}mdi:lock-open-variant{% endif %}
                    icon_color: "{% if is_state(entity, 'on') %}red{% else %}disabled{% endif %}"
                    tap_action:
                      action: toggle
                  - type: template
                    entity: input_boolean.beschattung_manual_terrasse
                    icon: mdi:gesture-tap
                    icon_color: "{% if is_state(entity, 'on') %}amber{% else %}disabled{% endif %}"
