###############################################################################
# BESCHATTUNG                                                                  #
#                                                                              #
# Aufbau: eine Zeile pro Raum. Links Zustand (Behang + Lamelle + Grund, warum  #
# die Automation ggf. nicht anfasst), rechts die zwei Override-Schalter         #
# (Sperre = du, Hand = automatisch erkannt). Antippen der linken Karte öffnet   #
# den Cover-Dialog mit den vollen Schiebern.                                   #
#                                                                              #
# WICHTIG — Sections nehmen `column_span`, NICHT `columns`. Mit `columns` wird  #
# der Schlüssel still ignoriert und jede Section rendert auf 1 von 4 Spalten    #
# (das war der Grund, warum diese Seite als schmaler Streifen erschien).       #
###############################################################################
title: Beschattung
views:
  - title: Übersicht
    path: home
    icon: mdi:blinds-horizontal
    type: sections
    max_columns: 4

    # Die drei Zahlen, die man beim Draufschauen braucht — ohne Scrollen.
    badges:
      - type: entity
        entity: sensor.outdoor_temperature_avg
        name: Außen Ø
      - type: entity
        entity: sensor.wind_speed
        name: Wind
      - type: entity
        entity: sensor.beschattung_blocker
        name: Blockiert

    sections:

      ###########################################################################
      # STATUS — Tag/Nacht + was gerade blockiert                               #
      ###########################################################################
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Status
            icon: mdi:information-outline

          - type: custom:mushroom-template-card
            primary: >
              {% if is_state('switch.twilight', 'on') %}Tag{% else %}Nacht{% endif %}
            secondary: >
              {% set t = states.switch.twilight.last_changed %}
              {% set delay = states('input_number.beschattung_nacht_verzoegerung') | float(30) %}
              {% set stamp = states('input_datetime.beschattung_daemmerung_ende') | as_datetime | as_local %}
              {% set close = (stamp if stamp else t) + timedelta(minutes=delay) %}
              {% if is_state('switch.twilight', 'on') %}
                Tag seit {{ t.strftime('%H:%M') }}
              {% elif now() < close %}
                Schließt um {{ close.strftime('%H:%M') }}
              {% else %}
                Geschlossen seit {{ close.strftime('%H:%M') }}
              {% endif %}
            icon: >
              {% if is_state('switch.twilight', 'on') %}mdi:weather-sunny-up{% else %}mdi:weather-night{% endif %}
            icon_color: >
              {% if is_state('switch.twilight', 'on') %}amber{% else %}indigo{% endif %}
            fill_container: true

          # Nur sichtbar, wenn tatsächlich etwas blockiert. Vorher standen hier
          # 24 Dauer-"off"-Kacheln, die zwei Drittel der Seite gefressen haben.
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.beschattung_blocker
                above: 0
            card:
              type: custom:mushroom-template-card
              primary: >
                {{ states('sensor.beschattung_blocker') }} Beschattung(en) blockiert
              secondary: "{{ state_attr('sensor.beschattung_blocker', 'namen') }}"
              icon: mdi:hand-back-right-off
              icon_color: amber
              multiline_secondary: true

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.windalarm_schwelle_1
                state: "on"
            card:
              type: custom:mushroom-template-card
              primary: Windalarm aktiv
              secondary: Alle Beschattungs-Automationen blockiert
              icon: mdi:shield-alert
              icon_color: red

          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.beschattung_messfahrt_running
                state: "on"
            card:
              type: custom:mushroom-template-card
              primary: Messfahrt läuft
              secondary: Automation greift bis zum Ende nicht ein
              icon: mdi:cog-refresh
              icon_color: orange

      ###########################################################################
      # RÄUME — eine Zeile pro Raum, nach Fassade gruppiert                     #
      #                                                                         #
      # Zeilen-Aufbau:                                                          #
      #   [ Raum + Behang/Lamelle + Blockier-Grund ]  [ 🔒 Sperre ] [ ✋ Hand ]  #
      # Tippen links  → Cover-Dialog (Position + Lamellen-Schieber)             #
      # Tippen rechts → Override direkt umschalten                             #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Räume
            icon: mdi:home-floor-1

          # ---------------------------------------------------------------- SÜD
          - type: heading
            heading: Süd
            heading_style: subtitle
            icon: mdi:weather-sunny

          # Wohnzimmer -----------------------------------------------------
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                entity: cover.livingroom_blinds
                primary: Wohnzimmer
                secondary: >
                  {% set c = 'cover.livingroom_blinds' %}
                  Behang {{ state_attr(c, 'current_position') | int(0) }} % ·
                  Lamelle {{ state_attr(c, 'current_tilt_position') | int(0) }} %
                  {%- if is_state('input_boolean.beschattung_lock_wohnzimmer', 'on') %} · gesperrt
                  {%- elif is_state('input_boolean.beschattung_manual_wohnzimmer', 'on') %} · Hand
                  {%- endif %}
                icon: mdi:blinds-horizontal
                icon_color: >
                  {% if is_state('input_boolean.beschattung_lock_wohnzimmer', 'on') %}red
                  {% elif is_state('input_boolean.beschattung_manual_wohnzimmer', 'on') %}amber
                  {% elif is_state('binary_sensor.sonne_trifft_sued', 'on') %}orange
                  {% else %}disabled{% endif %}
                tap_action:
                  action: more-info
              - type: custom:mushroom-chips-card
                alignment: end
                chips:
                  - type: template
                    entity: input_boolean.beschattung_lock_wohnzimmer
                    icon: >
                      {% if is_state(entity, 'on') %}mdi:lock{% else %}mdi:lock-open-variant{% endif %}
                    icon_color: "{% if is_state(entity, 'on') %}red{% else %}disabled{% endif %}"
                    tap_action:
                      action: toggle
                  - type: template
                    entity: input_boolean.beschattung_manual_wohnzimmer
                    icon: mdi:gesture-tap
                    icon_color: "{% if is_state(entity, 'on') %}amber{% else %}disabled{% endif %}"
                    tap_action:
                      action: toggle

          # Terrasse -------------------------------------------------------
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                entity: cover.terrace_blinds_2
                primary: Terrasse
                secondary: >
                  {% set c = 'cover.terrace_blinds_2' %}
                  Behang {{ state_attr(c, 'current_position') | int(0) }} % ·
                  Lamelle {{ state_attr(c, 'current_tilt_position') | int(0) }} %
                  {%- if is_state('input_boolean.beschattung_lock_terrasse', 'on') %} · gesperrt
                  {%- elif is_state('binary_sensor.bthome_sensor_fb9c_fenster', 'on') %} · Tür offen
                  {%- elif is_state('timer.terrassentuer_aussperrschutz', 'active') %} · Aussperr-Schutz
                  {%- elif is_state('input_boolean.beschattung_manual_terrasse', 'on') %} · Hand (2 h)
                  {%- elif state_attr(c, 'current_position') | int(0) >= 100 %} · ganz offen, bleibt so
                  {%- endif %}
                icon: mdi:umbrella-beach
                icon_color: >
                  {% if is_state('input_boolean.beschattung_lock_terrasse', 'on') %}red
                  {% elif is_state('binary_sensor.bthome_sensor_fb9c_fenster', 'on')
                       or is_state('timer.terrassentuer_aussperrschutz', 'active') %}purple
