                  Behang {{ state_attr(c, 'current_position') | int(0) }} % ·
                  Lamelle {{ state_attr(c, 'current_tilt_position') | int(0) }} %
                  {%- if is_state('input_boolean.beschattung_lock_abstellraum', 'on') %} · gesperrt
                  {%- elif is_state('input_boolean.beschattung_manual_abstellraum', 'on') %} · Hand
                  {%- endif %}
                icon: mdi:blinds-horizontal
                icon_color: >
                  {% if is_state('input_boolean.beschattung_lock_abstellraum', 'on') %}red
                  {% elif is_state('input_boolean.beschattung_manual_abstellraum', 'on') %}amber
                  {% elif is_state('binary_sensor.sonne_trifft_nord', 'on') %}orange
                  {% else %}disabled{% endif %}
                tap_action:
                  action: more-info
              - type: custom:mushroom-chips-card
                alignment: end
                chips:
                  - type: template
                    entity: input_boolean.beschattung_lock_abstellraum
                    icon: >
                      {% if is_state(entity, 'on') %}mdi:lock{% else %}mdi:lock-open-variant{% endif %}
                    icon_color: "{% if is_state(entity, 'on') %}red{% else %}disabled{% endif %}"
                    tap_action:
                      action: toggle
                  - type: template
                    entity: input_boolean.beschattung_manual_abstellraum
                    icon: mdi:gesture-tap
                    icon_color: "{% if is_state(entity, 'on') %}amber{% else %}disabled{% endif %}"
                    tap_action:
                      action: toggle

          # Sammel-Aktionen für die Override-Spalten ----------------------
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Alle sperren
                secondary: Urlaub / Ausschlafen
                icon: mdi:lock
                icon_color: red
                layout: vertical
                tap_action:
                  action: call-service
                  service: input_boolean.turn_on
                  target:
                    entity_id:
                      - input_boolean.beschattung_lock_schlafzimmer
                      - input_boolean.beschattung_lock_gaestezimmer
                      - input_boolean.beschattung_lock_buero
                      - input_boolean.beschattung_lock_wohnzimmer
                      - input_boolean.beschattung_lock_terrasse
                      - input_boolean.beschattung_lock_kueche
                      - input_boolean.beschattung_lock_esszimmer
                      - input_boolean.beschattung_lock_wc_eg
                      - input_boolean.beschattung_lock_wc_og
                      - input_boolean.beschattung_lock_badezimmer
                      - input_boolean.beschattung_lock_abstellraum
                      - input_boolean.beschattung_lock_garderobe
              - type: custom:mushroom-template-card
                primary: Alles freigeben
                secondary: Sperren + Hand
                icon: mdi:lock-open-variant
                icon_color: green
                layout: vertical
                tap_action:
                  action: call-service
                  service: input_boolean.turn_off
                  target:
                    entity_id:
                      - input_boolean.beschattung_lock_schlafzimmer
                      - input_boolean.beschattung_lock_gaestezimmer
                      - input_boolean.beschattung_lock_buero
                      - input_boolean.beschattung_lock_wohnzimmer
                      - input_boolean.beschattung_lock_terrasse
                      - input_boolean.beschattung_lock_kueche
                      - input_boolean.beschattung_lock_esszimmer
                      - input_boolean.beschattung_lock_wc_eg
                      - input_boolean.beschattung_lock_wc_og
                      - input_boolean.beschattung_lock_badezimmer
                      - input_boolean.beschattung_lock_abstellraum
                      - input_boolean.beschattung_lock_garderobe
                      - input_boolean.beschattung_manual_schlafzimmer
                      - input_boolean.beschattung_manual_gaestezimmer
                      - input_boolean.beschattung_manual_buero
                      - input_boolean.beschattung_manual_wohnzimmer
                      - input_boolean.beschattung_manual_terrasse
                      - input_boolean.beschattung_manual_kueche
                      - input_boolean.beschattung_manual_esszimmer
                      - input_boolean.beschattung_manual_wc_eg
                      - input_boolean.beschattung_manual_wc_og
                      - input_boolean.beschattung_manual_badezimmer
                      - input_boolean.beschattung_manual_abstellraum
                      - input_boolean.beschattung_manual_garderobe

          - type: markdown
            content: >
              🔒 **Sperre** — du hast pausiert, hält bis Mitternacht.
              ✋ **Hand** — automatisch erkannt, weil die Beschattung ohne
              Auftrag gefahren ist; läuft nach 1 h ab (Terrasse 2 h) oder beim
              nächsten Tag/Nacht-Wechsel. Beide grau = Automation arbeitet.

      ###########################################################################
      # AUSSENBEDINGUNGEN                                                       #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Außenbedingungen
            icon: mdi:weather-sunny

          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:compass-outline
                content: "{{ state_attr('sun.sun', 'azimuth') | round(0) }}° Azimut"
                icon_color: >
                  {% set az = state_attr('sun.sun', 'azimuth') | float(0) %}
                  {% if 135 <= az < 225 %}amber
                  {% elif 225 <= az < 315 %}orange
                  {% elif az >= 315 or az < 45 %}blue
                  {% else %}grey{% endif %}
              - type: template
                icon: mdi:angle-acute
                content: "{{ state_attr('sun.sun', 'elevation') | round(0) }}° Höhe"
              - type: entity
                entity: sensor.outdoor_temperature
                name: Jetzt
              - type: entity
                entity: sun.sun
                name: Sonne

          # Welche Fassade wird gerade getroffen — mit den Schwellen, die
          # dafür gelten (Winkel + Lux + Ø-Temperatur > 15 °C).
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Süd
                secondary: >
                  {% if is_state('binary_sensor.sonne_trifft_sued', 'on') %}Aktiv
                  {% else %}{{ states('sensor.helligkeit_sud') | int(0) }} /
                  {{ states('input_number.beschattung_lux_sud') | int(0) }} lx{% endif %}
                icon: mdi:weather-sunny
                icon_color: >
                  {% if is_state('binary_sensor.sonne_trifft_sued', 'on') %}orange{% else %}disabled{% endif %}
                layout: vertical
              - type: custom:mushroom-template-card
                primary: West
                secondary: >
                  {% if is_state('binary_sensor.sonne_trifft_west', 'on') %}Aktiv
                  {% else %}{{ states('sensor.helligkeit_west') | int(0) }} /
                  {{ states('input_number.beschattung_lux_west') | int(0) }} lx{% endif %}
                icon: mdi:weather-sunset
                icon_color: >
                  {% if is_state('binary_sensor.sonne_trifft_west', 'on') %}orange{% else %}disabled{% endif %}
                layout: vertical
              - type: custom:mushroom-template-card
                primary: Nord
                secondary: >
                  {% if is_state('binary_sensor.sonne_trifft_nord', 'on') %}Aktiv
                  {% else %}{{ states('sensor.helligkeit_nord') | int(0) }} /
                  {{ states('input_number.beschattung_lux_nord') | int(0) }} lx{% endif %}
                icon: mdi:weather-hazy
                icon_color: >
                  {% if is_state('binary_sensor.sonne_trifft_nord', 'on') %}orange{% else %}disabled{% endif %}
                layout: vertical

          # Ein Diagramm mit allen drei Himmelsrichtungen statt drei
          # gequetschten Einzel-Charts.
          - type: custom:mini-graph-card
            name: Helligkeit 12 h
            entities:
              - entity: sensor.helligkeit_sud
                name: Süd
                color: '#f59e0b'
              - entity: sensor.helligkeit_west
                name: West
                color: '#ef4444'
              - entity: sensor.helligkeit_nord
                name: Nord
                color: '#0ea5e9'
            hours_to_show: 12
            points_per_hour: 4
            line_width: 2
            show:
              labels: true
              extrema: true

      ###########################################################################
      # SCHNELL-AKTIONEN                                                        #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Schnell-Aktionen
            icon: mdi:gesture-tap-button

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Mittagshitze
                secondary: Lamellen zu (Süd + West)
                icon: mdi:weather-sunny-alert
                icon_color: red
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_tilt_position
                  data:
                    tilt_position: 0
                  target:
                    entity_id:
                      - cover.livingroom_blinds
                      - cover.terrace_blinds_2
                      - cover.kitchen_blinds
                      - cover.dining_blinds

              - type: custom:mushroom-template-card
                primary: Blendschutz
                secondary: Lamellen halb
                icon: mdi:blinds-horizontal
                icon_color: amber
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_tilt_position
                  data:
                    tilt_position: 50
                  target:
                    entity_id:
                      - cover.livingroom_blinds
                      - cover.kitchen_blinds
                      - cover.dining_blinds

              - type: custom:mushroom-template-card
                primary: Lamellen auf
                secondary: alle Raffstore
                icon: mdi:blinds-horizontal
                icon_color: green
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_tilt_position
                  data:
                    tilt_position: 100
                  target:
                    entity_id:
                      - cover.livingroom_blinds
                      - cover.terrace_blinds_2
                      - cover.kitchen_blinds
                      - cover.dining_blinds
                      - cover.wc_eg_blinds
                      - cover.wc_og_blinds
                      - cover.bathroom_blinds
                      - cover.wardrobe_blinds
                      - cover.shelf_blinds

              - type: custom:mushroom-template-card
                primary: Messfahrt
                secondary: alle Raffstore kalibrieren
                icon: mdi:cog-refresh
                icon_color: orange
                layout: vertical
                tap_action:
                  action: call-service
                  service: script.messfahrt_alle
                  confirmation:
                    text: Messfahrt für alle Raffstore starten? Sie fahren komplett auf und zu.

          - type: markdown
            content: >
              Diese Knöpfe fahren die Beschattung direkt — die Automation
              erkennt das als Hand-Bedienung und lässt die betroffenen Räume
              danach **1 Stunde** in Ruhe (Terrasse 2 h). Wenn das nicht
              gewollt ist, danach oben „Alles freigeben" tippen.

      ###########################################################################
      # EINSTELLUNGEN                                                           #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Einstellungen
            icon: mdi:tune

          - type: entities
            title: Lux-Schwellen (Hitzeschutz-Trigger)
            entities:
              - entity: input_number.beschattung_lux_sud
                name: Süd
              - entity: input_number.beschattung_lux_west
                name: West
              - entity: input_number.beschattung_lux_nord
                name: Nord

          - type: entities
            title: Nacht-Verzögerung
            entities:
              - entity: input_number.beschattung_nacht_verzoegerung
                name: Schließen nach Dämmerung

          - type: markdown
            content: >
              **Lux-Schwellen** greifen nur zusammen mit Ø-Außentemperatur
              > 15 °C und Sonnenstand über 10° — Helligkeit allein löst nichts
              aus (sonst reicht diffuser Nebel).

              **Nacht-Verzögerung**: Wartezeit nach Dämmerungs-Ende, bis alles
              zufährt. 0 = sofort mit der Flanke. Aufgefahren wird unabhängig
              davon immer sofort bei Tagesbeginn.

          - type: entities
            title: Diagnose
            entities:
              - entity: switch.twilight
                name: Tag/Nacht (KNX 8/4/0)
              - entity: input_datetime.beschattung_daemmerung_ende
                name: Letztes Dämmerungs-Ende
              - entity: input_datetime.beschattung_letzter_auto_befehl
                name: Letzter Auto-Befehl
              - entity: input_boolean.beschattung_messfahrt_running
                name: Messfahrt läuft
              - entity: binary_sensor.windalarm_schwelle_1
                name: Windalarm Schwelle 1

      ###########################################################################
      # STANDARD-MODUS PRO RAUM                                                #
      ###########################################################################
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Standard-Modus
            icon: mdi:tune

          - type: custom:mushroom-select-card
            entity: input_select.beschattung_default_garderobe
            name: Garderobe
          - type: custom:mushroom-select-card
            entity: input_select.beschattung_default_abstellraum
            name: Abstellraum
          - type: custom:mushroom-select-card
            entity: input_select.beschattung_default_wc_eg
            name: WC EG
          - type: custom:mushroom-select-card
            entity: input_select.beschattung_default_kueche
            name: Küche
          - type: custom:mushroom-select-card
            entity: input_select.beschattung_default_esszimmer
            name: Esszimmer
          - type: custom:mushroom-select-card
            entity: input_select.beschattung_default_wohnzimmer
            name: Wohnzimmer
          - type: custom:mushroom-select-card
            entity: input_select.beschattung_default_terrasse
            name: Terrasse
          - type: custom:mushroom-select-card
            entity: input_select.beschattung_default_wc_og
            name: WC OG
          - type: custom:mushroom-select-card
            entity: input_select.beschattung_default_badezimmer
            name: Badezimmer
          - type: custom:mushroom-select-card
            entity: input_select.beschattung_default_gaestezimmer
            name: Gästezimmer
          - type: custom:mushroom-select-card
            entity: input_select.beschattung_default_buero
            name: Büro
          - type: custom:mushroom-select-card
            entity: input_select.beschattung_default_schlafzimmer
            name: Schlafzimmer

          - type: markdown
            content: >
              **Automatisch (Präsenz)**: Standard-Verhalten — Raffstore fährt
              bei Anwesenheit hoch, nach Verlassen (15 Min) wieder runter.
              Andere Regeln (Hitzeschutz, Nacht) haben immer Vorrang.

              **Offen / Zu / Lamellen halb**: Überschreibt den Standard in
              Tag-Modus. Hitzeschutz und Nacht greifen weiterhin.
