###############################################################################
# SICHERHEIT — combined Rauchmelder + Fenster + Türen                          #
# auto-entities render filtered lists, so "alles ruhig" collapses to nothing.  #
#                                                                              #
# Die Zählung offener Öffnungen kommt aus sensor.offene_oeffnungen             #
# (template.yaml) — vorher zählte jede Seite selbst per Regex über alle        #
# binary_sensor und beide zählten falsch.                                     #
###############################################################################
title: Sicherheit
views:
  - title: Übersicht
    path: home
    icon: mdi:shield-home
    type: sections
    max_columns: 4

    badges:
      - type: entity
        entity: sensor.offene_oeffnungen
        name: Offen
      - type: entity
        entity: sensor.wind_speed
        name: Wind

    sections:

      ###########################################################################
      # GESAMTSTATUS                                                            #
      ###########################################################################
      - type: grid
        column_span: 4
        cards:
          - type: custom:mushroom-template-card
            primary: >
              {% set smoke = expand(states.binary_sensor) | selectattr('attributes.device_class','eq','smoke') | selectattr('state','eq','on') | list | count %}
              {% set offen = states('sensor.offene_oeffnungen') | int(0) %}
              {% if smoke > 0 %}🚨 RAUCHALARM ({{ smoke }})
              {% elif offen > 0 %}🪟 {{ offen }} offen
              {% else %}✅ Alles ruhig
              {% endif %}
            # Kein now() mehr: das war die Render-Zeit und sah immer frisch aus,
            # auch wenn ein Kontakt seit Stunden nichts mehr gemeldet hatte.
            # Jetzt: was offen ist, bzw. wie alt die älteste Sensor-Meldung ist.
            secondary: >
              {% set namen = state_attr('sensor.offene_oeffnungen', 'namen') %}
              {% set off = state_attr('sensor.offene_oeffnungen', 'offline') | int(0) %}
              {% if namen %}{{ namen }}
              {% else %}
                {% set ts = state_attr('sensor.offene_oeffnungen', 'aeltester_kontakt') %}
                {% if ts %}Alle Kontakte geschlossen · ältestes Lebenszeichen
                  {{ (ts | as_datetime | as_local).strftime('%d.%m. %H:%M') }}
                {% else %}Alle Kontakte geschlossen
                {% endif %}
              {% endif %}
              {%- if off > 0 %} · ⚠️ {{ off }} Kontakt(e) offline{% endif %}
            icon: >
              {% set smoke = expand(states.binary_sensor) | selectattr('attributes.device_class','eq','smoke') | selectattr('state','eq','on') | list | count %}
              {% if smoke > 0 %}mdi:fire-alert
              {% else %}mdi:shield-check
              {% endif %}
            icon_color: >
              {% set smoke = expand(states.binary_sensor) | selectattr('attributes.device_class','eq','smoke') | selectattr('state','eq','on') | list | count %}
              {% if smoke > 0 %}red
              {% elif states('sensor.offene_oeffnungen') | int(0) > 0 %}amber
              {% else %}green{% endif %}
            multiline_secondary: true
            fill_container: true

      ###########################################################################
      # RAUCHMELDER                                                             #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Rauchmelder
            icon: mdi:smoke-detector

          # Ausgelöste zuerst (rot hervorgehoben)
          - type: custom:auto-entities
            card:
              type: entities
              title: ⚠️ Ausgelöst
              state_color: true
            filter:
              include:
                - domain: binary_sensor
                  attributes:
                    device_class: smoke
                  state: "on"
            show_empty: false

          # Alle (statisch mit Override-Namen — Inferenz aus alter Rauchmelder-Dashboard)
          # ACHTUNG: die Zuordnung hängt an der Shelly-MAC im entity_id. Wird ein
          # Melder getauscht, zeigt die Zeile still den falschen Raum. Die
          # Catch-all-Karte darunter fängt Melder auf, die hier fehlen.
          - type: entities
            title: Alle (Status)
            state_color: true
            entities:
              - entity: binary_sensor.shellyplussmoke_2cbcbbf67960_smoke
                name: Wohnzimmer
              - entity: binary_sensor.shellyplussmoke_2cbcbbf73fc0_smoke
                name: Garderobe
              - entity: binary_sensor.shellyplussmoke_2cbcbbf6852c_smoke
                name: "Galerie"
              - entity: binary_sensor.shellyplussmoke_2cbcbbf68278_smoke
                name: "Gästezimmer"
              - entity: binary_sensor.shellyplussmoke_2cbcbbf68028_smoke
                name: "Schlafzimmer"
              - entity: binary_sensor.shellyplussmoke_2cbcbbf59758_smoke
                name: "Büro"
              - entity: binary_sensor.rauchmelder_hobbyraum_smoke
                name: Keller Hobbyraum
              - entity: binary_sensor.rauchmelder_kg_eg_smoke
                name: Stiege Keller/EG
              - entity: binary_sensor.rauchmelder_lager_smoke
                name: Keller Lager
              - entity: binary_sensor.shellyplussmoke_2cbcbbf70698_smoke
                name: "Technikraum"

          # Fängt Melder, die in der Liste oben fehlen (Neugerät, Tausch,
          # geänderte entity_id). Ist nichts unbekannt, rendert die Karte nicht.
          - type: custom:auto-entities
            card:
              type: entities
              title: ⚠️ Nicht zugeordnete Rauchmelder
              state_color: true
            filter:
              include:
                - domain: binary_sensor
                  attributes:
                    device_class: smoke
              exclude:
                - entity_id: binary_sensor.shellyplussmoke_2cbcbbf67960_smoke
                - entity_id: binary_sensor.shellyplussmoke_2cbcbbf73fc0_smoke
                - entity_id: binary_sensor.shellyplussmoke_2cbcbbf6852c_smoke
                - entity_id: binary_sensor.shellyplussmoke_2cbcbbf68278_smoke
                - entity_id: binary_sensor.shellyplussmoke_2cbcbbf68028_smoke
                - entity_id: binary_sensor.shellyplussmoke_2cbcbbf59758_smoke
                - entity_id: binary_sensor.shellyplussmoke_2cbcbbf70698_smoke
                - entity_id: binary_sensor.rauchmelder_hobbyraum_smoke
                - entity_id: binary_sensor.rauchmelder_kg_eg_smoke
                - entity_id: binary_sensor.rauchmelder_lager_smoke
            show_empty: false

      ###########################################################################
      # FENSTER & TÜREN                                                         #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Fenster & Türen
            icon: mdi:window-open-variant

          # Alle Fenster & Türen in einer Liste — offen erscheint rot,
          # kein Doppel-Eintrag, Terrassentür inklusive.
          - type: entities
            title: Fenster & Türen (Status)
            state_color: true
            entities:
              - entity: binary_sensor.shelly_blu_door_window_a173_window
                name: Büro
              - entity: binary_sensor.shelly_blu_door_window_bb57_window
                name: Gästezimmer
              - entity: binary_sensor.fenster_schlafzimmer_window
                name: Schlafzimmer
              - entity: binary_sensor.bthome_sensor_fb9c_fenster
                name: Terrassentür
              - entity: lock.haustur
                name: Haustür

          # Garagentor
          - type: entities
            title: Garage-Tor
            state_color: true
            entities:
              - entity: cover.garage_door_garage_door
                name: Garagentor
              - entity: sensor.garage_door_garage_door_status
                name: Status
              - entity: sensor.garage_door_garage_door_position
                name: Position
          - type: entities
            title: Garage-Seitentür
            state_color: true
            entities:
              - entity: lock.garagen_seitentur
                name: Seitentür
              - entity: sensor.garagen_seitentur_battery
                name: Battery


      ###########################################################################
      # WIND & WETTER WARNUNGEN                                                 #
      ###########################################################################
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Wetterwarnungen
            icon: mdi:weather-windy

          - type: grid
            columns: 1
            cards:
              - type: custom:mushroom-template-card
                primary: Wind
                secondary: "{{ states('sensor.wind_speed') }} m/s"
                icon: mdi:weather-windy
                icon_color: >
                  {% set v = states('sensor.wind_speed') | float(0) %}
                  {% if v > 15 %}red{% elif v > 8 %}amber{% else %}green{% endif %}
              - type: custom:mushroom-template-card
                primary: Windalarm Schwelle 1
                secondary: >
                  {% if is_state('binary_sensor.windalarm_schwelle_1','on') %}AKTIV — Beschattung blockiert{% else %}Inaktiv{% endif %}
                icon: mdi:shield
                icon_color: >
                  {% if is_state('binary_sensor.windalarm_schwelle_1','on') %}red{% else %}green{% endif %}
              - type: custom:mushroom-template-card
                primary: Windalarm Schwelle 2
                secondary: >
                  {% if is_state('binary_sensor.windalarm_schwelle_2','on') %}AKTIV{% else %}Inaktiv{% endif %}
                icon: mdi:shield-alert
                icon_color: >
                  {% if is_state('binary_sensor.windalarm_schwelle_2','on') %}red{% else %}green{% endif %}
