            target:
              entity_id:
                - cover.dining_blinds
            data:
              tilt_position: 50
    mode: single

  # C1: Terrasse Abend – Nachholen um 22:00 wenn noch offen
  - id: beschattung_terrasse_nachholen
    alias: "Beschattung – Terrasse Nachholen 22:00"
    description: >
      Falls Terrasse bei Sunset offen gelassen wurde (warm oder Override),
      um 22:00 immer schließen und Override zurücksetzen.
    trigger:
      - platform: time
        at: "22:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.beschattung_lock_terrasse
        state: "off"
      - condition: or
        conditions:
          - condition: state
            entity_id: cover.terrace_blinds
            state: "open"
          - condition: state
            entity_id: cover.terrace_blinds_2
            state: "open"
    action:
      - service: cover.close_cover
        target:
          entity_id:
            - cover.terrace_blinds
            - cover.terrace_blinds_2
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.beschattung_terrasse_override
    mode: single

  # ========================
  # TERRASSE OVERRIDE
  # ========================

  # Override erkennen: Terrasse manuell geöffnet während Sonne sie geschlossen halten will
  - id: beschattung_terrasse_override_setzen
    alias: "Beschattung – Terrasse Override setzen"
    description: >
      Wenn Terrasse manuell (UI, App, KNX-Taster) geöffnet wird während
      sonne_trifft_sued ON ist, Override setzen. Öffnungen durch andere
      HA-Automationen (z.B. "Süd Sonne Ende") werden ignoriert, indem auf
      context.parent_id geprüft wird – Automationen setzen diese ID, manuelle
      Aktionen nicht. from: closed verhindert Spurious-Trigger durch
      State-Restore beim HA-Restart.
    trigger:
      - platform: state
        entity_id: cover.terrace_blinds
        from: "closed"
        to: "open"
      - platform: state
        entity_id: cover.terrace_blinds_2
        from: "closed"
        to: "open"
    condition:
      - condition: state
        entity_id: binary_sensor.sonne_trifft_sued
        state: "on"
      - condition: template
        value_template: "{{ trigger.to_state.context.parent_id is none }}"
    action:
      - service: input_boolean.turn_on
        target:
