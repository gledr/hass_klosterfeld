                state: 'off'
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.wohnkueche_override_tv
              - service: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.wohnkueche_override_kochen
                    - input_boolean.wohnkueche_override_szene
              - service: script.wohnkueche_wochenende_abend
              - service: knx.send
                data:
                  address: "9/1/6"
                  type: "string"
                  payload: "WE Abend"
          - conditions:
              - condition: state
                entity_id: input_boolean.wohnkueche_override_tv
                state: 'on'
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.wohnkueche_override_tv
              - service: script.wohnkueche_lichtmodus_ausfuehren
              - service: knx.send
                data:
                  address: "9/1/6"
                  type: "string"
                  payload: >-
                    {{ {'fruehstueck':'Fruehstueck','werktag_abend_aktiv':'Abend aktiv','werktag_relax':'Relax','spaetabend':'Spaetabend','nacht':'Nacht','wochenende_tag':'WE Tag','wochenende_nachmittag':'WE Nachmittag','wochenende_abend':'WE Abend'}[states('input_select.wohnkueche_lichtmodus')] | default('?') }}
