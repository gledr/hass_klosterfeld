                state: "off"
            then:
              - service: cover.set_cover_position
                target:
                  entity_id:
                    - cover.dining_blinds
                data:
                  position: 0
              - delay:
                  seconds: 5
              - service: cover.set_cover_tilt_position
                target:
                  entity_id:
                    - cover.dining_blinds
                data:
                  tilt_position: 50
    mode: single

  # B5: West Sonnenschutz Ende (nur wenn Sonne weg UND kühl genug)
  - id: beschattung_west_sonne_aus
    alias: "Beschattung – West Sonnenschutz Ende"
    description: >
      Gruppe B West: Öffnet wenn Sonne Westfassade verlässt (inkl. Bewölkung).
      Küche/Esszimmer: Lamellen auf. Raffstore Küche: ganz hoch.
    trigger:
      - platform: state
        entity_id: binary_sensor.sonne_trifft_west
