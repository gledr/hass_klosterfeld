        to: "off"
      - platform: state
        entity_id: binary_sensor.windalarm_schwelle_2
        from: "off"
        to: "on"
      - platform: state
        entity_id: binary_sensor.windalarm_schwelle_2
        from: "on"
        to: "off"

    condition:
      # verhindert HA-Restart / State-Rehydration Spam
      - condition: template
        value_template: >
          {{ trigger.from_state is not none
             and trigger.to_state is not none
             and trigger.from_state.state not in ['unknown','unavailable']
             and trigger.to_state.state not in ['unknown','unavailable'] }}

    action:
      - service: script.notify_wind_alarm
        data:
          alarm_name: "{{ trigger.to_state.name }}"
          state: >
            {{ 'aktiviert' if trigger.to_state.state == 'on' else 'deaktiviert' }}

    mode: single

  # =========================================================
  # BESCHATTUNGS-AUTOMATIK (refactored 2026-08)
  #
  # Statt 40 fast identischer per-Raum-Automations gibt es jetzt EINE
  # Konvergenz-Automation. Sie läuft bei Bedarf (alle 15 Min + Ereignisse)
  # und gleicht jede Beschattung auf ihren Zielzustand ab. Bewegen tut sie
  # nur, was wirklich anders ist — kein unnötiger KNX-Verkehr.
  #
  # Modus (je Raum):
  #   Tag    Dämmerung an + Sonne trifft Fassade aus  → offen (Raffstore
  #          Lamellen 50, Rollo 100)
  #   Nacht  Dämmerung aus (seit 30 Min)              → zu
  #   Hitze  Dämmerung an + Sonne trifft Fassade an   → Hitzeschutz
  #
  # Sperren (in der Schleife gechecked):
  #   input_boolean.beschattung_lock_<raum>   App-Sperre, täglich reset
  #   input_boolean.beschattung_manual_<raum> manueller Eingriff erkannt
  #   binary_sensor.windalarm_schwelle_1      Wind → keine Bewegung
  #   Fenster offen (Gast/Büro/Schlafzimmer)  → keine Bewegung
  #   Terrasse: Tür offen oder Aussperr-Timer → keine Bewegung
  #   Badezimmer: Privacy-Modus aktiv         → keine Bewegung
  #
  # Manuelle Eingriffe werden erkannt (Automation beschattung_manual_erkennung):
  #   Bewegt sich eine Beschattung, ohne dass die Konvergenz sie gerade
  #   beauftragt hat, gilt das als manuell. Der Raum wird bis zum nächsten
  #   Tag/Nacht-Wechsel nicht mehr angefasst (Nacht schließt trotzdem).
  # =========================================================

  - id: beschattung_konvergenz
    alias: "Beschattung – Konvergenz (Tag/Nacht/Hitzeschutz)"
    description: >
      Einziger Einstiegspunkt für alle automatischen Beschattungen.
      Läuft alle 15 Min + bei Ereignissen (Dämmerung, Sonne, Terrassentür,
      Aussperr-Timer, Messfahrt-Ende) und gleicht jeden Raum auf den
      Zielzustand ab. Nur wenn der Ist-Zustand abweicht, wird gefahren.
      Durch die regelmäßigen Läufe heilt sich der Zustand selbst: auch
      wenn ein Übergang (z.B. Sonnenuntergang) durch die Terrassentür
      blockiert war, zieht der nächste Lauf nach, sobald die Sperre weg ist.
    mode: single
    trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/15"
      # Dämmerung (Morgen/Abend) — klärt auch manuelle Sperren
      - platform: state
        entity_id: binary_sensor.twilight
      # Switch Twilight für manuelles Testen
      - platform: state
        entity_id: switch.twilight
      # Sonne auf Fassade (Hitze-Episoden)
      - platform: state
        entity_id:
          - binary_sensor.sonne_trifft_nord
          - binary_sensor.sonne_trifft_sued
          - binary_sensor.sonne_trifft_west
      # Nach Messfahrt zurück in den normalen Betrieb
      - platform: state
        entity_id: input_boolean.beschattung_messfahrt_running
        to: "off"
      # Aussperr-Schutz-Fenster vorbei → Terrasse wieder zulassen
      - platform: state
        entity_id: timer.terrassentuer_aussperrschutz
        to: "idle"
      # Terrassentür bewegt → Terrasse neu bewerten
      - platform: state
        entity_id: binary_sensor.bthome_sensor_fb9c_fenster
    action:
      # Manuelle Sperren beim Tag/Nacht-Wechsel löschen
      - if:
          - condition: template
            value_template: "{{ trigger.platform == 'state' and trigger.entity_id in ['binary_sensor.twilight', 'switch.twilight'] }}"
        then:
          - service: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.beschattung_manual_garderobe
                - input_boolean.beschattung_manual_abstellraum
                - input_boolean.beschattung_manual_wc_eg
                - input_boolean.beschattung_manual_kueche
                - input_boolean.beschattung_manual_esszimmer
                - input_boolean.beschattung_manual_wohnzimmer
                - input_boolean.beschattung_manual_terrasse
                - input_boolean.beschattung_manual_wc_og
                - input_boolean.beschattung_manual_badezimmer
                - input_boolean.beschattung_manual_gaestezimmer
                - input_boolean.beschattung_manual_buero
                - input_boolean.beschattung_manual_schlafzimmer
      # Während der Messfahrt nicht eingreifen (KNX kalibriert)
      - if:
          - condition: state
            entity_id: input_boolean.beschattung_messfahrt_running
            state: "on"
        then:
          - stop: Messfahrt läuft
      # Start-Lauf: Auto-Befehl einmal stempeln. KNX synct nach dem Neustart
      # alle Positionen neu → die Manual-Erkennung würde sie sonst als
      # Hand-Bedienung flaggen (seit > 180 gilt nur für gefahrene Räume).
      - if:
          - condition: template
            value_template: "{{ trigger.platform == 'homeassistant' }}"
        then:
          - service: input_datetime.set_datetime
            target:
              entity_id: input_datetime.beschattung_letzter_auto_befehl
            data:
              datetime: "{{ now().isoformat() }}"
      - variables:
          rooms:
            # Raffstore: immer unten (Position 0), nur Lamellen ändern sich
            - name: Garderobe
              cover: cover.wardrobe_blinds
              type: raffstore
              dir: nord
              hitze_tilt: 0
              lock: input_boolean.beschattung_lock_garderobe
              manual: input_boolean.beschattung_manual_garderobe
            - name: Abstellraum
              cover: cover.shelf_blinds
              type: raffstore
              dir: nord
              hitze_tilt: 0
              lock: input_boolean.beschattung_lock_abstellraum
              manual: input_boolean.beschattung_manual_abstellraum
            # WC EG: kein Hitzeschutz (Carport)
            - name: WC EG
              cover: cover.wc_eg_blinds
              type: raffstore
              no_hitze: true
              lock: input_boolean.beschattung_lock_wc_eg
              manual: input_boolean.beschattung_manual_wc_eg
            - name: Küche
              cover: cover.kitchen_blinds
              type: raffstore
              dir: west
              hitze_tilt: 10
              lock: input_boolean.beschattung_lock_kueche
              manual: input_boolean.beschattung_manual_kueche
            - name: Esszimmer
              cover: cover.dining_blinds
              type: raffstore
              dir: west
              hitze_tilt: 10
              lock: input_boolean.beschattung_lock_esszimmer
              manual: input_boolean.beschattung_manual_esszimmer
            - name: Wohnzimmer
              cover: cover.livingroom_blinds
              type: raffstore
              dir: sued
              hitze_tilt: 25
              lock: input_boolean.beschattung_lock_wohnzimmer
              manual: input_boolean.beschattung_manual_wohnzimmer
            - name: Terrasse
              cover: cover.terrace_blinds_2
              type: raffstore
              dir: sued
              hitze_tilt: 25
              aussperr: true
              # Manuelle Sperre: 2 h statt 1 h. Solange der Raffstore komplett
              # offen ist (100 %), fährt die Automation nichts (man ist evtl.
              # draußen).
              manual_timeout: 7200
              skip_fully_open: true
              lock: input_boolean.beschattung_lock_terrasse
              manual: input_boolean.beschattung_manual_terrasse
            - name: WC OG
              cover: cover.wc_og_blinds
              type: raffstore
              dir: west
              hitze_tilt: 0
              lock: input_boolean.beschattung_lock_wc_og
              manual: input_boolean.beschattung_manual_wc_og
            - name: Badezimmer
              cover: cover.bathroom_blinds
              type: raffstore
              dir: nord
              hitze_tilt: 0
              privacy: true
              lock: input_boolean.beschattung_lock_badezimmer
              manual: input_boolean.beschattung_manual_badezimmer
            # Rollo: Position ändert sich (100 offen / 0 zu)
            - name: Gast
              cover: cover.guest_shutter
              type: rollo
              dir: sued
              hitze_pos: 10
              fenster: binary_sensor.shelly_blu_door_window_bb57_window
              lock: input_boolean.beschattung_lock_gaestezimmer
              manual: input_boolean.beschattung_manual_gaestezimmer
            # Büro: Hitzeschutz = Blendschutz nach Anwesenheit
            - name: Büro
              cover: cover.office_shutter
              type: rollo
              dir: sued
              blend: true
              fenster: binary_sensor.shelly_blu_door_window_a173_window
              lock: input_boolean.beschattung_lock_buero
              manual: input_boolean.beschattung_manual_buero
            # Schlafzimmer: erst nach Wake-Zeit öffnen (Werktag 7 / WE 10)
            - name: Schlafzimmer
              cover: cover.bedroom_shutter
              type: rollo
              dir: nord
              hitze_pos: 0
              waketime: true
              fenster: binary_sensor.fenster_schlafzimmer_window
              lock: input_boolean.beschattung_lock_schlafzimmer
              manual: input_boolean.beschattung_manual_schlafzimmer
      - repeat:
          for_each: "{{ rooms }}"
          sequence:
            - variables:
                cover: "{{ repeat.item.cover }}"
                room_name: "{{ repeat.item.name }}"
                rtype: "{{ repeat.item.type }}"
                dir: "{{ repeat.item.get('dir') }}"
                cur_pos: "{{ state_attr(cover, 'current_position') }}"
                cur_tilt: "{{ state_attr(cover, 'current_tilt_position') }}"
                locked: "{{ is_state(repeat.item.lock, 'on') }}"
                manual: "{{ is_state(repeat.item.manual, 'on') }}"
                fenster_offen: "{{ repeat.item.get('fenster') is not none and is_state(repeat.item.get('fenster'), 'on') }}"
                wind: "{{ is_state('binary_sensor.windalarm_schwelle_1', 'on') }}"
                twilight_on: "{{ is_state('binary_sensor.twilight', 'on') }}"
                sun: "{{ dir is not none and is_state('binary_sensor.sonne_trifft_' ~ dir, 'on') }}"
                privacy_active: "{{ is_state('input_boolean.badezimmer_privacy_active', 'on') }}"
                tuer_offen: "{{ is_state('binary_sensor.bthome_sensor_fb9c_fenster', 'on') }}"
                timer_aktiv: "{{ is_state('timer.terrassentuer_aussperrschutz', 'active') }}"
            - variables:
                # Zustand nicht lesbar → Raum überspringen (nächster Lauf holt nach)
                lesbar: "{{ cur_pos is not none and (rtype != 'raffstore' or cur_tilt is not none) }}"
                # 30 Min nach Dämmerungs-Ende → Nacht
                nacht: "{{ not twilight_on and (now() - states.binary_sensor.twilight.last_changed).total_seconds() >= 1800 }}"
                # Offenes Fenster blockt nur nachts (lüften) — Hitzeschutz
                # und Tag fahren trotzdem. Terrasse: kein fenster, läuft über aussperr.
                fenster_blockt: "{{ fenster_offen and nacht }}"
                # Sonne auf der Fassade → Hitzeschutz
                hitze: "{{ twilight_on and sun }}"
                # Manuelle Sperre: Standard 1 h (Terrasse 2 h). Terrasse zusätzlich:
                # solange komplett offen, keine Aktion (skip_fully_open).
                # Nachts greift die Sperre nie — die Konvergenz schließt trotzdem.
                manual_block: >-
                  {% set timeout = repeat.item.get('manual_timeout', 3600) %}
                  {% set frisch = (now() - states[repeat.item.manual].last_changed).total_seconds() < timeout %}
                  {% set skip = repeat.item.get('skip_fully_open', false) and cur_pos | int(-1) >= 99 %}
                  {{ manual and not nacht and (frisch or skip) }}
                # Schlafzimmer: erst nach Wake-Zeit öffnen
                tag_erlaubt: >-
                  {% if repeat.item.get('waketime', false) %}
                    {% set workday = is_state('binary_sensor.workday_sensor', 'on') %}
                    {% set h = now().hour %}
                    {{ (workday and h >= 7) or (not workday and h >= 10) }}
                  {% else %}true{% endif %}
                # Gesperrt (auch wenn der Zustand nicht lesbar ist) → skip
                gesperrt: >-
                  {{ not lesbar or locked or wind or fenster_blockt or manual_block
                     or (repeat.item.get('privacy', false) and privacy_active)
                     or (repeat.item.get('aussperr', false) and (tuer_offen or timer_aktiv)) }}
                # Zielmodus ermitteln (Reihenfolge: skip > nacht > hitze > tag)
                mode: >-
                  {% if gesperrt %}skip
                  {% elif nacht %}nacht
                  {% elif hitze and not repeat.item.get('no_hitze', false) %}hitze
                  {% elif tag_erlaubt %}tag
                  {% else %}skip{% endif %}
                target_pos: >-
                  {% if mode == 'skip' %}-1
                  {% elif mode == 'nacht' %}0
                  {% elif mode == 'hitze' %}
                    {% if rtype == 'raffstore' %}0
                    {% elif repeat.item.get('blend', false) %}
                      {% if is_state('binary_sensor.workday_sensor', 'on') and is_state('device_tracker.iphone_von_sebastian', 'home') %}
                        {% if state_attr('sun.sun', 'elevation') | float(0) < 45 and states('sensor.helligkeit_sud') | float(0) > states('input_number.beschattung_lux_sud') | float(0) %}50{% else %}75{% endif %}
                      {% else %}10{% endif %}
                    {% else %}{{ repeat.item.get('hitze_pos', 10) }}{% endif %}
                  {% else %}{{ 0 if rtype == 'raffstore' else 100 }}{% endif %}
                target_tilt: >-
                  {% if mode == 'skip' %}-1
                  {% elif rtype == 'raffstore' %}
                    {% if mode == 'nacht' %}0
                    {% elif mode == 'hitze' %}{{ repeat.item.hitze_tilt }}
                    {% else %}50{% endif %}
                  {% else %}none{% endif %}
            # Nur fahren, wenn der Ist-Zustand wirklich abweicht
            - if:
                - condition: template
                  value_template: >-
                    {% if mode == 'skip' %}false
                    {% elif rtype == 'raffstore' %}
                      {{ cur_tilt | int(-1) != target_tilt | int or cur_pos | int(-1) > 2 }}
                    {% else %}
                      {{ cur_pos | int(-1) != target_pos | int }}
                    {% endif %}
              then:
                # Als Auto-Befehl markieren (für die Manuell-Erkennung)
                - service: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.beschattung_letzter_auto_befehl
                  data:
                    datetime: "{{ now().isoformat() }}"
                # Raffstore: erst Behang unten (falls oben), dann Lamellen.
                # Warten bis unten, sonst unterbricht der Tilt-Befehl die Fahrt.
                - if:
                    - condition: template
                      value_template: "{{ rtype == 'raffstore' and cur_pos | int(-1) > 2 }}"
                  then:
                    - service: cover.set_cover_position
                      target:
                        entity_id: "{{ cover }}"
                      data:
                        position: 0
                    - wait_template: "{{ state_attr(cover, 'current_position') | int(default=0) <= 2 }}"
                      timeout: "00:01:30"
                      continue_on_timeout: true
                - if:
                    - condition: template
                      value_template: "{{ rtype == 'raffstore' }}"
                  then:
                    - service: cover.set_cover_tilt_position
                      target:
                        entity_id: "{{ cover }}"
                      data:
                        tilt_position: "{{ target_tilt }}"
                  else:
                    - service: cover.set_cover_position
                      target:
                        entity_id: "{{ cover }}"
                      data:
                        position: "{{ target_pos }}"
                # Nach dem Eingriff eine evtl. Manuell-Sperre wieder löschen
                - service: input_boolean.turn_off
                  target:
                    entity_id: "{{ repeat.item.manual }}"
                # Push nur beim (Neu-)Eintreten in den Hitzeschutz
                - if:
                    - condition: template
                      value_template: "{{ mode == 'hitze' }}"
                  then:
                    - variables:
                        msg: >-
                          {% if rtype == 'raffstore' %}
                            Lamellen auf {{ target_tilt }} % gefahren (war {{ cur_tilt }} %). Sonne trifft {{ {'nord':'Nord','sued':'Süd','west':'West'}[dir] }}.
                          {% elif repeat.item.get('blend', false) %}
                            Rollo {{ cur_pos }} % → {{ target_pos }} %. Sonne trifft {{ {'nord':'Nord','sued':'Süd','west':'West'}[dir] }}.
                          {% else %}
                            Rollo auf {{ target_pos }} % gefahren (war {{ cur_pos }} %). Sonne trifft {{ {'nord':'Nord','sued':'Süd','west':'West'}[dir] }}.
                          {% endif %}
                    - service: notify.iphone_von_sebastian
                      continue_on_error: true
                      data:
                        title: "{{ room_name }} – Hitzeschutz aktiv"
                        message: "{{ msg }}"

  # ----------------------------------------------------------
  # MANUELLE BEDIENUNG ERKENNEN
  # Bewegt sich eine Beschattung, ohne dass die Konvergenz (oder eine der
  # Privacy-/Messfahrt-Automationen) sie vor <3 Min beauftragt hat, gilt das
  # als manueller Eingriff. Der betroffene Raum wird für 1 Stunde von der
  # Automation verschont (Terrasse: 2 h; bei komplett offenem Raffstore
  # fährt sie gar nichts — siehe manual_block).
  # ----------------------------------------------------------
  - id: beschattung_manual_erkennung
    alias: "Beschattung – Manuelle Bedienung erkennen"
    description: >
      Erkennt manuelle Eingriffe an jeder Beschattung (KNX-Taster, App,
      Hand). Bewegt sich eine Beschattung ohne vorherigen Auto-Befehl,
      wird input_boolean.beschattung_manual_<raum> gesetzt — die Konvergenz
      fasst den Raum dann 1 Stunde lang nicht mehr an (Terrasse: 2 Stunden;
      bei komplett offenem Raffstore keine Aktion, siehe manual_block).
    mode: queued
    trigger:
      # Lamellen (nur Raffstores)
      - platform: state
        entity_id:
          - cover.wardrobe_blinds
          - cover.shelf_blinds
          - cover.wc_eg_blinds
          - cover.kitchen_blinds
          - cover.dining_blinds
          - cover.livingroom_blinds
          - cover.terrace_blinds_2
          - cover.wc_og_blinds
          - cover.bathroom_blinds
        attribute: current_tilt_position
      # Behang / Rollo-Position (alle)
      - platform: state
        entity_id:
          - cover.wardrobe_blinds
          - cover.shelf_blinds
          - cover.wc_eg_blinds
          - cover.kitchen_blinds
          - cover.dining_blinds
          - cover.livingroom_blinds
          - cover.terrace_blinds_2
          - cover.wc_og_blinds
          - cover.bathroom_blinds
          - cover.guest_shutter
          - cover.office_shutter
          - cover.bedroom_shutter
        attribute: current_position
    condition:
      - condition: template
        value_template: >
          {% set last = state_attr('input_datetime.beschattung_letzter_auto_befehl', 'timestamp') %}
          {% set seit = (now().timestamp() - last) if last is not none else 99999 %}
          {{ not is_state('input_boolean.beschattung_messfahrt_running', 'on') and seit > 180 }}
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: >-
            {% set m = {
              'cover.wardrobe_blinds':  'input_boolean.beschattung_manual_garderobe',
              'cover.shelf_blinds':     'input_boolean.beschattung_manual_abstellraum',
              'cover.wc_eg_blinds':     'input_boolean.beschattung_manual_wc_eg',
              'cover.kitchen_blinds':   'input_boolean.beschattung_manual_kueche',
              'cover.dining_blinds':    'input_boolean.beschattung_manual_esszimmer',
              'cover.livingroom_blinds':'input_boolean.beschattung_manual_wohnzimmer',
              'cover.terrace_blinds_2': 'input_boolean.beschattung_manual_terrasse',
              'cover.wc_og_blinds':     'input_boolean.beschattung_manual_wc_og',
              'cover.bathroom_blinds':  'input_boolean.beschattung_manual_badezimmer',
              'cover.guest_shutter':    'input_boolean.beschattung_manual_gaestezimmer',
              'cover.office_shutter':   'input_boolean.beschattung_manual_buero',
              'cover.bedroom_shutter':  'input_boolean.beschattung_manual_schlafzimmer'
            }[trigger.entity_id] %}
            {{ m }}

  # ----------------------------------------------------------
  # MANUELLE SPERREN BEIM TAG/NACHT-WECHSEL LÖSCHEN
  # Sicherheitsnetz: die Konvergenz räumt die Sperren nach 1 h selbst ab
  # (Terrasse 2 h, siehe manual_block). Hier wird beim Dämmerungs-Wechsel
  # aufgeräumt — falls die Konvergenz den Wechsel verpasst (mode: single,
  # längerer Lauf), sind die Sperren spätestens dann weg.
  # ----------------------------------------------------------
  - id: beschattung_manual_reset_tag_nacht
    alias: "Beschattung – Manuelle Sperren beim Tag/Nacht-Wechsel zurücksetzen"
    description: >
      Löscht alle manuell erkannten Sperren bei jedem Wechsel von Tag auf
      Nacht (binary_sensor.twilight). Sicherheitsnetz: falls die Konvergenz den
      Wechsel verpasst, sind die Sperren (Standard 1 h, Terrasse 2 h)
      spätestens dann weg.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.twilight
        to: "on"
      - platform: state
        entity_id: binary_sensor.twilight
        to: "off"
      - platform: state
        entity_id: switch.twilight
        to: "on"
      - platform: state
        entity_id: switch.twilight
        to: "off"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.beschattung_manual_garderobe
            - input_boolean.beschattung_manual_abstellraum
            - input_boolean.beschattung_manual_wc_eg
            - input_boolean.beschattung_manual_kueche
            - input_boolean.beschattung_manual_esszimmer
            - input_boolean.beschattung_manual_wohnzimmer
            - input_boolean.beschattung_manual_terrasse
            - input_boolean.beschattung_manual_wc_og
            - input_boolean.beschattung_manual_badezimmer
            - input_boolean.beschattung_manual_gaestezimmer
            - input_boolean.beschattung_manual_buero
            - input_boolean.beschattung_manual_schlafzimmer

  # ----------------------------------------------------------
  # MANUELLE SPERREN NACH TIMEOUT LÖSCHEN
  # Die Konvergenz blockt einen Raum nur, solange die manuelle Sperre
  # "frisch" ist (Standard 1 h, Terrasse 2 h). Der Schalter selbst blieb
  # aber an, bis der Raum wieder gefahren wurde oder der Tag/Nacht-Wechsel
  # kam — z. B. Schlafzimmer auf Position 100 (Ziel) blieb so dauerhaft
  # "aktiv". Diese Automation räumt abgelaufene Sperren physisch ab.
  # Terrasse: bleibt gesetzt, solange der Raffstore komplett offen ist
  # (skip_fully_open-Schutz — man ist evtl. draußen).
  # ----------------------------------------------------------
  - id: beschattung_manual_ablauf_reset
    alias: "Beschattung – Abgelaufene manuelle Sperren löschen"
    description: >
      Schaltet input_boolean.beschattung_manual_<raum> ab, sobald der
      Timeout abgelaufen ist (Standard 1 h, Terrasse 2 h). Die Terrasse
      bleibt gesetzt, solange der Raffstore komplett offen ist.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/1"
    action:
      - variables:
          expired: >-
            {% set ns = namespace(l=[]) %}
            {% for room in ['garderobe','abstellraum','wc_eg','kueche','esszimmer','wohnzimmer','terrasse','wc_og','badezimmer','gaestezimmer','buero','schlafzimmer'] %}
              {% set ent = 'input_boolean.beschattung_manual_' ~ room %}
              {% set timeout = 7200 if room == 'terrasse' else 3600 %}
              {% if is_state(ent, 'on') and (now() - states[ent].last_changed).total_seconds() >= timeout %}
                {% if room != 'terrasse' or state_attr('cover.terrace_blinds_2', 'current_position') | int(-1) < 99 %}
                  {% set ns.l = ns.l + [ent] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.l }}
      - if:
          - condition: template
            value_template: "{{ expired | length > 0 }}"
        then:
          - service: input_boolean.turn_off
            data:
              entity_id: "{{ expired }}"

  # ----------------------------------------------------------
  # TERRASSENTÜR — Aussperr-Schutz
  # Beim Rausgehen (Wäsche aufhängen) macht man die Tür hinter sich zu, der
  # Türkontakt meldet also "zu" während man draußen steht. Deshalb hält jede
  # Türbewegung (auf UND zu) ein 60-Min-Fenster offen, in dem keine
  # Beschattungs-Automation den Terrassen-Raffstore zufährt.
  #
  # Fix: Der Timer wird höchstens 1× pro Minute neu gestartet. Ein flatternder
  # Türkontakt hält ihn damit nicht mehr endlos am Laufen — und die Terrasse
  # blieb genau deshalb seit Einbau des Türsensors bei Dämmerung hängen.
  # Die Konvergenz-Automation zieht nach, sobald der Timer abgelaufen ist.
  # ----------------------------------------------------------
  - id: terrassentuer_aussperrschutz_start
    alias: "Terrassentür – Aussperr-Schutz starten (60 Min)"
    description: >
      Startet/neustartet den 60-Min-Timer bei jeder Türbewegung (auf UND zu),
      aber höchstens einmal pro Minute. Reale Wege nach draußen (meist
      >1 Min auseinander) verlängern das Fenster wie gewohnt; schnelles
      Flattern des Kontakts blockiert die Terrasse nicht dauerhaft.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.bthome_sensor_fb9c_fenster
        to: "on"
      - platform: state
        entity_id: binary_sensor.bthome_sensor_fb9c_fenster
        to: "off"
    condition:
      - condition: template
        value_template: >
          {% set sec = (now() - states.timer.terrassentuer_aussperrschutz.last_changed).total_seconds() %}
          {{ sec > 60 }}
    action:
      - service: timer.start
        target:
          entity_id: timer.terrassentuer_aussperrschutz
        data:
          duration: "01:00:00"

  - id: terrassentuer_aussperrschutz_stop_fahrt
    alias: "Terrassentür – Öffnung stoppt laufende Raffstore-Fahrt"
    description: >
      Notbremse: wird die Tür geöffnet während der Raffstore gerade fährt, wird
      die Fahrt sofort gestoppt — ABER nur, wenn die Fahrt von der Automation
      stammt (letzter Auto-Befehl < 3 Min). Manuelle Fahrten per KNX-Taster
      (Tür aufmachen während der Raffstore hoch-/runterfährt) werden nicht
      mehr gestoppt. stop_cover auf einen stehenden Raffstore ist ein No-Op,
      deshalb ohne Zustandsprüfung (KNX-State ist unzuverlässig).
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.bthome_sensor_fb9c_fenster
        to: "on"
    condition:
      # Nur Auto-Fahrten stoppen: die Konvergenz stempelt jeden eigenen
      # Befehl in input_datetime.beschattung_letzter_auto_befehl (gleiche
      # Heuristik wie die Manuell-Erkennung, seit > 180 = manuell).
      - condition: template
        value_template: >
          {% set last = state_attr('input_datetime.beschattung_letzter_auto_befehl', 'timestamp') %}
          {% set seit = (now().timestamp() - last) if last is not none else 99999 %}
          {{ seit <= 180 }}
    action:
      - service: cover.stop_cover
        target:
          entity_id: cover.terrace_blinds_2

  # ----------------------------------------------------------
  # Messfahrt 2-wöchentlich (unverändert, zentral)
  # ----------------------------------------------------------
  - id: beschattung_messfahrt_2_wochen
    alias: "Beschattung – Messfahrt 2-wöchentlich (Vormittag, abwesend)"
    description: >
      Alle 2 Wochen am Werktag-Vormittag (08:00) für jeden Raum eine
      Messfahrt, sofern Sebastian nicht zuhause ist und gerade kein
      Hitzeschutz aktiv ist (kein sonne_trifft_*  on). Push-Nachricht
      vor dem Start.
    mode: single
    trigger:
      - platform: time
        at: "08:00:00"
    condition:
      # Werktag
      - condition: state
        entity_id: binary_sensor.workday_sensor
        state: "on"
      # Alle 2 Wochen: nur Montag einer geraden ISO-Kalenderwoche.
      # (Ohne Wochentags-Bindung würde die Messfahrt sonst an JEDEM
      #  Werktag der geraden Woche laufen.)
      - condition: time
        weekday:
          - mon
      - condition: template
        value_template: "{{ (now().isocalendar().week % 2) == 0 }}"
      # Niemand zuhause
      - condition: state
        entity_id: device_tracker.iphone_von_sebastian
        state: "not_home"
      # Kein Hitzeschutz aktiv (auf keiner Fassade)
      - condition: state
        entity_id: binary_sensor.sonne_trifft_nord
        state: "off"
      - condition: state
        entity_id: binary_sensor.sonne_trifft_sued
        state: "off"
      - condition: state
        entity_id: binary_sensor.sonne_trifft_west
        state: "off"
      # Wind-Frei (KNX überstimmt eh, aber sicher ist sicher)
      - condition: state
        entity_id: binary_sensor.windalarm_schwelle_1
        state: "off"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.beschattung_messfahrt_running
      - service: notify.iphone_von_sebastian
        continue_on_error: true
        data:
          title: Beschattung – Messfahrt
          message: "KNX-Messfahrt aller Raffstores/Rollos startet jetzt (~40 s)."
      # Pro Raum Messfahrt (KNX-Switch kurz an)
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_raffstore_garderobe
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_raffstore_abstellraum
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_raffstore_wc_eg
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_raffstore_kuche
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_raffstore_esszimmer
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_raffstore_wohnzimmer
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_raffstore_terrasse
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_raffstore_bad
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_raffstore_wc_og
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_rollo_schlafzimmer
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_rollo_gast
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_rollo_buro
      # Messfahrt-Flag nach 3 Min zurücksetzen — Covers sind dann fertig gefahren.
      # Der Reset triggert die Konvergenz (beschattung_messfahrt_running -> off),
      # sodass alle Beschattungen zurück in den Tag-Modus gehen.
      - delay: "00:03:00"
      # Die Abschluss-Bewegung als Auto-Befehl markieren, damit die
      # Manuell-Erkennung die letzten Kalibrierfahrten nicht ankreidet.
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.beschattung_letzter_auto_befehl
        data:
          datetime: "{{ now().isoformat() }}"
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.beschattung_messfahrt_running

  # ----------------------------------------------------------
  # App-Lock Reset täglich um Mitternacht
  # Alle beschattung_lock_<raum> auf off — die App-Sperre gilt nur für den Tag
  # ----------------------------------------------------------
  - id: beschattung_app_lock_reset_taeglich
    alias: "Beschattung – App-Sperren täglich zurücksetzen (Mitternacht)"
    description: >
      Setzt alle App-Sperren (input_boolean.beschattung_lock_<raum>) jede Nacht
      um 00:00 zurück, damit eine Tag-Sperre nicht ungewollt persistiert.
    mode: single
    trigger:
      - platform: time
        at: "00:00:00"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.beschattung_lock_garderobe
            - input_boolean.beschattung_lock_abstellraum
            - input_boolean.beschattung_lock_wc_eg
            - input_boolean.beschattung_lock_kueche
            - input_boolean.beschattung_lock_esszimmer
            - input_boolean.beschattung_lock_wohnzimmer
            - input_boolean.beschattung_lock_terrasse
            - input_boolean.beschattung_lock_wc_og
            - input_boolean.beschattung_lock_badezimmer
            - input_boolean.beschattung_lock_gaestezimmer
            - input_boolean.beschattung_lock_buero
            - input_boolean.beschattung_lock_schlafzimmer

  # ----------------------------------------------------------
  # Garage – Abendwarnung (21:00)
  # Erinnert, wenn Garagentor oder Garagen-Seitentür um 21:00
  # noch offen sind.
  # ----------------------------------------------------------
  - id: garage_abend_warnung_2100
    alias: "Garage – Abendwarnung (21:00 noch offen)"
    description: >
      Benachrichtigt um 21:00 Uhr, wenn das Garagentor noch offen
      (nicht 'closed') oder die Garagen-Seitentür noch entsperrt ist.
    mode: single
    trigger:
      - platform: time
        at: "21:00:00"
    condition:
      - condition: template
        value_template: >
          {{ not is_state('cover.garage_door_garage_door', 'closed')
             or not is_state('lock.garagen_seitentur', 'locked') }}
    action:
      - service: script.notify_garage_offen
        data:
          message: >
            {% set parts = [] %}
            {% if not is_state('cover.garage_door_garage_door', 'closed') %}
              {% set parts = parts + ['Garagentor'] %}
            {% endif %}
