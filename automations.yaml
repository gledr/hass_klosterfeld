    description: Schaltet das WC-Licht nachts gedimmt ein, wenn der Bewegungsmelder
      in der Galerie auslöst
    triggers:
    - entity_id: binary_sensor.bewegungsmelder_galerie_og
      to: 'on'
      trigger: state
    - entity_id: binary_sensor.bewegungsmelder_galerie_og
      to: 'off'
      trigger: state
    conditions:
    - condition: time
      after: '23:00:00'
      before: 06:00:00
    actions:
    - choose:
      - conditions:
        - condition: state
          entity_id: binary_sensor.bewegungsmelder_galerie_og
          state: 'on'
        sequence:
        - target:
            entity_id: light.wc_og_light
          data:
            brightness_pct: 42
            transition: 1
          action: light.turn_on
      - conditions:
        - condition: state
          entity_id: binary_sensor.bewegungsmelder_galerie_og
          state: 'off'
        sequence:
        - delay: 00:05:00
        - target:
            entity_id: light.wc_og_light
          data:
            transition: 2
          action: light.turn_off
