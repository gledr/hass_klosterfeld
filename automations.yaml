  - id: smart55_szene_anzeige
    alias: Smart 55 – Szene Anzeige
    description: Sendet Modusname an GA 9/1/6 wenn Präsenzmelder angeht, "Aus" wenn er ausgeht
    trigger:
      - platform: state
        entity_id: binary_sensor.praesenzmelder_wohnzimmer
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'on'
            sequence:
              - service: knx.send
                data:
                  address: "9/1/6"
                  type: "string"
                  payload: >-
                    {{ {
                      'fruehstueck':          'Fruehstueck',
                      'werktag_abend_aktiv':  'Abend aktiv',
                      'werktag_relax':        'Relax',
                      'spaetabend':           'Spaetabend',
                      'nacht':                'Nacht',
                      'wochenende_tag':       'WE Tag',
                      'wochenende_nachmittag':'WE Nachmittag',
                      'wochenende_abend':     'WE Abend'
                    }[states('input_select.wohnkueche_lichtmodus')] | default('?') }}
        default:
          - service: knx.send
            data:
              address: "9/1/6"
              type: "string"
              payload: "Aus"
    mode: single

  - id: "knx_luftfeuchtigkeit_7_3_21"
    alias: "Luftfeuchtigkeit auf KNX schreiben"
    description: "Sendet den Wert von sensor.bthome_sensor_5447_humidity auf KNX GA 7/3/21 bei jeder Änderung"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.bthome_sensor_5447_humidity
    action:
      - service: knx.send
        data:
          address: "7/3/21"
          type: "9.007"   # KNX DPT für Luftfeuchtigkeit (%)
          payload: "{{ states('sensor.bthome_sensor_5447_humidity') | float }}"
  - id: badezimmer_raffstore_licht_an_001
    alias: Badezimmer Raffstore schließen bei Licht AN
    trigger:
      - platform: state
        entity_id:
          - light.bathroom_main_light
          - light.bathroom_mirror_light
        to: "on"
    condition:
      - condition: template
        value_template: >
          {{ states('light.bathroom_main_light') == 'off' or
             states('light.bathroom_mirror_light') == 'off' }}
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.raffstore_badezimmer_vorher
        data:
          value: >
            {% set pos = state_attr('cover.bathroom_blinds', 'current_position') %}
            {{ pos | int if pos is not none else 100 }}
      - service: cover.close_cover
        target:
          entity_id: cover.bathroom_blinds
    mode: single

  - id: badezimmer_raffstore_licht_aus_002
    alias: Badezimmer Raffstore zurück bei Licht AUS
    trigger:
      - platform: state
        entity_id:
          - light.bathroom_main_light
          - light.bathroom_mirror_light
        to: "off"
    condition:
      - condition: template
        value_template: >
          {{ states('light.bathroom_main_light') == 'off' and
             states('light.bathroom_mirror_light') == 'off' }}
    action:
      - service: cover.set_cover_position
        target:
          entity_id: cover.bathroom_blinds
        data:
          position: "{{ states('input_number.raffstore_badezimmer_vorher') | int }}"
    mode: single

  - id: windalarm_notification_1
    alias: "Windalarm Notification"
    trigger:
      - platform: state
        entity_id: binary_sensor.windalarm_schwelle_1
        to:
          - "on"
          - "off"
      - platform: state
        entity_id: binary_sensor.windalarm_schwelle_2
        to:
          - "on"
          - "off"
    action:
      - service: script.notify_wind_alarm
        data:
          alarm_name: "{{ trigger.to_state.name }}"
          state: "{{ 'aktiviert' if trigger.to_state.state == 'on' else 'deaktiviert' }}"