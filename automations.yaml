              tilt_position: 0
    mode: single

  # B7: West Hitzeschutz De-Eskalation – Temp fällt unter 26°C während Sonne West trifft
  - id: beschattung_west_deeskalation
    alias: "Beschattung – West Hitzeschutz De-Eskalation"
    description: >
