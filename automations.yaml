  - id: blinds_down_after_sunset
    alias: Raffstore – Alle runter 15 Minuten nach Sonnenuntergang
    triggers:
    - event: sunset
      offset: 00:30:00
      trigger: sun
    actions:
    # Pro Cover gegen Sperre prüfen
    - if:
        - condition: state
          entity_id: input_boolean.beschattung_lock_garderobe
          state: "off"
      then:
        - service: cover.close_cover
          target:
            entity_id: cover.wardrobe_blinds
    - if:
        - condition: state
          entity_id: input_boolean.beschattung_lock_abstellraum
          state: "off"
      then:
        - service: cover.close_cover
          target:
            entity_id: cover.shelf_blinds
    - if:
        - condition: state
          entity_id: input_boolean.beschattung_lock_wc_eg
          state: "off"
      then:
        - service: cover.close_cover
          target:
            entity_id: cover.wc_eg_blinds
    - if:
        - condition: state
          entity_id: input_boolean.beschattung_lock_wc_og
          state: "off"
      then:
        - service: cover.close_cover
          target:
            entity_id: cover.wc_og_blinds
    - if:
        - condition: state
          entity_id: input_boolean.beschattung_lock_wohnzimmer
          state: "off"
      then:
        - service: cover.close_cover
          target:
            entity_id: cover.livingroom_blinds
    - if:
        - condition: state
          entity_id: input_boolean.beschattung_lock_esszimmer
          state: "off"
      then:
        - service: cover.close_cover
          target:
            entity_id: cover.dining_blinds
    - if:
        - condition: state
          entity_id: input_boolean.beschattung_lock_kueche
          state: "off"
      then:
        - service: cover.close_cover
          target:
            entity_id: cover.kitchen_blinds
    - if:
        - condition: state
          entity_id: input_boolean.beschattung_lock_badezimmer
          state: "off"
      then:
        - service: cover.close_cover
          target:
            entity_id: cover.bathroom_blinds
    # Wohnzimmer- und West-Override beim Abendschluss zurücksetzen
    - service: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.beschattung_wohnzimmer_override
          - input_boolean.beschattung_west_override
    # Terrasse separat: nur schließen wenn kalt UND Override OFF UND Sperre OFF
    - if:
        - condition: state
          entity_id: input_boolean.beschattung_lock_terrasse
          state: "off"
        - condition: template
          value_template: >
            {{ states('sensor.outdoor_temperature') | float(0)
               < states('input_number.beschattung_terrasse_abend') | float(18)
               and is_state('input_boolean.beschattung_terrasse_override', 'off') }}
      then:
        - service: cover.close_cover
          target:
            entity_id:
              - cover.terrace_blinds
              - cover.terrace_blinds_2
    # Terrassen-Override erst NACH dem Override-gating-Check zurücksetzen,
    # sonst wäre das Override-Gate oben wirkungslos.
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.beschattung_terrasse_override
    mode: single
