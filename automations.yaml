  - id: windalarm_notification_1
    alias: "Windalarm Notification"

    trigger:
      - platform: state
        entity_id: binary_sensor.windalarm_schwelle_1
        from: "off"
        to: "on"
      - platform: state
        entity_id: binary_sensor.windalarm_schwelle_1
        from: "on"
        to: "off"
      - platform: state
        entity_id: binary_sensor.windalarm_schwelle_2
        from: "off"
        to: "on"
      - platform: state
        entity_id: binary_sensor.windalarm_schwelle_2
        from: "on"
        to: "off"

    condition:
      # verhindert HA-Restart / State-Rehydration Spam
      - condition: template
        value_template: >
          {{ trigger.from_state is not none
             and trigger.to_state is not none
             and trigger.from_state.state not in ['unknown','unavailable']
             and trigger.to_state.state not in ['unknown','unavailable'] }}

    action:
      - service: script.notify_wind_alarm
        data:
          alarm_name: "{{ trigger.to_state.name }}"
          state: >
            {{ 'aktiviert' if trigger.to_state.state == 'on' else 'deaktiviert' }}

    mode: single
  # =========================================================
  # BESCHATTUNGS-AUTOMATIK (NEU 2026-06)
  #
  # Architektur (per Raum):
  #   Default-Tag (KNX Tag-Object off, sonne_trifft_<seite> off)
  #   Nacht       (KNX Tag-Object on for 30min)
  #   Hitzeschutz (sonne_trifft_<seite> on)
  #
  # Sperre (in jeder per-Raum Automation gechecked):
  #   input_boolean.beschattung_lock_<raum>  → App-Sperre, daily reset
  #   binary_sensor.windalarm_schwelle_1     → Wind (KNX überstimmt eh)
  #
  # Messfahrt:      zentral, alle 2 Wochen, vormittags, abwesend, Push
  # App-Lock-Reset: zentral, täglich um Mitternacht alle Locks aus
  # =========================================================

  # ----------------------------------------------------------
  # GARDEROBE — Nord, EG, Raffstore (Sichtschutz)
  # ----------------------------------------------------------
  - id: beschattung_garderobe_tag
    alias: "Garderobe – Tag (Lamellen offen)"
    trigger:
      # Nach Messfahrt zurück in Tag-Modus (Flag-Reset am Ende der Messfahrt)
      - platform: state
        entity_id: input_boolean.beschattung_messfahrt_running
        to: "off"
      - platform: state
        entity_id: switch.twilight
        to: "on"
      - platform: state
        entity_id: binary_sensor.sonne_trifft_nord
        to: "off"
    condition:
      - condition: state
        entity_id: input_boolean.beschattung_lock_garderobe
        state: "off"
      - condition: state
        entity_id: binary_sensor.windalarm_schwelle_1
        state: "off"
      - condition: state
        entity_id: switch.twilight
        state: "on"
      - condition: state
        entity_id: binary_sensor.sonne_trifft_nord
        state: "off"
    action:
      - service: cover.set_cover_position
        target:
          entity_id: cover.wardrobe_blinds
        data:
          position: 0
      - delay: "00:00:03"
      - service: cover.set_cover_tilt_position
        target:
          entity_id: cover.wardrobe_blinds
        data:
          tilt_position: 50
    mode: single

  - id: beschattung_garderobe_nacht
    alias: "Garderobe – Nacht (Lamellen zu)"
    trigger:
      - platform: state
        entity_id: switch.twilight
        to: "off"
        for:
          minutes: 30
    condition:
      - condition: state
        entity_id: input_boolean.beschattung_lock_garderobe
        state: "off"
      - condition: state
        entity_id: binary_sensor.windalarm_schwelle_1
        state: "off"
      - condition: state
        entity_id: switch.twilight
        state: "off"
      # Erst 30 Min nach Sonnenuntergang schließen
      - condition: template
        value_template: "{{ (now() - states.switch.twilight.last_changed).total_seconds() >= 1800 }}"
    action:
      - service: cover.set_cover_position
        target:
          entity_id: cover.wardrobe_blinds
        data:
          position: 0
      - delay: "00:00:03"
      - service: cover.set_cover_tilt_position
        target:
          entity_id: cover.wardrobe_blinds
        data:
          tilt_position: 0
    mode: single

  - id: beschattung_garderobe_hitze
    alias: "Garderobe – Hitzeschutz (Lamellen zu)"
    trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/15"
      - platform: state
        entity_id: binary_sensor.sonne_trifft_nord
        to: "on"
    condition:
      - condition: state
        entity_id: binary_sensor.sonne_trifft_nord
        state: "on"
      - condition: state
        entity_id: input_boolean.beschattung_lock_garderobe
        state: "off"
      - condition: state
        entity_id: binary_sensor.windalarm_schwelle_1
        state: "off"
      - condition: state
        entity_id: switch.twilight
        state: "on"
    action:
      - variables:
          tilt_before: "{{ state_attr('cover.wardrobe_blinds', 'current_tilt_position') | int(default=-1) }}"
      # Hitzeschutz: Raffstore erst ausfahren (unten), dann Lamellen stellen.
      - service: cover.set_cover_position
        target:
          entity_id: cover.wardrobe_blinds
        data:
          position: 0
      # Warten bis Behang wirklich unten ist (Raffstore-Fahrzeit), sonst
      # unterbricht der Tilt-Befehl die Fahrt. Fallback nach Timeout.
      - wait_template: "{{ state_attr('cover.wardrobe_blinds', 'current_position') | int(default=0) <= 2 }}"
        timeout: "00:01:30"
        continue_on_timeout: true
      - service: cover.set_cover_tilt_position
        target:
          entity_id: cover.wardrobe_blinds
        data:
          tilt_position: 0
      - condition: template
        value_template: "{{ tilt_before != 0 }}"
      - service: notify.mobile_app_iphone_von_sebastian
        data:
          title: "Garderobe – Hitzeschutz aktiv"
          message: "Lamellen auf 0 % gefahren (war {{ tilt_before }} %). Sonne trifft Nord."
    mode: single

