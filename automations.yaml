  # B1: Süd Sonnenschutz – Sonne trifft Südfassade
  - id: beschattung_sued_sonne_an
    alias: "Beschattung – Süd Sonnenschutz Start"
    description: >
      Gruppe B Süd: Bei Sonneneinstrahlung auf Südfassade Raffstore runter.
      >= 26°C: Tilt 100%. < 26°C: Tilt 50% (Blendschutz).
      for: 5min entprellt Wolken-Sonne-Wechsel und reduziert Motor-Cycling.
    trigger:
      - platform: state
        entity_id: binary_sensor.sonne_trifft_sued
        to: "on"
        for:
          minutes: 5
    condition:
      - condition: state
        entity_id: binary_sensor.windalarm_schwelle_1
        state: "off"
    action:
      - choose:
          # Heiß: Tilt voll zu
          - conditions:
              - condition: numeric_state
                entity_id: sensor.outdoor_temperature_avg
                above: input_number.beschattung_threshold_hoch
            sequence:
              # Wohnzimmer: nur wenn Override OFF und Sperre OFF
              - if:
                  - condition: state
                    entity_id: input_boolean.beschattung_wohnzimmer_override
                    state: "off"
                  - condition: state
                    entity_id: input_boolean.beschattung_lock_wohnzimmer
                    state: "off"
                then:
                  - service: cover.close_cover
                    target:
                      entity_id:
                        - cover.livingroom_blinds
              # Terrasse: nur wenn Override OFF und Sperre OFF
              - if:
                  - condition: state
                    entity_id: input_boolean.beschattung_terrasse_override
                    state: "off"
                  - condition: state
                    entity_id: input_boolean.beschattung_lock_terrasse
                    state: "off"
                then:
                  - service: cover.close_cover
                    target:
                      entity_id:
                        - cover.terrace_blinds
                        - cover.terrace_blinds_2
        # Mild: Tilt halb (Licht rein, kein Blenden)
        default:
          # Wohnzimmer nur wenn Override OFF und Sperre OFF
          - if:
              - condition: state
                entity_id: input_boolean.beschattung_wohnzimmer_override
                state: "off"
              - condition: state
                entity_id: input_boolean.beschattung_lock_wohnzimmer
                state: "off"
            then:
              - service: cover.set_cover_position
                target:
                  entity_id:
                    - cover.livingroom_blinds
                data:
                  position: 0
              - delay:
                  seconds: 5
              - service: cover.set_cover_tilt_position
                target:
                  entity_id:
                    - cover.livingroom_blinds
                data:
                  tilt_position: 50
          # Terrasse nur wenn Override OFF und Sperre OFF
          - if:
              - condition: state
                entity_id: input_boolean.beschattung_terrasse_override
                state: "off"
              - condition: state
                entity_id: input_boolean.beschattung_lock_terrasse
                state: "off"
            then:
              - service: cover.set_cover_position
                target:
                  entity_id:
                    - cover.terrace_blinds
                    - cover.terrace_blinds_2
                data:
                  position: 0
              - delay:
                  seconds: 5
              - service: cover.set_cover_tilt_position
                target:
                  entity_id:
                    - cover.terrace_blinds
                    - cover.terrace_blinds_2
                data:
                  tilt_position: 50
    mode: single

  # B2: Süd Sonnenschutz Ende
  - id: beschattung_sued_sonne_aus
    alias: "Beschattung – Süd Sonnenschutz Ende"
    description: >
      Gruppe B Süd: Öffnet wenn Sonne Südfassade verlässt (inkl. Bewölkung).
      Wohnzimmer: Lamellen auf (Sichtschutz bleibt). Terrasse: ganz hoch.
      Re-Evaluation alle 15 Min und bei HA-Start, damit auch bei
      bewölktem Wetter tagsüber geöffnet wird. for: 5min entprellt
      Wolken-Sonne-Wechsel und reduziert Motor-Cycling.
    trigger:
      - platform: state
        entity_id: binary_sensor.sonne_trifft_sued
        to: "off"
        for:
          minutes: 5
      - platform: time_pattern
        minutes: "/15"
      - platform: homeassistant
        event: start
    condition:
      - condition: numeric_state
        entity_id: sun.sun
        attribute: elevation
        above: 0
      - condition: state
        entity_id: binary_sensor.sonne_trifft_sued
        state: "off"
    action:
      # Wohnzimmer: Sichtschutz – nur Lamellen öffnen (wenn Override OFF und Sperre OFF)
      - if:
          - condition: state
            entity_id: input_boolean.beschattung_wohnzimmer_override
            state: "off"
          - condition: state
            entity_id: input_boolean.beschattung_lock_wohnzimmer
            state: "off"
        then:
          - service: cover.set_cover_tilt_position
            target:
              entity_id:
                - cover.livingroom_blinds
            data:
              tilt_position: 50
      # Terrasse: voll öffnen (nur wenn Override OFF und Sperre OFF)
      - if:
          - condition: state
            entity_id: input_boolean.beschattung_terrasse_override
            state: "off"
          - condition: state
            entity_id: input_boolean.beschattung_lock_terrasse
            state: "off"
        then:
          - service: cover.open_cover
            target:
              entity_id:
                - cover.terrace_blinds
                - cover.terrace_blinds_2
    mode: single

  # B3: Süd Hitzeschutz Eskalation – Temp steigt über 26°C während Sonne Süd trifft
  - id: beschattung_sued_eskalation
    alias: "Beschattung – Süd Hitzeschutz Eskalation"
    description: >
      Wenn Temp über 26°C steigt während Sonne bereits auf Süd trifft,
