            data:
              tilt_position: 0
    mode: single

  # B3b: Süd Hitzeschutz De-Eskalation – Temp fällt unter 26°C während Sonne Süd trifft
  - id: beschattung_sued_deeskalation
    alias: "Beschattung – Süd Hitzeschutz De-Eskalation"
    description: >
      Wenn Temp unter 26°C fällt während Sonne noch auf Süd trifft,
      Tilt von 0% zurück auf 50% (Blendschutz statt Hitzeschutz).
    trigger:
