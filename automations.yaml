  - id: garage_venting_control
    alias: "Garage – Lüftung Taupunkt-Steuerung"
    description: >
      Schaltet die Garagenlüftung ein wenn der Lüftungssensor "Lüften stark" meldet,
      es nicht Nacht ist (07:00–21:00), die Außentemperatur mind. 5°C beträgt
      und das Garagentor geschlossen ist. Mindestlaufzeit 60 Minuten.
    trigger:
      - platform: time_pattern
        minutes: "/15"
      - platform: state
        entity_id: sensor.luftung_garage
    variables:
      garage_closed: "{{ states('sensor.garage_door_garage_door_position') | int(0) == 0 }}"
      is_daytime: "{{ now().hour >= 7 and now().hour < 21 }}"
      warm_enough: "{{ states('sensor.outdoor_temperature') | float(0) >= 5 }}"
      should_vent: "{{ garage_closed and is_daytime and warm_enough and states('sensor.luftung_garage') == 'Lüften stark' }}"
      vent_is_on: "{{ is_state('switch.garage_door_garage_door_vent', 'on') }}"
      vent_min_runtime_met: "{{ not vent_is_on or (now() - states.switch.garage_door_garage_door_vent.last_changed).total_seconds() >= 3600 }}"
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ should_vent and not vent_is_on }}"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.garage_door_garage_door_vent
              - delay:
                  seconds: 5
              - service: switch.turn_off
                target:
                  entity_id: switch.garage_door_garage_door_light
          - conditions:
              - condition: template
                value_template: "{{ not should_vent and vent_is_on and vent_min_runtime_met }}"
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.garage_door_garage_door_vent
    mode: single

  - id: garage_position_sync
    alias: Garage door position sync to KNX
    trigger:
    - platform: state
      entity_id: sensor.garage_door_garage_door_position
    condition:
    - condition: template
      value_template: '{{ states(''sensor.garage_door_garage_door_position'') | is_number
        }}'
    action:
    - service: knx.send
      data:
        address: 8/5/1
        type: '5.010'
        payload: '{{ ((100 - states("sensor.garage_door_garage_door_position") | float(0))
          * 2.55) | round(0) }}'
    mode: restart
  - id: knx_garage_pulse
    alias: KNX Garage Door Pulse
    trigger:
    - platform: event
      event_type: knx_event
      event_data:
        destination: 8/5/0
    action:
    - choose:
      - conditions: '{{ trigger.event.data.data == 0 }}'
        sequence:
        - service: cover.open_cover
          target:
            entity_id: cover.garage_door_garage_door
      - conditions: '{{ trigger.event.data.data == 1 }}'
        sequence:
        - service: cover.close_cover
          target:
            entity_id: cover.garage_door_garage_door
    mode: single
  - id: wc_lights_auto_off
    alias: WC Licht automatisch aus nach 30 Minuten
    trigger:
    - platform: state
      entity_id:
      - light.wc_eg_light
      - light.wc_og_light
      to: 'on'
      for:
        minutes: 30
    action:
    - service: light.turn_off
      target:
        entity_id: '{{ trigger.entity_id }}'
    mode: restart
  - id: wohnkueche_lichtmodus_setzen
    alias: Wohnküche Lichtmodus setzen
    trigger:
    - platform: time
      at: 06:00:00
    - platform: time
      at: '08:00:00'
    - platform: time
      at: '07:00:00'
    - platform: time
      at: '09:00:00'
    - platform: time
      at: '10:00:00'
    - platform: time
      at: '12:00:00'
    - platform: time
      at: '14:00:00'
    - platform: time
      at: '18:00:00'
    - platform: time
      at: '20:00:00'
    - platform: time
      at: '22:00:00'
    - platform: time
      at: '23:00:00'
    condition:
      - condition: state
        entity_id: input_boolean.wohnkueche_override_kochen
        state: 'off'
      - condition: state
        entity_id: input_boolean.wohnkueche_override_tv
        state: 'off'
      - condition: state
        entity_id: input_boolean.wohnkueche_override_szene
        state: 'off'
    action:
    - choose:
      # --- WERKTAG ---
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'on'
        - condition: time
          after: 06:00:00
          before: 08:00:00
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: fruehstueck
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'on'
        - condition: time
          after: '18:00:00'
          before: '20:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: werktag_abend_aktiv
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'on'
        - condition: time
          after: '20:00:00'
          before: '22:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: werktag_relax
      # --- WOCHENENDE ---
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'off'
        - condition: time
          after: '07:00:00'
          before: '10:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: fruehstueck
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'off'
        - condition: time
          after: '10:00:00'
          before: '14:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: wochenende_tag
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'off'
        - condition: time
          after: '14:00:00'
          before: '18:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: wochenende_nachmittag
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'off'
        - condition: time
          after: '18:00:00'
          before: '22:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: wochenende_abend
      # --- BEIDE ---
      - conditions:
        - condition: time
          after: '22:00:00'
          before: '23:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: spaetabend
      - conditions:
        - condition: time
          after: '23:00:00'
          before: 06:00:00
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: nacht
    mode: single
  - id: wohnkueche_licht_master
    alias: Wohnküche Licht – Master
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.praesenzmelder_wohnzimmer
        id: praesenz
      - platform: numeric_state
        entity_id: sensor.helligkeit_sud
        above: input_number.wohnkueche_licht_outdoor_lux
        id: hell_geworden
      - platform: numeric_state
        entity_id: sensor.helligkeit_sud
        below: input_number.wohnkueche_licht_outdoor_lux
        id: dunkel_geworden
      - platform: state
        entity_id: input_select.wohnkueche_lichtmodus
        id: modus
    condition:
      - condition: or
        conditions:
          # Präsenz AUS → durchlassen (Lichter aus)
          - condition: and
            conditions:
              - condition: trigger
                id: praesenz
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'off'
          # Modus geändert + Präsenz + dunkel + keine Overrides → durchlassen (neue Szene)
          - condition: and
            conditions:
              - condition: trigger
                id: modus
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'on'
              - condition: state
                entity_id: input_boolean.wohnkueche_override_kochen
                state: 'off'
              - condition: state
                entity_id: input_boolean.wohnkueche_override_tv
                state: 'off'
              - condition: state
                entity_id: input_boolean.wohnkueche_override_szene
                state: 'off'
              - condition: template
                value_template: >
                  {{ states('sensor.helligkeit_sud') | float(99999)
                     < states('input_number.wohnkueche_licht_outdoor_lux') | float(5000) }}
          # Präsenz AN + dunkel + keine Overrides → durchlassen (Lichter an)
          - condition: and
            conditions:
              - condition: trigger
                id: praesenz
              - condition: state
                entity_id: input_boolean.wohnkueche_override_kochen
                state: 'off'
              - condition: state
                entity_id: input_boolean.wohnkueche_override_tv
                state: 'off'
              - condition: state
                entity_id: input_boolean.wohnkueche_override_szene
                state: 'off'
              - condition: template
                value_template: >
                  {{ states('sensor.helligkeit_sud') | float(99999)
                     < states('input_number.wohnkueche_licht_outdoor_lux') | float(5000) }}
          # Hell geworden + Präsenz + keine Overrides → durchlassen (Lichter aus)
          - condition: and
            conditions:
              - condition: trigger
                id: hell_geworden
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'on'
              - condition: state
                entity_id: input_boolean.wohnkueche_override_kochen
                state: 'off'
              - condition: state
                entity_id: input_boolean.wohnkueche_override_tv
                state: 'off'
              - condition: state
                entity_id: input_boolean.wohnkueche_override_szene
                state: 'off'
          # Dunkel geworden + Präsenz + keine Overrides → durchlassen (Lichter an)
          - condition: and
            conditions:
              - condition: trigger
                id: dunkel_geworden
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'on'
              - condition: state
                entity_id: input_boolean.wohnkueche_override_kochen
                state: 'off'
              - condition: state
                entity_id: input_boolean.wohnkueche_override_tv
                state: 'off'
              - condition: state
                entity_id: input_boolean.wohnkueche_override_szene
                state: 'off'
    action:
      - choose:
          # Hell geworden → alle Lichter aus
          - conditions:
              - condition: trigger
                id: hell_geworden
            sequence:
              - service: light.turn_off
                target:
                  entity_id:
                    - light.licht_kueche_fenster
                    - light.licht_kueche_fenster_2
                    - light.licht_spuele_kueche
                    - light.licht_vitrine_kueche
                    - light.esszimmer_licht
                    - light.livingroom_main_light
                    - light.livingroom_reading_light
          # Dunkel geworden → aktuellen Modus ausführen
          - conditions:
              - condition: trigger
                id: dunkel_geworden
            sequence:
              - service: script.wohnkueche_lichtmodus_ausfuehren
          # Präsenz-basierte Modi
          - conditions:
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'on'
              - condition: state
                entity_id: input_select.wohnkueche_lichtmodus
                state: fruehstueck
            sequence:
              - service: script.wohnkueche_fruehstueck
          - conditions:
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'on'
              - condition: state
                entity_id: input_select.wohnkueche_lichtmodus
                state: werktag_abend_aktiv
            sequence:
              - service: script.wohnkueche_werktag_abend_aktiv
          - conditions:
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'on'
              - condition: state
                entity_id: input_select.wohnkueche_lichtmodus
                state: werktag_relax
            sequence:
              - service: script.wohnkueche_werktag_relax
          - conditions:
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'on'
              - condition: state
                entity_id: input_select.wohnkueche_lichtmodus
                state: spaetabend
            sequence:
              - service: script.wohnkueche_spaetabend
          - conditions:
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'on'
              - condition: state
                entity_id: input_select.wohnkueche_lichtmodus
                state: nacht
            sequence:
              - service: script.wohnkueche_nacht
          - conditions:
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'on'
              - condition: state
                entity_id: input_select.wohnkueche_lichtmodus
                state: wochenende_tag
            sequence:
              - service: script.wohnkueche_wochenende_tag
          - conditions:
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'on'
              - condition: state
                entity_id: input_select.wohnkueche_lichtmodus
                state: wochenende_nachmittag
            sequence:
              - service: script.wochenende_nachmittag
          - conditions:
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'on'
              - condition: state
                entity_id: input_select.wohnkueche_lichtmodus
                state: wochenende_abend
            sequence:
              - service: script.wohnkueche_wochenende_abend
          - conditions:
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'on'
              - condition: state
                entity_id: input_select.wohnkueche_lichtmodus
                state: alles_aus
            sequence:
              - service: script.wohnkueche_alles_aus
        default:
          - service: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.wohnkueche_override_kochen
                - input_boolean.wohnkueche_override_tv
                - input_boolean.wohnkueche_override_szene
          - service: light.turn_off
            target:
              entity_id:
                - light.licht_kueche_fenster
                - light.licht_kueche_fenster_2
                - light.licht_spuele_kueche
                - light.licht_vitrine_kueche
                - light.esszimmer_licht
                - light.livingroom_main_light
                - light.livingroom_reading_light
  - alias: Keller Luftfeuchte Warnungen
    description: Mehrstufige Warnungen bei erhöhter Keller-Luftfeuchte
    mode: single
    trigger:
    - platform: numeric_state
      entity_id:
      - sensor.hobby_humidity
      - sensor.engineering_humidity
      - sensor.storage_humidity
      above: 60
      for: 01:00:00
    - platform: numeric_state
      entity_id:
      - sensor.hobby_humidity
      - sensor.engineering_humidity
      - sensor.storage_humidity
      above: 65
      for: 03:00:00
    - platform: numeric_state
      entity_id:
      - sensor.hobby_humidity
      - sensor.engineering_humidity
      - sensor.storage_humidity
      above: 70
      for: 01:00:00
    action:
    - variables:
        raeume:
          sensor.hobby_humidity: Hobbyraum
          sensor.engineering_humidity: Technikraum
          sensor.storage_humidity: Lager
        feuchte: '{{ states(trigger.entity_id) | float }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ feuchte >= 60 and feuchte < 65 }}'
        sequence:
        - service: notify.mobile_app_iphone_von_sebastian
          data:
            title: Keller – Hinweis
            message: '{{ raeume[trigger.entity_id] }}: Luftfeuchte seit 1 Stunde über
              60 % (aktuell {{ feuchte }} %). Lüften prüfen.

              '
      - conditions:
        - condition: template
          value_template: '{{ feuchte >= 65 and feuchte < 70 }}'
        sequence:
        - service: notify.mobile_app_iphone_von_sebastian
          data:
            title: Keller – Warnung
            message: '{{ raeume[trigger.entity_id] }}: Luftfeuchte seit 3 Stunden über
              65 % (aktuell {{ feuchte }} %). Handeln empfohlen.

              '
      - conditions:
        - condition: template
          value_template: '{{ feuchte >= 70 }}'
        sequence:
        - service: notify.mobile_app_iphone_von_sebastian
          data:
            title: Keller – ALARM
            message: '{{ raeume[trigger.entity_id] }}: Luftfeuchte seit 1 Stunde über
              70 % (aktuell {{ feuchte }} %). Sofort reagieren!

              '
    id: 027fd1bab8584ef983ec272a503c870e
  - id: '1767284686170'
    alias: Licht Haustür
    description: ''
    use_blueprint:
      path: homeassistant/motion_light.yaml
      input:
        motion_entity: binary_sensor.bthome_sensor_ea3b_motion
        light_target:
          entity_id: light.main_door_light
  - id: wc_og_licht_nachts_bewegung
    alias: WC OG Licht nachts bei Bewegung
    description: Schaltet das WC-Licht nachts gedimmt ein, wenn der Bewegungsmelder
      in der Galerie auslöst
    triggers:
    - entity_id: binary_sensor.bewegungsmelder_galerie_og
      to: 'on'
      trigger: state
    - entity_id: binary_sensor.bewegungsmelder_galerie_og
      to: 'off'
      trigger: state
    conditions:
    - condition: time
      after: '23:00:00'
      before: 06:00:00
    actions:
    - choose:
      - conditions:
        - condition: state
          entity_id: binary_sensor.bewegungsmelder_galerie_og
          state: 'on'
        sequence:
        - target:
            entity_id: light.wc_og_light
          data:
            brightness_pct: 42
            transition: 1
          action: light.turn_on
      - conditions:
        - condition: state
          entity_id: binary_sensor.bewegungsmelder_galerie_og
          state: 'off'
        sequence:
        - delay: 00:05:00
        - target:
            entity_id: light.wc_og_light
          data:
            transition: 2
          action: light.turn_off
    mode: restart
  - id: badezimmer_privacy
    alias: Badezimmer Privacy Modus
    description: >
      Speichert Position + Lamellen und schließt den Raffstore komplett,
      sobald ein Licht im Bad angeht. Stellt den vorherigen Zustand
      wieder her, sobald ALLE Lichter aus sind.
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - light.bathroom_main_light
          - light.bathroom_mirror_light
        to: "on"
        id: licht_an
      - platform: state
        entity_id:
          - light.bathroom_main_light
          - light.bathroom_mirror_light
        to: "off"
        id: licht_aus
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: licht_an
              - condition: state
                entity_id: input_boolean.badezimmer_privacy_active
                state: "off"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.raffstore_badezimmer_vorher
                data:
                  value: >
                    {% set pos = state_attr('cover.bathroom_blinds', 'current_position') %}
                    {{ pos | int if pos is not none else 0 }}
              - service: input_number.set_value
                target:
                  entity_id: input_number.raffstore_badezimmer_tilt_vorher
                data:
                  value: >
                    {% set tilt = state_attr('cover.bathroom_blinds', 'current_tilt_position') %}
                    {{ tilt | int if tilt is not none else 50 }}
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.badezimmer_privacy_active
              - service: cover.set_cover_position
                target:
                  entity_id: cover.bathroom_blinds
                data:
                  position: 0
              - delay:
                  seconds: 3
              - service: cover.set_cover_tilt_position
                target:
                  entity_id: cover.bathroom_blinds
                data:
                  tilt_position: 0
          - conditions:
              - condition: trigger
                id: licht_aus
              - condition: state
                entity_id: input_boolean.badezimmer_privacy_active
                state: "on"
              - condition: state
                entity_id: light.bathroom_main_light
                state: "off"
              - condition: state
                entity_id: light.bathroom_mirror_light
                state: "off"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.badezimmer_privacy_active
              - service: cover.set_cover_position
                target:
                  entity_id: cover.bathroom_blinds
                data:
                  position: "{{ states('input_number.raffstore_badezimmer_vorher') | int }}"
              - delay:
                  seconds: 3
              - service: cover.set_cover_tilt_position
                target:
                  entity_id: cover.bathroom_blinds
                data:
                  tilt_position: "{{ states('input_number.raffstore_badezimmer_tilt_vorher') | int }}"

  - id: badezimmer_privacy_tilt_enforce
    alias: Badezimmer Privacy Tilt Sicherstellen
    description: >
      Erzwingt Lamellen zu (Tilt 0) solange Privacy Mode aktiv ist.
      Fängt ab, wenn andere Automations (Beschattung, Sunrise Slats)
      die Lamellen öffnen während das Licht noch an ist.
    mode: restart
    trigger:
      - platform: state
        entity_id: cover.bathroom_blinds
        attribute: current_tilt_position
    condition:
      - condition: state
        entity_id: input_boolean.badezimmer_privacy_active
        state: "on"
      - condition: template
        value_template: >
          {{ state_attr('cover.bathroom_blinds', 'current_tilt_position') | int(0) > 10 }}
    action:
      - delay:
          seconds: 2
      - condition: state
        entity_id: input_boolean.badezimmer_privacy_active
        state: "on"
      - service: cover.set_cover_tilt_position
        target:
          entity_id: cover.bathroom_blinds
        data:
          tilt_position: 0

  - id: badezimmer_privacy_safety_reset
    alias: Badezimmer Privacy Safety Reset
    description: >
      Sicherheitsnetz: Wenn beide Lichter seit 5 Minuten aus sind
      aber der Privacy-Flag noch gesetzt ist, Flag zurücksetzen und
      Raffstore wiederherstellen. Fängt hängengebliebene Zustände ab
      (z.B. nach HA-Neustart).
    mode: single
    trigger:
      - platform: state
        entity_id:
          - light.bathroom_main_light
          - light.bathroom_mirror_light
        to: "off"
        for:
          minutes: 5
    condition:
      - condition: state
        entity_id: input_boolean.badezimmer_privacy_active
        state: "on"
      - condition: state
        entity_id: light.bathroom_main_light
        state: "off"
      - condition: state
        entity_id: light.bathroom_mirror_light
        state: "off"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.badezimmer_privacy_active
      - service: cover.set_cover_position
        target:
          entity_id: cover.bathroom_blinds
        data:
          position: "{{ states('input_number.raffstore_badezimmer_vorher') | int }}"
      - delay:
          seconds: 3
