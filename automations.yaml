        entity_id: binary_sensor.sonne_trifft_sued
        state: "on"
    action:
      # Wohnzimmer nur wenn Override OFF und Sperre OFF
      - if:
          - condition: state
            entity_id: input_boolean.beschattung_wohnzimmer_override
            state: "off"
          - condition: state
            entity_id: input_boolean.beschattung_lock_wohnzimmer
            state: "off"
        then:
          - service: cover.set_cover_tilt_position
            target:
