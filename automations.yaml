  #########################################################
  # BESCHATTUNGSAUTOMATIK
  #########################################################

  # A1: Threshold-Räume – Beschatten bei Hitze (>= 23°C)
  - id: beschattung_threshold_zu
    alias: "Beschattung – Threshold-Räume schließen bei Hitze"
    description: >
      Gruppe A: Schließt Nord, WC, Gästezimmer wenn Außentemp >= Threshold niedrig
      und Sonne über Horizont.
    trigger:
      - platform: numeric_state
        entity_id: sensor.outdoor_temperature_avg
        above: input_number.beschattung_threshold_niedrig
        for:
          minutes: 10
    condition:
      - condition: numeric_state
        entity_id: sun.sun
        attribute: elevation
        above: 0
      - condition: numeric_state
        entity_id: sensor.helligkeit_nord
        above: input_number.beschattung_lux_nord
    action:
      # Raffstore: Position zu + Tilt zu — pro Cover gegen Sperre prüfen
      - if:
          - condition: state
            entity_id: input_boolean.beschattung_lock_abstellraum
            state: "off"
        then:
          - service: cover.close_cover
            target:
              entity_id: cover.shelf_blinds
      - if:
          - condition: state
            entity_id: input_boolean.beschattung_lock_garderobe
            state: "off"
        then:
          - service: cover.close_cover
            target:
              entity_id: cover.wardrobe_blinds
      - if:
          - condition: state
            entity_id: input_boolean.beschattung_lock_wc_eg
            state: "off"
        then:
          - service: cover.close_cover
            target:
              entity_id: cover.wc_eg_blinds
      - if:
          - condition: state
            entity_id: input_boolean.beschattung_lock_wc_og
            state: "off"
        then:
          - service: cover.close_cover
            target:
              entity_id: cover.wc_og_blinds
      - if:
          - condition: state
            entity_id: input_boolean.beschattung_lock_badezimmer
            state: "off"
        then:
          - service: cover.close_cover
            target:
              entity_id: cover.bathroom_blinds
    mode: single

  # A2: Threshold-Räume – Öffnen bei Abkühlung (< 23°C)
  - id: beschattung_threshold_auf
    alias: "Beschattung – Threshold-Räume öffnen bei Abkühlung"
    description: >
      Gruppe A: Öffnet Nord, WC, Gästezimmer wenn Außentemp < Threshold niedrig.
    trigger:
      - platform: numeric_state
