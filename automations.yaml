  - id: glaspanel_kueche_toggle
    alias: Glaspanel Küche – Kochen Toggle
    trigger:
      - platform: event
        event_type: knx_event
        event_data:
          destination: 9/1/0
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.wohnkueche_override_kochen
                state: 'off'
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.wohnkueche_override_kochen
              - service: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.wohnkueche_override_tv
                    - input_boolean.wohnkueche_override_szene
              - service: script.wohnkueche_werktag_abend_aktiv
              - service: knx.send
                data:
                  address: "9/1/6"
                  type: "string"
                  payload: "Abend aktiv"
          - conditions:
              - condition: state
                entity_id: input_boolean.wohnkueche_override_kochen
                state: 'on'
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.wohnkueche_override_kochen
              - service: script.wohnkueche_lichtmodus_ausfuehren
              - service: knx.send
                data:
                  address: "9/1/6"
                  type: "string"
                  payload: >-
