    mode: single

  # ----------------------------------------------------------
  # BÜRO — Süd, OG, Rollo (Hitzeschutz + Blendschutz speziell)
  # Werktag + zuhause → NUR Blendschutz (Sebastian arbeitet):
  #   tiefe Sonne (<45°) + viel Lux → 50 % zu, sonst 25 % zu
  # Sonst (Werktag+abwesend / Wochenende) → Spalt offen (10 %, Luftzirkulation)
  # ----------------------------------------------------------
  - id: beschattung_buero_tag
    alias: "Büro – Tag (Rollo offen)"
    trigger:
      # Nach Messfahrt zurück in Tag-Modus (Flag-Reset am Ende der Messfahrt)
      - platform: state
        entity_id: input_boolean.beschattung_messfahrt_running
        to: "off"
      - platform: state
        entity_id: switch.twilight
        to: "on"
      - platform: state
        entity_id: binary_sensor.sonne_trifft_sued
        to: "off"
    condition:
      - condition: state
        entity_id: input_boolean.beschattung_lock_buero
        state: "off"
      # Fenster-offen-Override: keine Bewegung wenn Fenster offen
      - condition: template
        value_template: "{{ not is_state('binary_sensor.shelly_blu_door_window_a173_window', 'on') }}"
      - condition: state
        entity_id: binary_sensor.windalarm_schwelle_1
        state: "off"
      - condition: state
        entity_id: switch.twilight
        state: "on"
      - condition: state
        entity_id: binary_sensor.sonne_trifft_sued
        state: "off"
    action:
      - service: cover.set_cover_position
        target:
          entity_id: cover.office_shutter
        data:
          position: 100
    mode: single

  - id: beschattung_buero_nacht
    alias: "Büro – Nacht (Rollo zu)"
    trigger:
      - platform: state
        entity_id: switch.twilight
        to: "off"
        for:
          minutes: 30
    condition:
      - condition: state
        entity_id: input_boolean.beschattung_lock_buero
        state: "off"
      # Fenster-offen-Override: keine Bewegung wenn Fenster offen
      - condition: template
        value_template: "{{ not is_state('binary_sensor.shelly_blu_door_window_a173_window', 'on') }}"
      - condition: state
        entity_id: binary_sensor.windalarm_schwelle_1
        state: "off"
      - condition: state
        entity_id: switch.twilight
        state: "off"
      # Erst 30 Min nach Sonnenuntergang schließen
      - condition: template
        value_template: "{{ (now() - states.switch.twilight.last_changed).total_seconds() >= 1800 }}"
    action:
      - service: cover.set_cover_position
        target:
          entity_id: cover.office_shutter
        data:
          position: 0
    mode: single

  - id: beschattung_buero_hitze
    alias: "Büro – Hitze-/Blendschutz nach Anwesenheit"
    description: >
      Werktag+home → nur Blendschutz (50 % bei tiefer Sonne+viel Lux, sonst 75 %).
      Sonst (Werktag+abwesend, Wochenende) → Spalt offen (10) für Luftzirkulation.
    trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/15"
      - platform: state
        entity_id: binary_sensor.sonne_trifft_sued
        to: "on"
      - platform: state
        entity_id: device_tracker.iphone_von_sebastian
        for:
          minutes: 2
    condition:
      - condition: state
        entity_id: binary_sensor.sonne_trifft_sued
        state: "on"
      - condition: state
        entity_id: input_boolean.beschattung_lock_buero
        state: "off"
      # Fenster-offen-Override: keine Bewegung wenn Fenster offen
      - condition: template
        value_template: "{{ not is_state('binary_sensor.shelly_blu_door_window_a173_window', 'on') }}"
      - condition: state
        entity_id: binary_sensor.windalarm_schwelle_1
        state: "off"
      - condition: state
        entity_id: switch.twilight
        state: "on"
    action:
      - variables:
          pos_before: "{{ state_attr('cover.office_shutter', 'current_position') | int(default=-1) }}"
      - choose:
          # Werktag + zuhause → Blendschutz (zwei Stufen)
          - conditions:
              - condition: state
                entity_id: binary_sensor.workday_sensor
                state: "on"
              - condition: state
                entity_id: device_tracker.iphone_von_sebastian
                state: "home"
            sequence:
              - choose:
                  # Tiefe Sonne + viel Lux → 50 % zu (max Blendschutz)
                  - conditions:
                      - condition: numeric_state
                        entity_id: sun.sun
                        attribute: elevation
                        below: 45
                      - condition: numeric_state
                        entity_id: sensor.helligkeit_sud
                        above: input_number.beschattung_lux_sud
                    sequence:
                      - variables:
                          pos_target: 50
                      - service: cover.set_cover_position
                        target:
                          entity_id: cover.office_shutter
                        data:
                          position: 50
                default:
                  # Sonst → 25 % zu (mild)
                  - variables:
                      pos_target: 75
                  - service: cover.set_cover_position
                    target:
                      entity_id: cover.office_shutter
                    data:
                      position: 75
        # Werktag+abwesend ODER Wochenende → Spalt offen (Luftzirkulation)
        default:
          - variables:
              pos_target: 10
          - service: cover.set_cover_position
            target:
              entity_id: cover.office_shutter
            data:
              position: 10
      - condition: template
        value_template: "{{ pos_before != (pos_target | default(-1) | int) }}"
      - service: notify.mobile_app_iphone_von_sebastian
        data:
          title: "Büro – Hitze-/Blendschutz aktiv"
          message: "Rollo {{ pos_before }}% → {{ pos_target }}%. Sonne trifft Süd."
    mode: single

  # ----------------------------------------------------------
  # SCHLAFZIMMER — Nord, OG, Rollo (Hitzeschutz + Nachtdunkelheit)
  # Tag-Öffnung: Werktag 07:00 / Wochenende 10:00 (NICHT mit Sonnenaufgang)
  # ----------------------------------------------------------
  - id: beschattung_schlafzimmer_tag
    alias: "Schlafzimmer – Tag (Rollo offen, Werktag 7:00 / WE 10:00)"
    trigger:
      - platform: time
        at: "07:00:00"
        id: werktag_zeit
      - platform: time
        at: "10:00:00"
        id: we_zeit
      - platform: state
        entity_id: binary_sensor.sonne_trifft_nord
        to: "off"
        id: hitze_aus
      # Nach Messfahrt zurück in Tag-Modus (Flag-Reset am Ende der Messfahrt)
      - platform: state
        entity_id: input_boolean.beschattung_messfahrt_running
        to: "off"
        id: messfahrt_ende
    condition:
      - condition: state
        entity_id: input_boolean.beschattung_lock_schlafzimmer
        state: "off"
      # Fenster-offen-Override: keine Bewegung wenn Fenster offen
      - condition: template
        value_template: "{{ not is_state('binary_sensor.fenster_schlafzimmer_window', 'on') }}"
      - condition: state
        entity_id: binary_sensor.windalarm_schwelle_1
        state: "off"
      - condition: state
        entity_id: switch.twilight
        state: "on"
      - condition: state
        entity_id: binary_sensor.sonne_trifft_nord
        state: "off"
      # Werktag-Trigger nur an Werktagen, WE-Trigger nur am Wochenende,
      # andere Trigger nur nach Wake-Zeit (07:00 Werktag / 10:00 WE)
      - condition: template
        value_template: >
          {% set tid = trigger.id %}
          {% set workday = is_state('binary_sensor.workday_sensor', 'on') %}
          {% if tid == 'werktag_zeit' %}
            {{ workday }}
          {% elif tid == 'we_zeit' %}
            {{ not workday }}
          {% else %}
            {% set h = now().hour %}
            {{ (workday and h >= 7) or (not workday and h >= 10) }}
          {% endif %}
    action:
      - service: cover.set_cover_position
        target:
          entity_id: cover.bedroom_shutter
        data:
          position: 100
    mode: single

  - id: beschattung_schlafzimmer_nacht
    alias: "Schlafzimmer – Nacht (Rollo zu)"
    trigger:
      - platform: state
        entity_id: switch.twilight
        to: "off"
        for:
          minutes: 30
    condition:
      - condition: state
        entity_id: input_boolean.beschattung_lock_schlafzimmer
        state: "off"
      # Fenster-offen-Override: keine Bewegung wenn Fenster offen
      - condition: template
        value_template: "{{ not is_state('binary_sensor.fenster_schlafzimmer_window', 'on') }}"
      - condition: state
        entity_id: binary_sensor.windalarm_schwelle_1
        state: "off"
      - condition: state
        entity_id: switch.twilight
        state: "off"
      # Erst 30 Min nach Sonnenuntergang schließen
      - condition: template
        value_template: "{{ (now() - states.switch.twilight.last_changed).total_seconds() >= 1800 }}"
    action:
      - service: cover.set_cover_position
        target:
          entity_id: cover.bedroom_shutter
        data:
          position: 0
    mode: single

  - id: beschattung_schlafzimmer_hitze
    alias: "Schlafzimmer – Hitzeschutz (Rollo zu)"
    trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/15"
      - platform: state
        entity_id: binary_sensor.sonne_trifft_nord
        to: "on"
    condition:
      - condition: state
        entity_id: binary_sensor.sonne_trifft_nord
        state: "on"
      - condition: state
        entity_id: input_boolean.beschattung_lock_schlafzimmer
        state: "off"
      # Fenster-offen-Override: keine Bewegung wenn Fenster offen
      - condition: template
        value_template: "{{ not is_state('binary_sensor.fenster_schlafzimmer_window', 'on') }}"
      - condition: state
        entity_id: binary_sensor.windalarm_schwelle_1
        state: "off"
      - condition: state
        entity_id: switch.twilight
        state: "on"
    action:
      - variables:
          pos_before: "{{ state_attr('cover.bedroom_shutter', 'current_position') | int(default=-1) }}"
      - service: cover.set_cover_position
        target:
          entity_id: cover.bedroom_shutter
        data:
          position: 0
      - condition: template
        value_template: "{{ pos_before != 0 }}"
      - service: notify.mobile_app_iphone_von_sebastian
        data:
          title: "Schlafzimmer – Hitzeschutz aktiv"
          message: "Rollo wird zugefahren (war {{ pos_before }} %). Sonne trifft Nord."
    mode: single

  - id: beschattung_messfahrt_2_wochen
    alias: "Beschattung – Messfahrt 2-wöchentlich (Vormittag, abwesend)"
    description: >
      Alle 2 Wochen am Werktag-Vormittag (08:00) für jeden Raum eine
      Messfahrt, sofern Sebastian nicht zuhause ist und gerade kein
      Hitzeschutz aktiv ist (kein sonne_trifft_*  on). Push-Nachricht
      vor dem Start.
    mode: single
    trigger:
      - platform: time
        at: "08:00:00"
    condition:
      # Werktag
      - condition: state
        entity_id: binary_sensor.workday_sensor
        state: "on"
      # Alle 2 Wochen: nur Montag einer geraden ISO-Kalenderwoche.
      # (Ohne Wochentags-Bindung würde die Messfahrt sonst an JEDEM
      #  Werktag der geraden Woche laufen.)
      - condition: time
        weekday:
          - mon
      - condition: template
        value_template: "{{ (now().isocalendar().week % 2) == 0 }}"
      # Niemand zuhause
      - condition: state
        entity_id: device_tracker.iphone_von_sebastian
        state: "not_home"
      # Kein Hitzeschutz aktiv (auf keiner Fassade)
      - condition: state
        entity_id: binary_sensor.sonne_trifft_nord
        state: "off"
      - condition: state
        entity_id: binary_sensor.sonne_trifft_sued
        state: "off"
      - condition: state
        entity_id: binary_sensor.sonne_trifft_west
        state: "off"
      # Wind-Frei (KNX überstimmt eh, aber sicher ist sicher)
      - condition: state
        entity_id: binary_sensor.windalarm_schwelle_1
        state: "off"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.beschattung_messfahrt_running
      - service: notify.mobile_app_iphone_von_sebastian
        data:
          title: Beschattung – Messfahrt
          message: "KNX-Messfahrt aller Raffstores/Rollos startet jetzt (~40 s)."
      # Pro Raum Messfahrt (KNX-Switch kurz an)
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_raffstore_garderobe
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_raffstore_abstellraum
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_raffstore_wc_eg
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_raffstore_kuche
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_raffstore_esszimmer
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_raffstore_wohnzimmer
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_raffstore_terrasse
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_raffstore_bad
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_raffstore_wc_og
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_rollo_schlafzimmer
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_rollo_gast
      - delay: "00:00:03"
      - service: switch.turn_on
        target:
          entity_id: switch.messfahrt_rollo_buro
      # Messfahrt-Flag nach 3 Min zurücksetzen — Covers sind dann fertig gefahren.
      # Der Reset triggert die Tag-Automations (via messfahrt_running -> off),
      # sodass alle Beschattungen aus "offen" zurück in den Tag-Modus gehen.
      - delay: "00:03:00"
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.beschattung_messfahrt_running

  # ----------------------------------------------------------
  # App-Lock Reset täglich um Mitternacht
  # Alle beschattung_lock_<raum> auf off — die App-Sperre gilt nur für den Tag
  # ----------------------------------------------------------
  - id: beschattung_app_lock_reset_taeglich
    alias: "Beschattung – App-Sperren täglich zurücksetzen (Mitternacht)"
    description: >
      Setzt alle App-Sperren (input_boolean.beschattung_lock_<raum>) jede Nacht
      um 00:00 zurück, damit eine Tag-Sperre nicht ungewollt persistiert.
    mode: single
    trigger:
      - platform: time
        at: "00:00:00"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.beschattung_lock_garderobe
            - input_boolean.beschattung_lock_abstellraum
            - input_boolean.beschattung_lock_wc_eg
            - input_boolean.beschattung_lock_kueche
            - input_boolean.beschattung_lock_esszimmer
            - input_boolean.beschattung_lock_wohnzimmer
            - input_boolean.beschattung_lock_terrasse
            - input_boolean.beschattung_lock_wc_og
            - input_boolean.beschattung_lock_badezimmer
            - input_boolean.beschattung_lock_gaestezimmer
            - input_boolean.beschattung_lock_buero
            - input_boolean.beschattung_lock_schlafzimmer
