  - id: wohnkueche_lichtmodus_setzen
    alias: Wohnküche Lichtmodus setzen
    trigger:
    - platform: time
      at: 06:00:00
    - platform: time
      at: '08:00:00'
    - platform: time
      at: '07:00:00'
    - platform: time
      at: '09:00:00'
    - platform: time
      at: '10:00:00'
    - platform: time
      at: '12:00:00'
    - platform: time
      at: '14:00:00'
    - platform: time
      at: '18:00:00'
    - platform: time
      at: '20:00:00'
    - platform: time
      at: '22:00:00'
    - platform: time
      at: '23:00:00'
    condition:
      - condition: state
        entity_id: input_boolean.wohnkueche_override_kochen
        state: 'off'
      - condition: state
        entity_id: input_boolean.wohnkueche_override_tv
        state: 'off'
      - condition: state
        entity_id: input_boolean.wohnkueche_override_szene
        state: 'off'
    action:
    - choose:
      # --- WERKTAG ---
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'on'
        - condition: time
          after: 06:00:00
          before: 08:00:00
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: fruehstueck
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'on'
        - condition: time
          after: '18:00:00'
          before: '20:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: werktag_abend_aktiv
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'on'
        - condition: time
          after: '20:00:00'
          before: '22:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: werktag_relax
      # --- WOCHENENDE ---
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'off'
        - condition: time
          after: '07:00:00'
          before: '10:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: fruehstueck
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'off'
        - condition: time
          after: '10:00:00'
          before: '14:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: wochenende_tag
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'off'
        - condition: time
          after: '14:00:00'
          before: '18:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: wochenende_nachmittag
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'off'
        - condition: time
          after: '18:00:00'
          before: '22:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: wochenende_abend
      # --- BEIDE ---
      - conditions:
        - condition: time
          after: '22:00:00'
          before: '23:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: spaetabend
      - conditions:
        - condition: time
          after: '23:00:00'
          before: 06:00:00
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: nacht
    mode: single
  - id: wohnkueche_licht_master
    alias: Wohnküche Licht – Master
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.praesenzmelder_wohnzimmer
        id: praesenz
      - platform: numeric_state
        entity_id: sensor.helligkeit_sud
        above: input_number.wohnkueche_licht_outdoor_lux
        id: hell_geworden
      - platform: numeric_state
        entity_id: sensor.helligkeit_sud
        below: input_number.wohnkueche_licht_outdoor_lux
        id: dunkel_geworden
    condition:
      - condition: or
        conditions:
          # Präsenz AUS → durchlassen (Lichter aus)
          - condition: and
            conditions:
              - condition: trigger
                id: praesenz
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'off'
          # Präsenz AN + dunkel + keine Overrides → durchlassen (Lichter an)
          - condition: and
            conditions:
              - condition: trigger
                id: praesenz
              - condition: state
                entity_id: input_boolean.wohnkueche_override_kochen
                state: 'off'
              - condition: state
                entity_id: input_boolean.wohnkueche_override_tv
                state: 'off'
              - condition: state
                entity_id: input_boolean.wohnkueche_override_szene
                state: 'off'
              - condition: template
                value_template: >
                  {{ states('sensor.helligkeit_sud') | float(99999)
                     < states('input_number.wohnkueche_licht_outdoor_lux') | float(5000) }}
          # Hell geworden + Präsenz + keine Overrides → durchlassen (Lichter aus)
          - condition: and
            conditions:
              - condition: trigger
                id: hell_geworden
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'on'
              - condition: state
                entity_id: input_boolean.wohnkueche_override_kochen
                state: 'off'
              - condition: state
                entity_id: input_boolean.wohnkueche_override_tv
                state: 'off'
              - condition: state
                entity_id: input_boolean.wohnkueche_override_szene
                state: 'off'
          # Dunkel geworden + Präsenz + keine Overrides → durchlassen (Lichter an)
          - condition: and
            conditions:
              - condition: trigger
                id: dunkel_geworden
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'on'
              - condition: state
                entity_id: input_boolean.wohnkueche_override_kochen
                state: 'off'
              - condition: state
                entity_id: input_boolean.wohnkueche_override_tv
                state: 'off'
              - condition: state
                entity_id: input_boolean.wohnkueche_override_szene
                state: 'off'
    action:
      - choose:
          # Hell geworden → alle Lichter aus
          - conditions:
              - condition: trigger
                id: hell_geworden
            sequence:
              - service: light.turn_off
                target:
                  entity_id:
                    - light.licht_kueche_fenster
                    - light.licht_kueche_fenster_2
                    - light.licht_spuele_kueche
                    - light.licht_vitrine_kueche
                    - light.esszimmer_licht
                    - light.livingroom_main_light
                    - light.livingroom_reading_light
          # Dunkel geworden → aktuellen Modus ausführen
          - conditions:
              - condition: trigger
                id: dunkel_geworden
            sequence:
              - service: script.wohnkueche_lichtmodus_ausfuehren
          # Präsenz-basierte Modi
          - conditions:
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'on'
              - condition: state
                entity_id: input_select.wohnkueche_lichtmodus
                state: fruehstueck
            sequence:
              - service: script.wohnkueche_fruehstueck
          - conditions:
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'on'
              - condition: state
                entity_id: input_select.wohnkueche_lichtmodus
                state: werktag_abend_aktiv
            sequence:
              - service: script.wohnkueche_werktag_abend_aktiv
          - conditions:
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'on'
              - condition: state
                entity_id: input_select.wohnkueche_lichtmodus
                state: werktag_relax
            sequence:
              - service: script.wohnkueche_werktag_relax
          - conditions:
              - condition: state
                entity_id: binary_sensor.praesenzmelder_wohnzimmer
                state: 'on'
              - condition: state
                entity_id: input_select.wohnkueche_lichtmodus
                state: spaetabend
            sequence:
              - service: script.wohnkueche_spaetabend
          - conditions:
