      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.beschattung_gaestezimmer_override
    mode: single

  # ========================
  # BÜRO BLENDSCHUTZ
  # ========================

  # Büro: Blend- und Hitzeschutz bei Sonne Süd
  - id: buero_blendschutz_sonne
    alias: "Büro – Blend-/Hitzeschutz nach Sonnenstand"
    description: >
      Wenn Sonne auf Südfassade trifft, Rollo steuern:
      - Werktag + nicht zuhause → voll zu (Sebastian im Office, max Hitzeschutz/Energie)
      - Werktag + zuhause → NUR Blendschutz (elevation-basiert, NIE voll zu,
        auch bei Hitze nicht — Sebastian arbeitet im Büro und braucht Tageslicht)
      - Wochenende → Hitzeschutz: voll zu wenn >26°C, sonst Blendschutz
      Blendschutz: hoch (>45°): 20% zu, mittel (25-45°): 50% zu, tief (<25°): 80% zu.
      Wird alle 15 Min, bei Sonne-Ein/Aus, Temp-Schwelle und
      Anwesenheits-Wechsel neu bewertet. Manueller Override
      (input_boolean.beschattung_buero_override) hat Vorrang.
    trigger:
      - platform: state
        entity_id: binary_sensor.sonne_trifft_sued
        to: "on"
      - platform: time_pattern
        minutes: "/15"
      - platform: numeric_state
        entity_id: sensor.outdoor_temperature_avg
        above: input_number.beschattung_threshold_hoch
        for:
          minutes: 5
      - platform: numeric_state
        entity_id: sensor.outdoor_temperature_avg
        below: input_number.beschattung_threshold_hoch
        for:
          minutes: 5
      - platform: state
        entity_id: device_tracker.iphone_von_sebastian
        to: "not_home"
        for:
          minutes: 5
      - platform: state
        entity_id: device_tracker.iphone_von_sebastian
        to: "home"
        for:
          minutes: 2
    condition:
      - condition: state
        entity_id: binary_sensor.sonne_trifft_sued
        state: "on"
      - condition: state
        entity_id: binary_sensor.windalarm_schwelle_1
        state: "off"
      - condition: state
        entity_id: input_boolean.beschattung_buero_override
        state: "off"
      - condition: state
        entity_id: input_boolean.beschattung_lock_buero
        state: "off"
    action:
      - choose:
          # Werktag UND nicht zuhause → voll zu (Sebastian im Office)
          - conditions:
              - condition: state
                entity_id: binary_sensor.workday_sensor
                state: "on"
              - condition: state
                entity_id: device_tracker.iphone_von_sebastian
                state: "not_home"
            sequence:
              - service: cover.close_cover
                target:
                  entity_id: cover.office_shutter
          # Werktag UND zuhause → NUR Blendschutz (Sebastian arbeitet im Büro,
          # Hitzeschutz darf NICHT voll schließen)
          - conditions:
              - condition: state
                entity_id: binary_sensor.workday_sensor
                state: "on"
              - condition: state
                entity_id: device_tracker.iphone_von_sebastian
                state: "home"
            sequence:
              - choose:
                  - conditions:
                      - condition: numeric_state
                        entity_id: sun.sun
                        attribute: elevation
                        above: 45
                    sequence:
                      - service: cover.set_cover_position
                        target:
                          entity_id: cover.office_shutter
                        data:
                          position: 80
                  - conditions:
                      - condition: numeric_state
                        entity_id: sun.sun
                        attribute: elevation
                        above: 25
                    sequence:
                      - service: cover.set_cover_position
                        target:
                          entity_id: cover.office_shutter
                        data:
                          position: 50
                default:
                  - service: cover.set_cover_position
                    target:
                      entity_id: cover.office_shutter
                    data:
                      position: 20
          # Wochenende: Hitzeschutz greift (Temp über Schwelle → voll zu)
          - conditions:
              - condition: numeric_state
                entity_id: sensor.outdoor_temperature_avg
                above: input_number.beschattung_threshold_hoch
            sequence:
              - service: cover.close_cover
                target:
                  entity_id: cover.office_shutter
          # Sonne hoch (>45°): leichter Schutz
          - conditions:
              - condition: numeric_state
                entity_id: sun.sun
                attribute: elevation
                above: 45
            sequence:
              - service: cover.set_cover_position
                target:
                  entity_id: cover.office_shutter
                data:
                  position: 80
          # Sonne mittel (25-45°)
          - conditions:
              - condition: numeric_state
                entity_id: sun.sun
                attribute: elevation
                above: 25
            sequence:
              - service: cover.set_cover_position
                target:
                  entity_id: cover.office_shutter
                data:
                  position: 50
        # Sonne tief (<25°): starker Schutz
        default:
          - service: cover.set_cover_position
            target:
              entity_id: cover.office_shutter
            data:
              position: 20
    mode: single

  # Büro: Blendschutz Ende – Sonne weg
  - id: buero_blendschutz_ende
    alias: "Büro – Blendschutz Ende"
    description: >
      Wenn Sonne Südfassade verlässt, Rollo wieder öffnen.
      Re-Evaluation alle 15 Min und bei HA-Start, damit Rollo auch
      bei bewölktem Wetter tagsüber geöffnet bleibt/wird.
    trigger:
      - platform: state
        entity_id: binary_sensor.sonne_trifft_sued
        to: "off"
      - platform: time_pattern
        minutes: "/15"
      - platform: homeassistant
        event: start
    condition:
      - condition: numeric_state
        entity_id: sun.sun
        attribute: elevation
        above: 0
      - condition: state
        entity_id: binary_sensor.sonne_trifft_sued
        state: "off"
      - condition: state
        entity_id: input_boolean.beschattung_lock_buero
        state: "off"
    action:
      - service: cover.open_cover
        target:
          entity_id: cover.office_shutter
    mode: single

  # ========================
  # GÄSTEZIMMER + SCHLAFZIMMER (Rollos, sonnenbasiert)
  # ========================

  # Gästezimmer (Süd): Rollo zu wenn Sonne auf Süd trifft
  - id: gaestezimmer_sonne_zu
    alias: "Gästezimmer – Rollo zu bei Sonne Süd"
    description: >
      Gästezimmer liegt auf der Südseite. Rollo schließen wenn
      Sonne auf Südfassade trifft.
    trigger:
      - platform: state
        entity_id: binary_sensor.sonne_trifft_sued
        to: "on"
    condition:
      - condition: state
        entity_id: input_boolean.beschattung_gaestezimmer_override
        state: "off"
      - condition: state
        entity_id: input_boolean.beschattung_lock_gaestezimmer
        state: "off"
    action:
      - service: cover.close_cover
        target:
          entity_id: cover.guest_shutter
    mode: single

  # Gästezimmer (Süd): Rollo zu bei Hitze + Sonne
  - id: gaestezimmer_hitze_zu
    alias: "Gästezimmer – Rollo zu bei Hitze + Sonne"
    description: >
      Gästezimmer Rollo schließen wenn Temperatur über Schwelle steigt
      und Sonne tatsächlich auf Südfassade trifft (Azimut + Lux + Temp).
    trigger:
      - platform: numeric_state
        entity_id: sensor.outdoor_temperature_avg
        above: input_number.beschattung_threshold_niedrig
        for:
          minutes: 10
    condition:
      - condition: state
        entity_id: binary_sensor.sonne_trifft_sued
        state: "on"
      - condition: state
        entity_id: input_boolean.beschattung_gaestezimmer_override
        state: "off"
      - condition: state
        entity_id: input_boolean.beschattung_lock_gaestezimmer
        state: "off"
    action:
      - service: cover.close_cover
        target:
          entity_id: cover.guest_shutter
    mode: single

  # Gästezimmer (Süd): Rollo auf wenn Sonne weg
  - id: gaestezimmer_sonne_auf
    alias: "Gästezimmer – Rollo auf wenn Sonne weg"
    description: >
      Gästezimmer Rollo öffnen wenn Sonne die Südfassade verlässt
      oder Helligkeit sinkt (bewölkt).
    trigger:
      - platform: state
        entity_id: binary_sensor.sonne_trifft_sued
        to: "off"
      - platform: numeric_state
        entity_id: sensor.helligkeit_sud
        below: input_number.beschattung_lux_sud
        for:
          minutes: 10
      - platform: time_pattern
        minutes: "/15"
      - platform: homeassistant
        event: start
    condition:
      - condition: numeric_state
        entity_id: sun.sun
        attribute: elevation
        above: 0
      - condition: state
        entity_id: binary_sensor.sonne_trifft_sued
        state: "off"
      - condition: numeric_state
        entity_id: sensor.helligkeit_sud
        below: input_number.beschattung_lux_sud
      - condition: state
        entity_id: input_boolean.beschattung_lock_gaestezimmer
        state: "off"
    action:
      - service: cover.open_cover
        target:
          entity_id: cover.guest_shutter
    mode: single

  # Schlafzimmer (Nord): Rollo zu wenn Sonne auf Nord trifft
  - id: schlafzimmer_sonne_zu
    alias: "Schlafzimmer – Rollo zu bei Sonne Nord"
    description: >
      Schlafzimmer liegt auf der Nordseite. Rollo schließen wenn
      Sonne auf Nordfassade trifft.
    trigger:
      - platform: state
        entity_id: binary_sensor.sonne_trifft_nord
        to: "on"
    condition:
      - condition: state
        entity_id: input_boolean.beschattung_schlafzimmer_override
        state: "off"
      - condition: state
        entity_id: input_boolean.beschattung_lock_schlafzimmer
        state: "off"
    action:
      - service: cover.close_cover
        target:
          entity_id: cover.bedroom_shutter
    mode: single

  # Schlafzimmer (Nord): Rollo zu bei Hitze + Sonne
  - id: schlafzimmer_hitze_zu
    alias: "Schlafzimmer – Rollo zu bei Hitze + Sonne"
    description: >
      Schlafzimmer Rollo schließen wenn Temperatur über Schwelle steigt
      und Sonne tatsächlich auf Nordfassade trifft (Azimut + Lux + Temp).
    trigger:
      - platform: numeric_state
        entity_id: sensor.outdoor_temperature_avg
        above: input_number.beschattung_threshold_niedrig
        for:
          minutes: 10
    condition:
      - condition: state
        entity_id: binary_sensor.sonne_trifft_nord
        state: "on"
      - condition: state
        entity_id: input_boolean.beschattung_schlafzimmer_override
        state: "off"
      - condition: state
        entity_id: input_boolean.beschattung_lock_schlafzimmer
        state: "off"
    action:
      - service: cover.close_cover
        target:
          entity_id: cover.bedroom_shutter
    mode: single

  # Schlafzimmer (Nord): Rollo auf wenn Sonne weg
  - id: schlafzimmer_sonne_auf
    alias: "Schlafzimmer – Rollo auf wenn Sonne weg + kühl"
    description: >
      Schlafzimmer Rollo öffnen wenn Sonne die Nordfassade verlässt
      oder Helligkeit sinkt (bewölkt).
    trigger:
      - platform: state
        entity_id: binary_sensor.sonne_trifft_nord
        to: "off"
      - platform: numeric_state
        entity_id: sensor.helligkeit_nord
        below: input_number.beschattung_lux_nord
        for:
          minutes: 10
      - platform: time_pattern
        minutes: "/15"
      - platform: homeassistant
        event: start
    condition:
      - condition: numeric_state
        entity_id: sun.sun
        attribute: elevation
        above: 0
      - condition: state
        entity_id: binary_sensor.sonne_trifft_nord
        state: "off"
      - condition: numeric_state
        entity_id: sensor.helligkeit_nord
        below: input_number.beschattung_lux_nord
      - condition: state
        entity_id: input_boolean.beschattung_lock_schlafzimmer
        state: "off"
      - condition: template
        value_template: >
          {% if is_state('binary_sensor.workday_sensor', 'on') %}
            {{ now() >= today_at('07:00') }}
          {% else %}
            {{ now() >= today_at('10:00') }}
          {% endif %}
    action:
      - service: cover.open_cover
        target:
          entity_id: cover.bedroom_shutter
    mode: single

  - id: messfahrt_starten
    alias: Messfahrt alle Raffstores 2-wöchentlich
    trigger:
      - platform: time
        at: "08:00:00"

    condition:
      # nur Werktage
      - condition: time
        weekday:
          - mon
          - tue
          - wed
          - thu
          - fri

      # nur alle 2 Wochen (ISO-Kalenderwoche gerade)
      - condition: template
        value_template: "{{ (now().isocalendar().week % 2) == 0 }}"

      # nur wenn niemand zuhause (Hitzeschutz greift dann auch noch nicht)
      - condition: state
        entity_id: device_tracker.iphone_von_sebastian
        state: "not_home"

    action:
      - service: notify.mobile_app_iphone_von_sebastian
        data:
          title: Beschattung – Messfahrt
          message: "Messfahrt aller Raffstores startet jetzt (ca. 35 s)."
      - service: script.messfahrt_alle

    mode: single