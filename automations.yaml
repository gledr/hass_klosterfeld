  - id: wohnkueche_lichtmodus_setzen
    alias: Wohnküche Lichtmodus setzen
    trigger:
    - platform: time
      at: 06:00:00
    - platform: time
      at: '08:00:00'
    - platform: time
      at: '12:00:00'
    - platform: time
      at: '14:00:00'
    - platform: time
      at: '18:00:00'
    - platform: time
      at: '20:00:00'
    - platform: time
      at: '22:00:00'
    - platform: time
      at: '23:00:00'
    condition:
      - condition: state
        entity_id: input_boolean.wohnkueche_override_kochen
        state: 'off'
      - condition: state
        entity_id: input_boolean.wohnkueche_override_tv
        state: 'off'
      - condition: state
        entity_id: input_boolean.wohnkueche_override_szene
        state: 'off'
    action:
    - choose:
      # --- WERKTAG ---
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'on'
        - condition: time
          after: 06:00:00
          before: 08:00:00
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: fruehstueck
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'on'
        - condition: time
          after: '18:00:00'
          before: '20:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: werktag_abend_aktiv
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'on'
        - condition: time
          after: '20:00:00'
          before: '22:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: werktag_relax
      # --- WOCHENENDE ---
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'off'
        - condition: time
          after: '08:00:00'
          before: '12:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: fruehstueck
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'off'
        - condition: time
          after: '12:00:00'
          before: '14:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: wochenende_tag
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'off'
        - condition: time
          after: '14:00:00'
          before: '18:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: wochenende_nachmittag
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'off'
        - condition: time
          after: '18:00:00'
          before: '20:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: werktag_abend_aktiv
      - conditions:
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'off'
        - condition: time
          after: '20:00:00'
          before: '22:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: wochenende_abend
      # --- BEIDE ---
      - conditions:
        - condition: time
          after: '22:00:00'
          before: '23:00:00'
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: spaetabend
      - conditions:
        - condition: time
          after: '23:00:00'
          before: 06:00:00
        sequence:
        - service: input_select.select_option
          data:
            entity_id: input_select.wohnkueche_lichtmodus
            option: nacht
    mode: single
  - id: wohnkueche_licht_master
    alias: Wohnküche Licht – Master
    mode: restart
    trigger:
      - platform: state
