              entity_id:
                - cover.kitchen_blinds
            data:
              tilt_position: 50
          - service: cover.open_cover
            target:
              entity_id:
                - cover.raffstore_kueche
      # Esszimmer: Sichtschutz – nur Lamellen öffnen
      - if:
          - condition: state
            entity_id: input_boolean.beschattung_lock_esszimmer
            state: "off"
        then:
          - service: cover.set_cover_tilt_position
            target:
              entity_id:
                - cover.dining_blinds
            data:
              tilt_position: 50
    mode: single

  # B6: West Hitzeschutz Eskalation – Temp steigt über 26°C während Sonne West trifft
