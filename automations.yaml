      - service: cover.set_cover_position
        target:
          entity_id: cover.bathroom_blinds
        data:
          position: 0
      - delay: "00:00:03"
      - service: cover.set_cover_tilt_position
        target:
          entity_id: cover.bathroom_blinds
        data:
          tilt_position: 0
    mode: single

  - id: beschattung_badezimmer_hitze
    alias: "Badezimmer – Hitzeschutz (Lamellen zu)"
    trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/15"
      - platform: state
        entity_id: binary_sensor.sonne_trifft_nord
        to: "on"
    condition:
      - condition: state
        entity_id: binary_sensor.sonne_trifft_nord
        state: "on"
      - condition: state
        entity_id: input_boolean.beschattung_lock_badezimmer
        state: "off"
      - condition: state
        entity_id: binary_sensor.windalarm_schwelle_1
        state: "off"
      - condition: state
        entity_id: input_boolean.badezimmer_privacy_active
        state: "off"
      - condition: state
        entity_id: switch.twilight
        state: "on"
    action:
      - variables:
          tilt_before: "{{ state_attr('cover.bathroom_blinds', 'current_tilt_position') | int(default=-1) }}"
      # Hitzeschutz: Raffstore erst ausfahren (unten), dann Lamellen stellen.
      - service: cover.set_cover_position
        target:
          entity_id: cover.bathroom_blinds
        data:
          position: 0
      # Warten bis Behang wirklich unten ist (Raffstore-Fahrzeit), sonst
      # unterbricht der Tilt-Befehl die Fahrt. Fallback nach Timeout.
      - wait_template: "{{ state_attr('cover.bathroom_blinds', 'current_position') | int(default=0) <= 2 }}"
        timeout: "00:01:30"
        continue_on_timeout: true
      - service: cover.set_cover_tilt_position
        target:
          entity_id: cover.bathroom_blinds
        data:
          tilt_position: 0
      - condition: template
        value_template: "{{ tilt_before != 0 }}"
      - service: notify.mobile_app_iphone_von_sebastian
        data:
          title: "Badezimmer – Hitzeschutz aktiv"
          message: "Lamellen auf 0 % gefahren (war {{ tilt_before }} %). Sonne trifft Nord."
    mode: single

