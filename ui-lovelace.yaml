###############################################################################
# ÜBERSICHT — Landing page                                                     #
#                                                                              #
# Reihenfolge ist bewusst: Alarme → Aktionen → Außen → Navigation. Am Handy     #
# fällt alles auf eine Spalte zusammen; die Knöpfe, die man tatsächlich         #
# drückt, sollen nicht hinter Wetter und Anwesenheit liegen.                    #
#                                                                              #
# Badges: Außen/Wind/Sebastian immer, der Rest nur, wenn er etwas zu sagen      #
# hat (visibility) — "0 offen" ist keine Information.                          #
###############################################################################
title: Klosterfeld
views:
  - title: Übersicht
    path: home
    icon: mdi:home
    type: sections
    max_columns: 4

    badges:
      - type: entity
        entity: sensor.outdoor_temperature
        name: Außen
      - type: entity
        entity: sensor.wind_speed
        name: Wind
      - type: entity
        entity: device_tracker.iphone_von_sebastian
        name: Sebastian
      - type: entity
        entity: sensor.lichter_an
        name: Lichter an
        tap_action:
          action: navigate
          navigation_path: /lovelace-raeume/eg
        visibility:
          - condition: numeric_state
            entity: sensor.lichter_an
            above: 0
      - type: entity
        entity: sensor.offene_oeffnungen
        name: Offen
        visibility:
          - condition: numeric_state
            entity: sensor.offene_oeffnungen
            above: 0
      - type: entity
        entity: sensor.beschattung_blocker
        name: Beschattung blockiert
        visibility:
          - condition: numeric_state
            entity: sensor.beschattung_blocker
            above: 0

    sections:

      ###########################################################################
      # ALERT BAR — alles conditional / auto-entities, rendert im Normalfall   #
      # nichts. Die Überschrift ist ebenfalls nur sichtbar, wenn etwas ansteht #
      # (sonst stand dort ein leeres "Achtung").                               #
      ###########################################################################
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Achtung
            heading_style: title
            icon: mdi:alert
            visibility:
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity: sensor.offene_oeffnungen
                    above: 0
                  - condition: numeric_state
                    entity: sensor.beschattung_blocker
                    above: 0
                  - condition: state
                    entity: binary_sensor.windalarm_schwelle_1
                    state: "on"
                  - condition: state
                    entity: input_boolean.badezimmer_privacy_active
                    state: "on"
                  - condition: state
                    entity: input_boolean.gast_modus_wohnkueche
                    state: "on"

          # Rauchmelder ausgelöst
          - type: custom:auto-entities
            card:
              type: entities
              title: 🚨 Rauchalarm aktiv
              state_color: true
            filter:
              include:
                - domain: binary_sensor
                  attributes:
                    device_class: smoke
                  state: "on"
            show_empty: false

          # Offene Fenster / Türen — aus der einen Quelle der Wahrheit
          # (sensor.offene_oeffnungen, template.yaml).
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.offene_oeffnungen
                above: 0
            card:
              type: custom:mushroom-template-card
              primary: >
                🪟 {{ states('sensor.offene_oeffnungen') }} Fenster / Türen offen
              secondary: "{{ state_attr('sensor.offene_oeffnungen', 'namen') }}"
              icon: mdi:window-open-variant
              icon_color: amber
              multiline_secondary: true
              tap_action:
                action: navigate
                navigation_path: /lovelace-sicherheit/home
            grid_options:
              columns: 6

          # Windalarm aktiv
          - type: custom:auto-entities
            card:
              type: entities
              title: 💨 Windalarm
              state_color: true
            filter:
              include:
                - entity_id: binary_sensor.*wind_alarm*
                  state: "on"
                - entity_id: binary_sensor.windalarm_schwelle_*
                  state: "on"
            show_empty: false

          # Beschattungs-Sperren
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.beschattung_blocker
                above: 0
            card:
              type: custom:mushroom-template-card
              primary: >
                ⚙️ {{ states('sensor.beschattung_blocker') }} Beschattung(en) blockiert
              secondary: "{{ state_attr('sensor.beschattung_blocker', 'namen') }}"
              icon: mdi:hand-back-right-off
              icon_color: amber
              multiline_secondary: true
              tap_action:
                action: navigate
                navigation_path: /lovelace-beschattung/home
            grid_options:
              columns: 6

          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.badezimmer_privacy_active
                state: "on"
            card:
              type: custom:mushroom-template-card
              entity: input_boolean.badezimmer_privacy_active
              primary: Badezimmer Privacy aktiv
              secondary: Beschattung Bad bleibt stehen · antippen zum Lösen
              icon: mdi:eye-off
              icon_color: purple
              tap_action:
                action: toggle
            grid_options:
              columns: 6

          # Gästemodus hat kein Auto-Reset → hier erinnern, damit er nicht
          # tagelang den Präsenzmelder abschaltet.
          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.gast_modus_wohnkueche
                state: "on"
            card:
              type: custom:mushroom-template-card
              entity: input_boolean.gast_modus_wohnkueche
              primary: Gästemodus Wohnküche an
              secondary: Präsenzmelder schaltet kein Licht · Raffstores erst 10:00 · antippen zum Beenden
              icon: mdi:sofa
              icon_color: purple
              multiline_secondary: true
              tap_action:
                action: toggle
              hold_action:
                action: none
            grid_options:
              columns: 6

      ###########################################################################
      # SCHNELL-AKTIONEN                                                        #
      # Fahren direkt → die Beschattung liest das als Hand-Bedienung und lässt  #
      # die Räume danach 1 h in Ruhe (Terrasse 2 h, Büro bis Tag/Nacht).        #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Schnell-Aktionen
            icon: mdi:gesture-tap-button

          # Rollos = Position (3 Stück). Raffstore = Lamellen: die stehen laut
          # Konvergenz dauerhaft auf Position 0, "Behang hoch" hat deshalb
          # gegen die Automation gearbeitet.
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Rollos hoch
                secondary: Schlafz. · Büro · Gast
                icon: mdi:arrow-up-bold-box
                icon_color: amber
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_position
                  data:
                    position: 100
                  target:
                    entity_id:
                      - cover.bedroom_shutter
                      - cover.office_shutter
                      - cover.guest_shutter
              - type: custom:mushroom-template-card
                primary: Lamellen auf
                secondary: alle Raffstore
                icon: mdi:blinds-horizontal
                icon_color: amber
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_tilt_position
                  data:
                    tilt_position: 100
                  target:
                    entity_id:
                      - cover.wardrobe_blinds
                      - cover.shelf_blinds
                      - cover.wc_eg_blinds
                      - cover.wc_og_blinds
                      - cover.bathroom_blinds
                      - cover.livingroom_blinds
                      - cover.kitchen_blinds
                      - cover.dining_blinds
                      - cover.terrace_blinds_2
              - type: custom:mushroom-template-card
                primary: Wohnküche aus
                secondary: alle Lichter
                icon: mdi:lightbulb-off
                icon_color: grey
                layout: vertical
                tap_action:
                  action: call-service
                  service: script.wohnkueche_alles_aus
              - type: custom:mushroom-template-card
                primary: Rollos runter
                secondary: Schlafz. · Büro · Gast
                icon: mdi:arrow-down-bold-box
                icon_color: indigo
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_position
                  data:
                    position: 0
                  target:
                    entity_id:
                      - cover.bedroom_shutter
                      - cover.office_shutter
                      - cover.guest_shutter
                  confirmation:
                    text: Alle drei Rollos komplett schließen?
              - type: custom:mushroom-template-card
                primary: Lamellen zu
                secondary: alle Raffstore
                icon: mdi:blinds-horizontal-closed
                icon_color: indigo
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_tilt_position
                  data:
                    tilt_position: 0
                  target:
                    entity_id:
                      - cover.wardrobe_blinds
                      - cover.shelf_blinds
                      - cover.wc_eg_blinds
                      - cover.wc_og_blinds
                      - cover.bathroom_blinds
                      - cover.livingroom_blinds
                      - cover.kitchen_blinds
                      - cover.dining_blinds
                      - cover.terrace_blinds_2
              - type: custom:mushroom-template-card
                entity: input_boolean.gast_modus_wohnkueche
                primary: Gästemodus
                secondary: "{% if is_state('input_boolean.gast_modus_wohnkueche', 'on') %}an{% else %}aus{% endif %}"
                icon: mdi:sofa
                icon_color: "{% if is_state('input_boolean.gast_modus_wohnkueche', 'on') %}purple{% else %}disabled{% endif %}"
                layout: vertical
                tap_action:
                  action: toggle

      ###########################################################################
      # AUSSEN                                                                  #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Außen
            icon: mdi:weather-partly-cloudy

          - type: weather-forecast
            entity: weather.forecast_home
            show_current: true
            show_forecast: false

          - type: custom:mini-graph-card
            name: Außentemperatur 24 h
            entities:
              - entity: sensor.outdoor_temperature
                name: Temp
            hours_to_show: 24
            points_per_hour: 2
            line_width: 2
            show:
              labels: true
              extrema: true

      ###########################################################################
      # NAVIGATION — dupliziert die Sidebar bewusst (am Handy eingeklappt).     #
      # Stockwerke springen direkt in den passenden Tab von "Räume".            #
      ###########################################################################
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Bereiche
            icon: mdi:view-dashboard

          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Beschattung
                secondary: >
                  {% set b = states('sensor.beschattung_blocker') | int(0) %}
                  {% if b > 0 %}{{ b }} blockiert
                  {% elif is_state('binary_sensor.sonne_trifft_sued', 'on')
                       or is_state('binary_sensor.sonne_trifft_west', 'on')
                       or is_state('binary_sensor.sonne_trifft_nord', 'on') %}Sonne auf Fassade
                  {% else %}Automatik läuft{% endif %}
                icon: mdi:blinds-horizontal
                icon_color: "{% if states('sensor.beschattung_blocker') | int(0) > 0 %}amber{% elif is_state('binary_sensor.sonne_trifft_sued', 'on') or is_state('binary_sensor.sonne_trifft_west', 'on') %}orange{% else %}grey{% endif %}"
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-beschattung/home

              - type: custom:mushroom-template-card
                primary: Sicherheit
                secondary: >
                  {% set smoke = states.binary_sensor | selectattr('attributes.device_class', 'eq', 'smoke') | selectattr('state', 'eq', 'on') | list | count %}
                  {% set offen = states('sensor.offene_oeffnungen') | int(0) %}
                  {% if smoke > 0 %}🚨 {{ smoke }} Rauchalarm
                  {% elif offen > 0 %}🪟 {{ offen }} offen
                  {% else %}Alles ruhig{% endif %}
                icon: mdi:shield-home
                icon_color: "{% set smoke = states.binary_sensor | selectattr('attributes.device_class', 'eq', 'smoke') | selectattr('state', 'eq', 'on') | list | count %}{% if smoke > 0 %}red{% elif states('sensor.offene_oeffnungen') | int(0) > 0 %}amber{% else %}green{% endif %}"
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-sicherheit/home

              - type: custom:mushroom-template-card
                primary: Klima
                secondary: "Heizung · Lüften"
                icon: mdi:home-thermometer
                icon_color: blue
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-klima/home

              - type: custom:mushroom-template-card
                primary: Energie
                secondary: "{{ states('sensor.leistung_bezug_gesamt') | int(0) }} W"
                icon: mdi:lightning-bolt
                icon_color: yellow
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-energie/home

              - type: custom:mushroom-template-card
                primary: Erdgeschoss
                icon: mdi:home-floor-g
                icon_color: teal
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-raeume/eg
              - type: custom:mushroom-template-card
                primary: Obergeschoss
                icon: mdi:home-roof
                icon_color: teal
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-raeume/og
              - type: custom:mushroom-template-card
                primary: Keller
                secondary: Licht · Lüften
                icon: mdi:home-floor-b
                icon_color: teal
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-raeume/keller
              - type: custom:mushroom-template-card
                primary: Außen
                secondary: Garage · Terrasse
                icon: mdi:tree
                icon_color: green
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-raeume/aussen
