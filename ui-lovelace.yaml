###############################################################################
# ÜBERSICHT — Landing page                                                     #
# Loaded as the main dashboard (lovelace.mode: yaml in configuration.yaml).    #
#                                                                              #
# Reihenfolge ist bewusst: Alarme → Aktionen → Status → Navigation. Am Handy    #
# fällt alles auf eine Spalte zusammen; die Knöpfe, die man tatsächlich         #
# drückt, sollen nicht hinter Wetter und Anwesenheit liegen.                    #
###############################################################################
title: Klosterfeld
views:
  - title: Übersicht
    path: home
    icon: mdi:home
    type: sections
    max_columns: 4

    # Die Zahlen, für die man vorher scrollen musste.
    badges:
      - type: entity
        entity: sensor.outdoor_temperature
        name: Außen
      - type: entity
        entity: sensor.wind_speed
        name: Wind
      - type: entity
        entity: sensor.offene_oeffnungen
        name: Offen
      - type: entity
        entity: sensor.beschattung_blocker
        name: Beschattung blockiert
      - type: entity
        entity: device_tracker.iphone_von_sebastian
        name: Sebastian

    sections:

      ###########################################################################
      # ALERT BAR — auto-entities filters render nothing when state is clean.   #
      ###########################################################################
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Achtung
            heading_style: title
            icon: mdi:alert

          # Rauchmelder ausgelöst
          - type: custom:auto-entities
            card:
              type: entities
              title: 🚨 Rauchalarm aktiv
              state_color: true
            filter:
              include:
                - domain: binary_sensor
                  attributes:
                    device_class: smoke
                  state: "on"
            show_empty: false

          # Offene Fenster / Türen — eine Karte, gefüttert aus der einen
          # Quelle der Wahrheit (sensor.offene_oeffnungen, template.yaml).
          # Vorher lief hier ein eigenes Glob-Filter, das die Shelly-Blu-
          # Kontakte doppelt matchte und mühsam ausgeschlossen werden musste.
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.offene_oeffnungen
                above: 0
            card:
              type: custom:mushroom-template-card
              primary: >
                🪟 {{ states('sensor.offene_oeffnungen') }} Fenster / Türen offen
              secondary: "{{ state_attr('sensor.offene_oeffnungen', 'namen') }}"
              icon: mdi:window-open-variant
              icon_color: amber
              multiline_secondary: true
              tap_action:
                action: navigate
                navigation_path: /lovelace-sicherheit/home

          # Windalarm aktiv
          - type: custom:auto-entities
            card:
              type: entities
              title: 💨 Windalarm
              state_color: true
            filter:
              include:
                - entity_id: binary_sensor.*wind_alarm*
                  state: "on"
                - entity_id: binary_sensor.windalarm_schwelle_*
                  state: "on"
            show_empty: false

          # Beschattungs-Sperren / Privacy
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.beschattung_blocker
                above: 0
            card:
              type: custom:mushroom-template-card
              primary: >
                ⚙️ {{ states('sensor.beschattung_blocker') }} Beschattung(en) blockiert
              secondary: "{{ state_attr('sensor.beschattung_blocker', 'namen') }}"
              icon: mdi:hand-back-right-off
              icon_color: amber
              multiline_secondary: true
              tap_action:
                action: navigate
                navigation_path: /lovelace-beschattung/home

          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.badezimmer_privacy_active
                state: "on"
            card:
              type: custom:mushroom-template-card
              primary: Badezimmer Privacy aktiv
              secondary: Beschattung Bad bleibt stehen
              icon: mdi:eye-off
              icon_color: purple
              tap_action:
                action: toggle
              entity: input_boolean.badezimmer_privacy_active

      ###########################################################################
      # SCHNELL-AKTIONEN — direkt unter den Alarmen, nicht am Seitenende        #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Schnell-Aktionen
            icon: mdi:gesture-tap-button

          # Rollos = Position (3 Stück). Raffstore = Lamellen: die stehen laut
          # Konvergenz dauerhaft auf Position 0, "Behang hoch" hat deshalb
          # gegen die Automation gearbeitet.
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Rollos hoch
                secondary: Schlafz. · Büro · Gast
                icon: mdi:arrow-up-bold-box
                icon_color: amber
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_position
                  data:
                    position: 100
                  target:
                    entity_id:
                      - cover.bedroom_shutter
                      - cover.office_shutter
                      - cover.guest_shutter
              - type: custom:mushroom-template-card
                primary: Rollos runter
                secondary: Schlafz. · Büro · Gast
                icon: mdi:arrow-down-bold-box
                icon_color: indigo
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_position
                  data:
                    position: 0
                  target:
                    entity_id:
                      - cover.bedroom_shutter
                      - cover.office_shutter
                      - cover.guest_shutter
                  confirmation:
                    text: Alle drei Rollos komplett schließen?

              - type: custom:mushroom-template-card
                primary: Lamellen auf
                secondary: alle Raffstore
                icon: mdi:blinds-horizontal
                icon_color: amber
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_tilt_position
                  data:
                    tilt_position: 100
                  target:
                    entity_id:
                      - cover.wardrobe_blinds
                      - cover.shelf_blinds
                      - cover.wc_eg_blinds
                      - cover.wc_og_blinds
                      - cover.bathroom_blinds
                      - cover.livingroom_blinds
                      - cover.kitchen_blinds
                      - cover.dining_blinds
                      - cover.terrace_blinds_2
              - type: custom:mushroom-template-card
                primary: Lamellen zu
                secondary: alle Raffstore
                icon: mdi:blinds-horizontal-closed
                icon_color: indigo
                layout: vertical
                tap_action:
                  action: call-service
                  service: cover.set_cover_tilt_position
                  data:
                    tilt_position: 0
                  target:
                    entity_id:
                      - cover.wardrobe_blinds
                      - cover.shelf_blinds
                      - cover.wc_eg_blinds
                      - cover.wc_og_blinds
                      - cover.bathroom_blinds
                      - cover.livingroom_blinds
                      - cover.kitchen_blinds
                      - cover.dining_blinds
                      - cover.terrace_blinds_2

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Wohnküche aus
                icon: mdi:lightbulb-off
                icon_color: grey
                layout: vertical
                tap_action:
                  action: call-service
                  service: script.wohnkueche_alles_aus
              - type: custom:mushroom-template-card
                primary: Messfahrt
                secondary: Alle Raffstore
                icon: mdi:cog-refresh
                icon_color: orange
                layout: vertical
                tap_action:
                  action: call-service
                  service: script.messfahrt_alle
                  confirmation:
                    text: Messfahrt starten? Alle Raffstore fahren komplett auf und zu.

          - type: markdown
            content: >
              Diese Knöpfe fahren direkt — die Beschattungs-Automation liest das
              als Hand-Bedienung und lässt die Räume danach 1 h in Ruhe.

      ###########################################################################
      # WETTER / AUSSEN                                                         #
      ###########################################################################
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Außen
            icon: mdi:weather-partly-cloudy

          - type: custom:mushroom-chips-card
            chips:
              - type: weather
                entity: weather.forecast_home
                show_conditions: true
                show_temperature: true
              - type: entity
                entity: sensor.outdoor_temperature
                icon: mdi:thermometer
                name: Außen
              - type: entity
                entity: sensor.wind_speed
                icon: mdi:weather-windy
                name: Wind
              - type: entity
                entity: sun.sun
                icon: mdi:white-balance-sunny

          - type: custom:mini-graph-card
            name: Außentemperatur 24h
            entities:
              - entity: sensor.outdoor_temperature
                name: Temp
            hours_to_show: 24
            points_per_hour: 2
            line_width: 2
            show:
              labels: true
              extrema: true

          - type: custom:mushroom-template-card
            entity: device_tracker.iphone_von_sebastian
            primary: Sebastian
            secondary: >
              {% if is_state('device_tracker.iphone_von_sebastian', 'home') %}
                Zuhause
              {% elif is_state('device_tracker.iphone_von_sebastian', 'not_home') %}
                Unterwegs
              {% else %}
                {{ states('device_tracker.iphone_von_sebastian') }}
              {% endif %}
            icon: >
              {% if is_state('device_tracker.iphone_von_sebastian', 'home') %}
                mdi:home-account
              {% else %}
                mdi:account-arrow-right
              {% endif %}
            icon_color: >
              {% if is_state('device_tracker.iphone_von_sebastian', 'home') %}
                green
              {% else %}
                grey
              {% endif %}
            tap_action:
              action: more-info

      ###########################################################################
      # NAVIGATION ZU UNTER-DASHBOARDS                                          #
      # Dupliziert die Sidebar bewusst — am Handy ist die Sidebar eingeklappt.  #
      ###########################################################################
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Bereiche
            icon: mdi:view-dashboard

          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Beschattung
                secondary: >
                  {% set b = states('sensor.beschattung_blocker') | int(0) %}
                  {% if b > 0 %}{{ b }} blockiert
                  {% elif is_state('binary_sensor.sonne_trifft_sued', 'on')
                       or is_state('binary_sensor.sonne_trifft_west', 'on')
                       or is_state('binary_sensor.sonne_trifft_nord', 'on') %}Sonne auf Fassade
                  {% else %}Automatik läuft{% endif %}
                icon: mdi:blinds-horizontal
                icon_color: |
                  {% if states('sensor.beschattung_blocker') | int(0) > 0 %}
                    amber
                  {% elif is_state('binary_sensor.sonne_trifft_sued', 'on')
                     or is_state('binary_sensor.sonne_trifft_west', 'on') %}
                    orange
                  {% else %}
                    grey
                  {% endif %}
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-beschattung/home

              - type: custom:mushroom-template-card
                primary: Sicherheit
                secondary: >
                  {% set smoke = expand(states.binary_sensor) | selectattr('attributes.device_class','eq','smoke') | selectattr('state','eq','on') | list | count %}
                  {% set offen = states('sensor.offene_oeffnungen') | int(0) %}
                  {% if smoke > 0 %}🚨 {{ smoke }} Rauchalarm
                  {% elif offen > 0 %}🪟 {{ offen }} offen
                  {% else %}Alles ruhig{% endif %}
                icon: mdi:shield-home
                icon_color: |
                  {% set smoke = expand(states.binary_sensor) | selectattr('attributes.device_class','eq','smoke') | selectattr('state','eq','on') | list | count %}
                  {% if smoke > 0 %}red
                  {% elif states('sensor.offene_oeffnungen') | int(0) > 0 %}amber
                  {% else %}green{% endif %}
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-sicherheit/home

              - type: custom:mushroom-template-card
                primary: Klima
                secondary: "Außen {{ states('sensor.outdoor_temperature') }} °C"
                icon: mdi:home-thermometer
                icon_color: blue
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-klima/home

              - type: custom:mushroom-template-card
                primary: Energie
                secondary: "{{ states('sensor.leistung_bezug_gesamt') | int(0) }} W"
                icon: mdi:lightning-bolt
                icon_color: yellow
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-energie/home

          - type: grid
            columns: 5
            square: false
            cards:
              - type: custom:mushroom-template-card
                primary: Erdgeschoss
                icon: mdi:home-floor-g
                icon_color: teal
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-erdgeschoss/home
              - type: custom:mushroom-template-card
                primary: Obergeschoss
                icon: mdi:home-roof
                icon_color: teal
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-obergeschoss/home
              - type: custom:mushroom-template-card
                primary: Keller
                secondary: Licht · Lüften
                icon: mdi:home-floor-b
                icon_color: teal
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-keller/home
              - type: custom:mushroom-template-card
                primary: Aussen
                secondary: Garage · Terrasse
                icon: mdi:tree
                icon_color: green
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-aussen/home
              # Lüften deckt zusätzlich Schlafzimmer + Garage ab, deshalb neben
              # dem Keller-Dashboard weiter eigenständig erreichbar.
              - type: custom:mushroom-template-card
                primary: Lüften
                secondary: alle Räume
                icon: mdi:hvac
                icon_color: cyan
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-luften/home
