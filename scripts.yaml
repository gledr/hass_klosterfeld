#########################################################
# WOHNKÜCHE – LICHTMODI (SCRIPT-BASIERT)
# Präsenz + Zeit + Werktag steuern diese Scripts
# Erweiterbar um Beschattung, Musik, Heizung
#########################################################

#########################################################
# LICHTMODUS AUSFÜHREN – führt den aktuellen input_select aus
# Wird von Overrides und Reset verwendet
#########################################################
wohnkueche_lichtmodus_ausfuehren:
  alias: Wohnküche – Aktuellen Lichtmodus ausführen
  mode: restart
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.wohnkueche_lichtmodus
              state: fruehstueck
          sequence:
            - service: script.wohnkueche_fruehstueck
        - conditions:
            - condition: state
              entity_id: input_select.wohnkueche_lichtmodus
              state: werktag_abend_aktiv
          sequence:
            - service: script.wohnkueche_werktag_abend_aktiv
        - conditions:
            - condition: state
              entity_id: input_select.wohnkueche_lichtmodus
              state: werktag_relax
          sequence:
            - service: script.wohnkueche_werktag_relax
        - conditions:
            - condition: state
              entity_id: input_select.wohnkueche_lichtmodus
              state: spaetabend
          sequence:
            - service: script.wohnkueche_spaetabend
        - conditions:
            - condition: state
              entity_id: input_select.wohnkueche_lichtmodus
              state: nacht
          sequence:
            - service: script.wohnkueche_nacht
        - conditions:
            - condition: state
              entity_id: input_select.wohnkueche_lichtmodus
              state: wochenende_tag
          sequence:
            - service: script.wohnkueche_wochenende_tag
        - conditions:
            - condition: state
              entity_id: input_select.wohnkueche_lichtmodus
              state: wochenende_nachmittag
          sequence:
            - service: script.wochenende_nachmittag
        - conditions:
            - condition: state
              entity_id: input_select.wohnkueche_lichtmodus
              state: wochenende_abend
          sequence:
            - service: script.wohnkueche_wochenende_abend
        - conditions:
            - condition: state
              entity_id: input_select.wohnkueche_lichtmodus
              state: alles_aus
          sequence:
            - service: script.wohnkueche_alles_aus


#########################################################
# LICHTMODUS SETZEN + SOFORT AUSFÜHREN (Manuell, z. B. Dashboard-Taster)
# Ein einziger Service-Call: setzt input_select.wohnkueche_lichtmodus
# und ruft dann den Dispatcher auf. Vermeidet Mehrfach-Service-Actions
# im Dashboard (die sonst z. T. ignoriert werden).
#########################################################
wohnkueche_lichtszene_aktivieren:
  alias: Wohnküche – Lichtszene aktivieren
  mode: restart
  fields:
    scene:
      description: Zu aktivierender Lichtmodus
      example: fruehstueck
      required: true
      selector:
        select:
          options:
            - fruehstueck
            - werktag_abend_aktiv
            - werktag_relax
            - spaetabend
            - nacht
            - wochenende_tag
            - wochenende_nachmittag
            - wochenende_abend
            - alles_aus
  sequence:
    - service: input_select.select_option
      target:
        entity_id: input_select.wohnkueche_lichtmodus
      data:
        option: "{{ scene }}"
    - service: script.wohnkueche_lichtmodus_ausfuehren


#########################################################
# WERKTAG – FRÜHSTÜCK (06:00–08:00)
#########################################################
wohnkueche_fruehstueck:
  alias: Wohnküche Frühstück
  mode: restart
  sequence:
    - service: light.turn_on
      target:
        entity_id: light.esszimmer_licht
      data:
        brightness_pct: 50

    - service: light.turn_on
      target:
        entity_id: light.licht_kueche_fenster
      data:
        brightness_pct: 30

    - service: light.turn_off
      target:
        entity_id:
          - light.licht_kueche_fenster_2
          - light.licht_spuele_kueche
          - light.licht_vitrine_kueche
          - light.livingroom_main_light_2
          - light.livingroom_reading_light


#########################################################
# WERKTAG – ABEND AKTIV (18:00–20:00)
# Kochen, Putzen, Aufräumen
#########################################################
wohnkueche_werktag_abend_aktiv:
  alias: Wohnküche Werktag Abend Aktiv
  mode: restart
  sequence:
    # Küche Arbeitslicht
    - service: light.turn_on
      target:
        entity_id: light.licht_kueche_fenster_2
      data:
        brightness_pct: 85

    - service: light.turn_on
      target:
        entity_id: light.licht_spuele_kueche

    # Esszimmer
    - service: light.turn_on
      target:
        entity_id: light.esszimmer_licht
      data:
        brightness_pct: 70

    # Orientierung
    - service: light.turn_on
      target:
        entity_id: light.licht_kueche_fenster
      data:
        brightness_pct: 40

    # Alles andere aus
    - service: light.turn_off
      target:
        entity_id:
          - light.livingroom_main_light_2
          - light.livingroom_reading_light
          - light.licht_vitrine_kueche


#########################################################
# WERKTAG – RELAX (ab 20:00)
#########################################################
wohnkueche_werktag_relax:
  alias: Wohnküche Werktag Relax
  mode: restart
  sequence:
    # Küche aus
    - service: light.turn_off
      target:
        entity_id:
          - light.licht_kueche_fenster_2
          - light.licht_spuele_kueche

    # Akzent & Wohnlicht
    - service: light.turn_on
      target:
        entity_id: light.licht_vitrine_kueche

    - service: light.turn_on
      target:
        entity_id: light.esszimmer_licht
      data:
        brightness_pct: 55

    - service: light.turn_on
      target:
        entity_id: light.livingroom_reading_light
      data:
        brightness_pct: 55

    # Orientierung
    - service: light.turn_on
      target:
        entity_id: light.licht_kueche_fenster
      data:
        brightness_pct: 30

    - service: light.turn_off
      target:
        entity_id: light.livingroom_main_light_2


#########################################################
# SPÄTABEND (22:00–23:00)
#########################################################
wohnkueche_spaetabend:
  alias: Wohnküche Spätabend
  mode: restart
  sequence:
    - service: light.turn_on
      target:
        entity_id: light.licht_kueche_fenster
      data:
        brightness_pct: 30

    - service: light.turn_on
      target:
        entity_id: light.licht_vitrine_kueche

    - service: light.turn_on
      target:
        entity_id: light.livingroom_reading_light
      data:
        brightness_pct: 72

    - service: light.turn_off
      target:
        entity_id:
          - light.esszimmer_licht
          - light.licht_kueche_fenster_2
          - light.licht_spuele_kueche
          - light.livingroom_main_light_2


#########################################################
# NACHT (23:00–06:00)
#########################################################
wohnkueche_nacht:
  alias: Wohnküche Nacht
  mode: restart
  sequence:
    - service: light.turn_on
      target:
        entity_id: light.licht_kueche_fenster
      data:
        brightness_pct: 30

    - service: light.turn_off
      target:
        entity_id:
          - light.esszimmer_licht
          - light.licht_kueche_fenster_2
          - light.licht_spuele_kueche
          - light.licht_vitrine_kueche
          - light.livingroom_main_light_2
          - light.livingroom_reading_light


#########################################################
# WOCHENENDE – NACHMITTAG (14:00–18:00)
#########################################################
wochenende_nachmittag:
  alias: Wohnküche Wochenende Nachmittag
  mode: restart
  sequence:
    - service: light.turn_on
      target:
        entity_id: light.esszimmer_licht
      data:
        brightness_pct: 45

    - service: light.turn_on
      target:
        entity_id: light.licht_kueche_fenster
      data:
        brightness_pct: 30

    - service: light.turn_on
      target:
        entity_id: light.livingroom_main_light_2
      data:
        # Untergrenze 50 % — darunter kann das Leuchtmittel nicht dimmen
        brightness_pct: 50

    - service: light.turn_off
      target:
        entity_id:
          - light.licht_kueche_fenster_2
          - light.licht_spuele_kueche
          - light.licht_vitrine_kueche
          - light.livingroom_reading_light


#########################################################
# WOCHENENDE – TAG
#########################################################
wohnkueche_wochenende_tag:
  alias: Wohnküche Wochenende Tag
  mode: restart
  sequence:
    - service: light.turn_on
      target:
        entity_id: light.licht_kueche_fenster_2
      data:
        brightness_pct: 70

    - service: light.turn_on
      target:
        entity_id: light.licht_spuele_kueche

    - service: light.turn_on
      target:
        entity_id: light.esszimmer_licht
      data:
        brightness_pct: 60

    - service: light.turn_on
      target:
        entity_id: light.livingroom_main_light_2
      data:
        # Untergrenze 50 % — darunter kann das Leuchtmittel nicht dimmen
        brightness_pct: 50

    - service: light.turn_off
      target:
        entity_id:
          - light.livingroom_reading_light
          - light.licht_vitrine_kueche


#########################################################
# WOCHENENDE – ABEND
#########################################################
wohnkueche_wochenende_abend:
  alias: Wohnküche Wochenende Abend
  mode: restart
  sequence:
    - service: light.turn_on
      target:
        entity_id: light.licht_vitrine_kueche

    - service: light.turn_on
      target:
        entity_id: light.esszimmer_licht
      data:
        brightness_pct: 60

    - service: light.turn_on
      target:
        entity_id: light.livingroom_reading_light
      data:
        brightness_pct: 55

    - service: light.turn_off
      target:
        entity_id:
          - light.licht_kueche_fenster_2
          - light.licht_spuele_kueche
          - light.livingroom_main_light_2

#########################################################
# ALLES AUS – manuell per Sprache/Panel aktivierbar
#########################################################
wohnkueche_alles_aus:
  alias: Wohnküche Alles Aus
  mode: restart
  sequence:
    - service: light.turn_off
      target:
        entity_id:
          - light.esszimmer_licht
          - light.licht_kueche_fenster
          - light.licht_kueche_fenster_2
          - light.licht_spuele_kueche
          - light.licht_vitrine_kueche
          - light.livingroom_main_light_2
          - light.livingroom_reading_light


#########################################################
# RAUCHALARM – BENACHRICHTIGUNGEN
#########################################################

notify_smoke_alarm:
  alias: Rauchalarm Benachrichtigung
  description: Sendet Rauchalarm an alle Geräte
  mode: parallel
  fields:
    location:
      description: Ort des Rauchmelders (z.B. Keller Hobbyraum)
      example: Hobbyraum Keller

  sequence:
    - service: notify.ipad_von_sebastian
      continue_on_error: true
      data:
        message: "🚨 Rauchmelder {{ location }} hat ausgelöst!"

    - service: notify.iphone_von_sebastian
      continue_on_error: true
      data:
        message: "🚨 Rauchmelder {{ location }} hat ausgelöst!"

    - service: notify.macbook_von_sebastian
      continue_on_error: true
      data:
        message: "🚨 Rauchmelder {{ location }} hat ausgelöst!"

    - service: notify.sebastians_company_macbook_pro
      continue_on_error: true
      data:
        message: "🚨 Rauchmelder {{ location }} hat ausgelöst!"

#########################################################
# WINDALARM – BENACHRICHTIGUNGEN
#########################################################

notify_wind_alarm:
  alias: Windalarm Benachrichtigung
  description: Sendet Windalarm an alle Geräte
  mode: parallel
  fields:
    alarm_name:
      description: Name des Windalarms (z.B. Schwelle 1)
      example: Schwelle 1
    state:
      description: Status des Alarms
      example: aktiviert

  sequence:
    - service: notify.ipad_von_sebastian
      continue_on_error: true
      data:
        message: "💨 Windalarm {{ alarm_name }} {{ state }}!"

    - service: notify.iphone_von_sebastian
      continue_on_error: true
      data:
        message: "💨 Windalarm {{ alarm_name }} {{ state }}!"

    - service: notify.macbook_von_sebastian
      continue_on_error: true
      data:
        message: "💨 Windalarm {{ alarm_name }} {{ state }}!"

    - service: notify.sebastians_company_macbook_pro
      continue_on_error: true
      data:
        message: "💨 Windalarm {{ alarm_name }} {{ state }}!"


#########################################################
# GARAGE – ABENDWARNUNG (offen um 21:00)
#########################################################

notify_garage_offen:
  alias: Garage – Abendwarnung Benachrichtigung
  description: Sendet Abendwarnung (Garage/Tür noch offen) an alle Geräte
  mode: parallel
  fields:
    message:
      description: Warnungstext
      example: "🚗 Garagentor ist um 21 Uhr noch offen!"

  sequence:
    - service: notify.ipad_von_sebastian
      continue_on_error: true
      data:
        message: "{{ message }}"
    - service: notify.iphone_von_sebastian
      continue_on_error: true
      data:
        message: "{{ message }}"
    - service: notify.macbook_von_sebastian
      continue_on_error: true
      data:
        message: "{{ message }}"
    - service: notify.sebastians_company_macbook_pro
      continue_on_error: true
      data:
        message: "{{ message }}"

#########################################################
# HAUS – MORGENMODUS (ROLLOS ÖFFNEN)
# Wird durch Haus-Tagesmodus getriggert
# Erweiterbar: Licht, Heizung, Musik
#########################################################

house_morning_workday:
  alias: Haus – Morgen Werktag
  mode: single
  sequence:
    - if:
        - condition: state
          entity_id: input_boolean.beschattung_lock_schlafzimmer
          state: "off"
      then:
        - service: cover.open_cover
          target:
            entity_id:
              - cover.bedroom_shutter


house_morning_weekend:
  alias: Haus – Morgen Wochenende
  mode: single
  sequence:
    - if:
        - condition: state
          entity_id: input_boolean.beschattung_lock_schlafzimmer
          state: "off"
      then:
        - service: cover.open_cover
          target:
            entity_id:
              - cover.bedroom_shutter


